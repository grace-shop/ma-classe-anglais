/* ============ events ============ */
document.addEventListener("input",e=>{const el=e.target;if(!el.id||el.type==="file")return;S.drafts[el.id]=el.type==="checkbox"?(el.checked?"1":""):el.value;
  if(el.id==="st_q"||el.id==="st_cls"||el.id==="st_on"||el.id==="st_grp"||el.id==="gv_q"||el.id==="gv_all"||el.id==="ms_q"){S.stLim=ST_STEP;S.gvLim=GV_STEP;S.flim={};S.msLim=15;if(el.id==="st_grp")S.fopen={};render();return}
  if(el.id==="q_exam"){render();return}
  if(/_prof$/.test(el.id)){delete S.drafts[el.id.replace(/_prof$/,"_cls")];render();return}
  if(el.id==="q_body"){const n=parseQuiz(el.value).length,p=$("#q_preview");if(p)p.textContent=n?`${n} question(s) reconnue(s).`:"Aucune question reconnue pour l'instant."}
  if(el.id==="d_body"){const n=parseDeck(el.value).length,p=$("#d_preview");if(p)p.textContent=n?`${n} mot(s) reconnu(s).`:"Aucun mot reconnu pour l'instant."}
  if(el.id.startsWith("hw_")){const n=el.value.trim()?el.value.trim().split(/\s+/).length:0,p=document.getElementById("wc_"+el.id.slice(3));if(p)p.textContent=n+(n>1?" mots":" mot")}});
document.addEventListener("change",e=>{const el=e.target;if(el.type==="file"&&el.id&&el.id.startsWith("cpf_")){const key=el.id.replace(/^cpf_(cam_)?/,""),fl=[...el.files];el.value="";addCopies(key,fl);return}if(el.id==="pic_file"){picFile(el.files&&el.files[0]);el.value="";return}if(el.id==="lv_cls"){S.liveClass=el.value;delete S.drafts.lv_quiz;render();return}if(el.id==="att_date"){S.drafts.att_date=el.value||today();S.attDraft=null;render();return}if(el.tagName==="SELECT"&&/_prof$/.test(el.id)){S.drafts[el.id]=el.value;delete S.drafts[el.id.replace(/_prof$/,"_cls")];render();return}
  if(el.type==="checkbox"&&el.id){S.drafts[el.id]=el.checked?"1":"";if(el.id==="q_exam"||el.id==="h_auto"||el.id==="e_auto")render()}});
document.addEventListener("keydown",e=>{if(e.target&&e.target.id==="talkIn"&&e.key==="Enter"&&!e.shiftKey&&matchMedia("(hover:hover)").matches){e.preventDefault();talkSend(e.target.value);return}if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-a][tabindex]")){e.preventDefault();e.target.click()}});
if(matchMedia("(hover:hover)").matches&&!reduceMotion){document.addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest(".tilt");document.querySelectorAll(".tilt[style]").forEach(x=>{if(x!==c)x.removeAttribute("style")});if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty("--ry",((e.clientX-r.left)/r.width-.5)*8+"deg");c.style.setProperty("--rx",(.5-(e.clientY-r.top)/r.height)*8+"deg")},{passive:true})}
function finishDeck(st,d){if(st.i<st.order.length)return;
  if(st.newKnown.length&&S.mode==="student"){st.gained=st.newKnown.length*5;gain(st.gained,`A révisé « ${d.title} » : ${st.knownNow}/${st.order.length} mots`,{deckProgress:{[d.id]:{known:[...new Set([...knownOf(d),...st.newKnown])]}}})}
  if(st.knownNow){beep("win");confetti()}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
document.addEventListener("click",e=>{const say_=e.target.closest("[data-say]");if(say_){say(say_.dataset.say);return}
  const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,id=el.dataset.id;
  switch(a){
  case"tab":go(el.dataset.k);if(el.dataset.k==="pmsg"&&isParent(S.me)&&studentUnread(S.me))write(()=>meRef().update({studentReadAt:Date.now()}));break;
  case"switch":S.mode=S.mode==="teacher"?"student":"teacher";S.tab=null;S.view=null;S.run=null;S.deck=null;S.animate=true;break;
  case"sound":S.sound=!S.sound;try{localStorage.setItem("mca_sound",S.sound?"1":"0")}catch(err){}break;
  case"say":say(el.dataset.t);return;
  case"back":if(S.view?.type==="chat")closeChat();S.view=null;S.animate=true;break;
  case"openLesson":{S.view={type:"lesson",id};S.animate=true;scrollTo(0,0);const l=S.lessons.find(x=>x.id===id);if(l&&S.me&&S.mode==="student"){if(!(S.me.lessonsRead||{})[id])gain(20,"Lit la leçon : "+l.title,{lessonsRead:{[id]:Date.now()}});else touch("Relit la leçon : "+l.title)}break}
  case"openHw":{S.view={type:"hw",id};S.animate=true;scrollTo(0,0);const h=S.homework.find(x=>x.id===id);if(h)touch("Regarde le devoir : "+h.title);break}
  case"openStudent":S.view={type:"student",id};S.animate=true;scrollTo(0,0);break;
  case"startQuiz":{const q=S.quizzes.find(x=>x.id===id);if(!q)return;
    if(q.exam&&S.mode==="student"&&examTaken(S.me,id)){toast("Tu as déjà passé cet examen.","timer");break}
    S.confirm=null;S.view=null;S.run={quizId:id,i:0,picked:null,score:0,answers:[],wrong:[],combo:0,best:0,exam:!!q.exam,deadline:Date.now()+(q.minutes||10)*60000};S.animate=true;scrollTo(0,0);
    if(q.exam)touch("Passe l'examen : "+q.title,{examStarted:{[id]:Date.now()}});else touch("Joue au quiz : "+q.title);break}
  case"askExam":S.confirm="exam"+id;break;
  case"askQuitExam":S.confirm="quitExam";break;
  case"submitExam":{S.confirm=null;const q=curQuiz();if(q)finishQuiz(q);break}
  case"openChat":{const sid=S.mode==="teacher"?id:S.uid;if(!sid)break;S.view={type:"chat",id:sid};S.run=null;S.deck=null;S.animate=true;subChat(sid);scrollTo(0,0);
    if(S.mode==="teacher"){const st=person(sid);if(st&&teacherUnread(st))write(()=>S.db.doc("students/"+sid).update({teacherReadAt:Date.now()}))}
    else if(studentUnread(S.me))write(()=>meRef().update({studentReadAt:Date.now()}));break}
  case"editItem":startEdit(el.dataset.k,id);S.tab="content";S.view=null;break;
  case"cancelEdit":cancelEdit();break;

    if(r.exam){if(isRight(cur,ans))r.score++;else r.wrong.push(r.i);r.i++;if(r.i>=q.questions.length)finishQuiz(q);render();document.getElementById("typeAns")?.focus();return}
    r.picked=ans;if(cur.say&&canSpeak)setTimeout(()=>say(cur.say),350);
    if(isRight(cur,ans)){r.score++;r.combo++;r.best=Math.max(r.best,r.combo);beep("ok");if(S.mode==="student")xpFloat(10,f)}else{r.combo=0;r.wrong.push(r.i);beep("bad")}
    render();$("#nextBtn")?.focus({preventScroll:true});return}
  if(k==="listenAns"){const st=S.deck,d=S.decks.find(x=>x.id===st?.id);if(!d)return;const idx=st.order[st.i],c=d.cards[idx],ans=v("listenAns");if(!ans||st.checked)return;st.checked=true;st.lastAns=ans;st.lastOk=norm(ans)===norm(c.en);
    if(st.lastOk){st.knownNow++;beep("ok");if(!knownOf(d).includes(idx)&&!st.newKnown.includes(idx)){st.newKnown.push(idx);if(S.mode==="student")xpFloat(5,f)}}else beep("bad");
    delete S.drafts.listenAns;render();$("#nextBtn")?.focus({preventScroll:true});return}
  const clear=ids=>{ids.forEach(i=>delete S.drafts[i]);f.reset()};
  if(k==="join"&&S.drafts.j_role==="parent"){const name=v("j_name"),childName=v("j_child");if(!name||!childName)return;const now=Date.now();
    write(()=>meRef().set({name,profile:"parent",teacherId:v("j_teacher")||principalId()||"",childName,childClasse:v("j_childcls"),joinedAt:now,lastActive:now,activity:"Parent : vient de rejoindre",...(S.isOwner||S.isStaff?{preview:true}:{})})).then(()=>{if(!S.writeBlocked){["j_role","j_name"].forEach(i=>delete S.drafts[i]);toast("Bienvenue dans l'espace parent","family");S.animate=true;render()}});return}
  if(k==="join"){const name=v("j_name");if(!name)return;const now=Date.now(),level=v("j_level"),profile=S.drafts.j_role||"lycee",classe=composeClasse(v("j_cls"),v("j_serie"));delete S.drafts.j_role;delete S.drafts.j_name;
    write(()=>meRef().set({name,level,profile,classe,teacherId:v("j_teacher")||principalId()||"",joinedAt:now,lastActive:now,activity:"Vient de rejoindre la classe",xp:0,streak:1,lastDay:today(),dayXp:0,attempts:[],submissions:{},feedback:{},lessonsRead:{},badges:{},deckProgress:{},...(S.isOwner||S.isStaff?{preview:true}:{})}))
      .then(()=>{if(!S.isOwner)return write(()=>S.db.doc("board/"+S.uid).set({name,level,xp:0,streak:1,teacherId:v("j_teacher")||principalId()||"",updatedAt:now}))}).then(()=>{if(!S.writeBlocked){toast("Bienvenue dans la classe !","rocket");confetti();S.animate=true}})}
  else if(k==="submitHw"){submitCopy("hw",f)}
  else if(k==="lesson"){saveContent("lessons",{title:v("l_title"),level:v("l_level"),audience:v("l_aud")||"tous",classe:v("l_cls"),unit:parseInt(v("l_unit"))||0,theme:v("l_theme"),grammar:v("l_gram"),body:document.getElementById("l_body").value.trim()}).then(ed=>{clear(FORM_FIELDS.lesson);toast(ed?"Leçon modifiée":"Leçon publiée","book");render()})}
  else if(k==="quiz"){const questions=parseQuiz(document.getElementById("q_body").value);if(!questions.length){toast("Aucune question reconnue : vérifie les * et les -.","x");return}
    const exam=!!document.getElementById("q_exam")?.checked,mins=Math.max(1,Math.min(180,parseInt(v("q_min"))||10));
    const d={title:v("q_title"),level:v("q_level"),audience:v("q_aud")||"tous",questions,lessonId:v("q_lesson"),exam,minutes:mins};
    saveContent("quizzes",d).then(ed=>{clear(FORM_FIELDS.quiz);toast(ed?"Quiz modifié":exam?`Examen publié (${questions.length} questions, ${mins} min)`:`Quiz publié (${questions.length} questions)`,exam?"timer":"bolt");render()})}
  else if(k==="deck"){const cards=parseDeck(document.getElementById("d_body").value);if(!cards.length){toast("Aucun mot reconnu : utilise anglais | français.","x");return}
    saveContent("decks",{title:v("d_title"),level:v("d_level"),audience:v("d_aud")||"tous",cards}).then(ed=>{clear(FORM_FIELDS.deck);toast(ed?"Liste modifiée":`Liste publiée (${cards.length} mots)`,"cards");render()})}
  else if(k==="hw"){(async()=>{const btn=f.querySelector('button[type="submit"]');if(btn)btn.disabled=true;
    try{const ed=S.editing&&S.editing.kind==="homework"?S.editing:null,prev=ed?S.homework.find(x=>x.id===ed.id):null,prevC=ed?(S.corriges[ed.id]||{}):{};
      const sc=S.scan.hw;let fl=null;if(sc&&sc.blob){if(sc.busy)throw{code:"busy"};if(!S.assets)throw{code:"no_assets"};const type=sc.type||"image/jpeg",r=await S.assets.upload(sc.blob,{type});fl={id:r.id,name:sc.name,type}}
      const instr=(document.getElementById("h_body")?.value||"").trim(),fid=fl?fl.id:(prev?.fileId||"");
      if(!instr&&!fid){toast("Écris les consignes ou ajoute une photo ou un fichier.","x");return}
      const cor=(document.getElementById("h_cor")?.value||"").trim(),pub=!!cor&&document.getElementById("h_corpub")?.value==="1";
      const data={title:v("h_title"),level:v("h_level"),audience:v("h_aud")||"tous",due:v("h_due"),instructions:instr,fileId:fid,fileName:fl?fl.name:(prev?.fileName||""),fileType:fl?fl.type:(prev?.fileType||""),autoCorrect:!!document.getElementById("h_auto")?.checked,autoMode:S.drafts.h_amode==="draft"?"draft":"live",corrigeVisible:pub,corrigePublic:pub?{text:cor}:null};
      let id;if(ed){id=ed.id;await write(()=>S.db.doc("homework/"+id).update(data))}else{const ref=S.db.collection("homework").doc();id=ref.id;await write(()=>ref.set({...data,teacherId:S.uid,createdAt:Date.now()}))}
      if(cor)await write(()=>S.db.doc("corriges/"+id).set({text:cor}));else if(prevC.text)await write(()=>S.db.doc("corriges/"+id).delete());
      S.editing=null;clear(FORM_FIELDS.hw);clearScan("hw");toast(ed?"Devoir modifié":"Devoir publié","pen")}
    catch(err){const c=err&&err.code;toast(c==="too_large"?"Fichier trop lourd (20 Mo maximum).":c==="unsupported_type"?"Format non accepté : utilise un PDF ou une image.":c==="no_assets"?"L'envoi de fichiers n'est pas disponible ici.":c==="busy"?"Attends la fin de l'amélioration de la photo.":"Enregistrement impossible. Réessaie.","x")}
    finally{if(btn)btn.disabled=false;render()}})();return}
  else if(k==="chat"){const sid=f.dataset.s,text=v("chatInput");if(!text)return;const at=Date.now(),from=S.mode==="teacher"?"teacher":"student";delete S.drafts.chatInput;f.reset();
    write(()=>S.db.collection("students/"+sid+"/msgs").add({from,text,at})).then(()=>write(()=>S.db.doc("students/"+sid).update(from==="teacher"?{lastMsgAt:at,lastMsgFrom:"teacher",lastMsgText:text.slice(0,80),teacherReadAt:at}:{lastMsgAt:at,lastMsgFrom:"student",lastMsgText:text.slice(0,80),studentReadAt:at,lastActive:at,activity:"A écrit à la prof"})));
    if(from==="student")presence("Écrit un message");return}
  else if(k==="talk"){talkSend(document.getElementById("talkIn")?.value||"")}
  else if(k==="reward"){const cost=Math.max(10,Math.round(+v("rw_cost")||0));saveContent("rewards",{title:v("rw_title"),cost,desc:v("rw_desc")}).then(()=>{for(const x of["rw_title","rw_cost","rw_desc"])delete S.drafts[x];toast("Récompense ajoutée","gift")})}
  else if(k==="pic"){if(!S.picDraft?.blob){toast("Ajoute d'abord une photo.","x");return}if(!S.assets){toast("L'envoi de photos n'est pas disponible ici.","x");return}if(S.picBusy)return;S.picBusy=true;render();
    (async()=>{try{const up=await S.assets.upload(S.picDraft.blob,{type:"image/jpeg"});const alt=v("pic_alt").split("/").map(x=>x.trim()).filter(Boolean);
      await write(()=>S.db.collection("pictures").add({picId:up.id,kind:v("pic_kind")||"noun",prompt:v("pic_q"),answer:v("pic_ans"),alt,fr:v("pic_fr"),level:v("pic_level")||"A1",audience:v("pic_aud")||"tous",teacherId:S.uid,createdAt:Date.now()}));
      for(const x of["pic_kind","pic_q","pic_ans","pic_alt","pic_fr","pic_level","pic_aud"])delete S.drafts[x];if(S.picDraft?.url)URL.revokeObjectURL(S.picDraft.url);S.picDraft=null;toast("Image publiée dans les jeux d'images","camera")}catch(e){toast("Envoi impossible pour le moment.","x")}S.picBusy=false;render()})()}
  else if(k==="gbEval"){const date=v("ge_date")||today(),tr=triOf(dateTs(date))||selTri(),id="e"+Date.now().toString(36),gb=S.gb||{};const e={title:v("ge_title"),type:v("ge_type")||"interro",date,max:Math.max(1,+v("ge_max")||20),y:tr.y,t:tr.t,at:Date.now()};
    write(()=>S.db.doc("gradebook/"+S.uid).set({...gb,evals:{...(gb.evals||{}),[id]:e}})).then(()=>{for(const x of["ge_title","ge_type","ge_date","ge_max"])delete S.drafts[x];S.gbTri={y:tr.y,t:tr.t};S.gbEdit=id;toast("Évaluation créée : saisis les notes","check");render()})}
  else if(k==="gbCoef"){const gb=S.gb||{},c={};for(const x of["interro","devoir","quiz"])c[x]=Math.max(0,Math.min(10,+v("gc_"+x)||0));write(()=>S.db.doc("gradebook/"+S.uid).set({...gb,coef:c})).then(()=>{for(const x of["interro","devoir","quiz"])delete S.drafts["gc_"+x];toast("Coefficients enregistrés","check")})}
  else if(k==="gbMarks"){const id=f.dataset.id,gb=S.gb||{},e=(gb.evals||{})[id];if(!e)return;const mk={};for(const st of S.students){const raw=v(`gm_${id}_${st.id}`).replace(",",".");if(raw==="")continue;const n=Math.max(0,Math.min(+e.max||20,+raw));if(!isNaN(n))mk[st.id]=n}
    write(()=>S.db.doc("gradebook/"+S.uid).set({...gb,marks:{...(gb.marks||{}),[id]:mk}})).then(()=>{for(const kk of Object.keys(S.drafts))if(kk.startsWith(`gm_${id}_`))delete S.drafts[kk];S.gbEdit=null;toast(`${Object.keys(mk).length} note(s) enregistrée(s)`,"check");render()})}
  else if(k==="appr"){const sid=f.dataset.id;write(()=>S.db.doc("students/"+sid).update({appreciation:v("ap_"+sid)})).then(()=>{delete S.drafts["ap_"+sid];toast("Appréciation enregistrée","check")})}
  else if(k==="ann"){write(()=>S.db.collection("announcements").add({text:v("a_text"),teacherId:S.uid,createdAt:Date.now()})).then(()=>{clear(["a_text"]);toast("Annonce publiée","mega")})}
  else if(k==="ep"){(async()=>{const btn=$("#e_submit");if(btn)btn.disabled=true;
    try{const up=async k=>{const sc=S.scan[k];if(!sc||!sc.blob)return null;if(sc.busy)throw{code:"busy"};if(!S.assets)throw{code:"no_assets"};const type=sc.type||"image/jpeg";const r=await S.assets.upload(sc.blob,{type});return{id:r.id,name:sc.name,type}};
      const ed=S.editing&&S.editing.kind==="epreuves"?S.editing:null,prev=ed?S.eps.find(x=>x.id===ed.id):null,prevC=ed?(S.corriges[ed.id]||{}):{};
      const suj=await up("sujet"),cor=await up("cor");
      const data={title:v("e_title"),exam:v("e_exam"),year:v("e_year"),level:v("e_level"),audience:v("e_aud")||"tous",minutes:Math.max(0,parseInt(v("e_min"))||0),autoCorrect:!!document.getElementById("e_auto")?.checked,autoMode:S.drafts.e_amode==="draft"?"draft":"live",sujet:(document.getElementById("e_sujet")?.value||"").trim(),fileId:suj?suj.id:(prev?.fileId||""),fileName:suj?suj.name:(prev?.fileName||""),fileType:suj?suj.type:(prev?.fileType||"")};
      if(!data.sujet&&!data.fileId){toast("Ajoute le texte du sujet ou un fichier.","x");return}
      const corr={text:(document.getElementById("e_cor")?.value||"").trim(),fileId:cor?cor.id:(prevC.fileId||""),fileName:cor?cor.name:(prevC.fileName||""),fileType:cor?cor.type:(prevC.fileType||"")};
      let id;if(ed){id=ed.id;await write(()=>S.db.doc("epreuves/"+id).update(data))}else{const ref=S.db.collection("epreuves").doc();id=ref.id;await write(()=>ref.set({...data,teacherId:S.uid,createdAt:Date.now(),corrigeVisible:false}))}
      await write(()=>S.db.doc("corriges/"+id).set(corr));
      if(document.getElementById("e_corpub")?.checked&&(corr.text||corr.fileId))await write(()=>S.db.doc("epreuves/"+id).update({corrigeVisible:true,corrigePublic:corr}));
      if(prev?.corrigeVisible)await write(()=>S.db.doc("epreuves/"+id).update({corrigePublic:corr}));
      S.editing=null;FORM_FIELDS.ep.forEach(i=>delete S.drafts[i]);clearScan("sujet");clearScan("cor");f.reset();toast(ed?"Épreuve modifiée":"Épreuve publiée","file")}
    catch(err){const c=err&&err.code;toast(c==="too_large"?"Fichier trop lourd (20 Mo maximum).":c==="unsupported_type"?"Format non accepté : utilise un PDF ou une image.":c==="no_assets"?"L'envoi de fichiers n'est pas disponible ici.":c==="quota_or_state"?"Espace de stockage plein.":c==="busy"?"Attends la fin de l'amélioration de la photo.":"Enregistrement impossible. Réessaie.","x")}
    finally{if(btn)btn.disabled=false;render()}})();return}
  else if(k==="submitEp"){submitCopy("ep",f)}
  else if(k==="grade"){const s=f.dataset.s,h=f.dataset.h,key=s+"_"+h,isEp=f.dataset.kind==="ep";const grade=Math.max(0,Math.min(20,parseFloat(v("g_"+key))));if(isNaN(grade))return;
    write(()=>S.db.doc("students/"+s).update({[isEp?"epreuveFb":"feedback"]:{[h]:{grade,comment:v("c_"+key),at:Date.now(),auto:false}}})).then(()=>S.corriges["draft_"+key]?write(()=>S.db.doc("corriges/draft_"+key).delete()):0).then(()=>{delete S.drafts["g_"+key];delete S.drafts["c_"+key];toast("Correction envoyée","check")})}
  else if(k==="setLevel"){const s=f.dataset.id,upd={level:v("lv_"+s),profile:v("pf_"+s),classe:v("cl_"+s)};if(document.getElementById("tc_"+s))upd.teacherId=v("tc_"+s);write(()=>S.db.doc("students/"+s).update(upd)).then(()=>toast("Fiche mise à jour","check"))}
  else if(k==="aiGen"){const topic=v("ag_free")||v("ag_topic");const n=parseInt(v("ag_n"))||10;delete S.drafts.ag_free;aiGenQuiz(topic,n);return}
  else if(k==="joinProf"){const name=v("j_name");if(!name)return;write(()=>S.db.doc("staffRequests/"+S.uid).set({name,subject:v("j_subject"),at:Date.now()})).then(()=>{delete S.drafts.j_role;toast("Demande envoyée à la prof principale","send")});return}
  else if(k==="examDates"){const ed={};for(const x of ["CEPD","BEPC","BAC I","BAC II"]){const val=v("ed_"+x.replace(" ","_"));if(val)ed[x]=val}write(()=>S.db.doc("settings/main").set({...S.settings,examDates:ed})).then(()=>toast("Dates des examens enregistrées","timer"));return}
  else if(k==="parentProfile"){write(()=>meRef().update({childName:v("pp_child"),childClasse:v("pp_cls")})).then(()=>toast("Profil enregistré","check"));return}
  else if(k==="profile"){const profile=v("p_prof"),classe=composeClasse(v("p_cls"),v("p_serie"));["p_prof","p_cls","p_serie"].forEach(i=>delete S.drafts[i]);write(()=>meRef().update({profile,classe})).then(()=>{toast("Profil enregistré","check");S.animate=true;render()});return}
  render()});
render();
loadThree();
</script>
