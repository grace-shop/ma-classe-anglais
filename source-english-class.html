<title>Ma Classe d'Anglais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: porcelain app — soft light ground with slow pearl 3D behind, white cards with hairline borders, ink primary + gold for rewards; sticky header, segmented nav (top on desktop, bottom bar on phone) */
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --surface2:#F7F8FB; --line:#E3E6EE; --line2:#D2D6E3;
  --fg:#141833; --muted:#646A85; --ink:#1E2558; --ink-soft:#ECEEF8;
  --sky:#4B6BD6; --sky-soft:#E8EDFB; --gold:#A8823A; --gold-soft:#F6EFDF; --rose:#B4546F; --rose-soft:#F8E8EE;
  --ok:#1D8A5F; --ok-soft:#E2F3EA; --bad:#C0394F; --bad-soft:#FAE5E9;
  --cyan:var(--sky); --coral:var(--rose); --glass2:var(--surface2);
  --grad:linear-gradient(120deg,#1E2558 0%,#3F55C4 100%);
  --gradtext:linear-gradient(100deg,#1E2558 0%,#4B6BD6 55%,#A8823A 100%);
  --shadow:0 1px 2px rgba(20,24,60,.04),0 10px 30px rgba(20,24,60,.06);
  --shadow-lg:0 2px 6px rgba(20,24,60,.05),0 24px 60px rgba(20,24,60,.10);
  --f-display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:22px; color-scheme:light;
  --glass-bg:rgba(255,255,255,.86); --header-bg:rgba(242,243,247,.78); --nav-bg:rgba(255,255,255,.88); --hero-bg:linear-gradient(135deg,rgba(255,255,255,.95),rgba(248,249,253,.88)); --empty-bg:rgba(255,255,255,.6); --flash-front:linear-gradient(160deg,#FFFFFF,#F1F3FA); --overlay:rgba(20,24,51,.35); --ink-hover:#2A3372; --on-ink:#FFFFFF; --warn-ink:#765417; --ok-ink:#126042; --bad-ink:#9E2639;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;min-height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased}
#bg3d{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none;opacity:.9}
.aurora{position:fixed;inset:-10%;z-index:0;pointer-events:none;background:
  radial-gradient(38% 32% at 12% 8%,rgba(75,107,214,.10),transparent 70%),
  radial-gradient(32% 30% at 92% 18%,rgba(168,130,58,.09),transparent 70%),
  radial-gradient(40% 36% at 60% 100%,rgba(180,84,111,.06),transparent 70%)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:70;pointer-events:none}
.wrap{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 120px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;margin-inline:-16px;padding-inline:16px;background:var(--header-bg);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-bottom:1px solid rgba(211,214,227,.55)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;border-radius:13px;background:var(--grad);display:grid;place-items:center;font-family:var(--f-display);font-style:italic;font-size:1.25rem;color:#fff;flex:none;box-shadow:0 6px 16px rgba(30,37,88,.25)}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:1.45rem;margin:0;line-height:1;white-space:nowrap;letter-spacing:-.01em}
.brand small{display:block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:3px}
.hdr-right{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.85rem;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.pill.fire{color:var(--gold)}
.pill.xp{color:var(--ink)}
.iconbtn{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--surface);border:1px solid var(--line);color:var(--ink);cursor:pointer;box-shadow:var(--shadow)}
.iconbtn:hover{border-color:var(--line2)}
@media (max-width:520px){.brand h1,.brand small{display:none}}

/* nav */
nav.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:9;display:flex;gap:2px;padding:5px;margin:14px auto 28px;width:max-content;max-width:100%;border-radius:999px;background:var(--nav-bg);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow)}
nav.tabs button{position:relative;display:flex;align-items:center;gap:7px;font:inherit;font-weight:600;font-size:.92rem;color:var(--muted);background:none;border:0;padding:9px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button svg{width:18px;height:18px}
nav.tabs button[aria-current="true"]{color:var(--on-ink);background:var(--ink);box-shadow:0 4px 14px rgba(30,37,88,.25)}
nav.tabs .count{position:absolute;top:1px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rose);color:#fff;font-size:.66rem;display:grid;place-items:center;font-weight:700}
@media (max-width:760px){
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;margin:0;border-radius:24px 24px 0 0;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:var(--nav-bg);border-width:1px 0 0}
  nav.tabs button{flex-direction:column;gap:3px;font-size:.66rem;padding:7px 4px;border-radius:14px;flex:1;min-width:0}
  nav.tabs button svg{width:22px;height:22px}
  nav.tabs .count{right:calc(50% - 22px)}
}

/* type */
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.6rem,4vw,2.15rem);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-family:var(--f-body);font-weight:700;font-size:1.04rem;margin:0;text-wrap:balance;line-height:1.35}
.gradtext{background:var(--gradtext);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic;padding-right:.08em}
.eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sub{color:var(--muted);margin:6px 0 0;font-size:.98rem;max-width:62ch}
.muted{color:var(--muted)} .small{font-size:.86rem} .mono{font-family:var(--f-mono)}

/* layout */
.section{display:grid;gap:16px;margin-bottom:40px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.glass{background:var(--glass-bg);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);min-width:0}
.card{padding:20px;display:grid;gap:10px;align-content:start;position:relative;overflow:hidden}
.card .glow{display:none}
.card.click,.tilt{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s}
.card.click{cursor:pointer}
.card.click:hover,.tilt:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--line2)}
.card .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.card .ic svg{width:21px;height:21px}
.t-cyan{background:var(--sky-soft);color:var(--sky)} .t-coral{background:var(--rose-soft);color:var(--rose)} .t-gold{background:var(--gold-soft);color:var(--gold)} .t-ok{background:var(--ok-soft);color:var(--ok)} .t-grad{background:var(--grad);color:#fff}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;letter-spacing:.02em;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip svg{width:13px;height:13px}
.chip.lvl{background:var(--ink-soft);color:var(--ink);border-color:transparent;font-family:var(--f-mono)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.ex{background:transparent;border:1px dashed var(--line2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 0 rgba(29,138,95,.5);animation:ping 2.2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(29,138,95,.45)}80%,100%{box-shadow:0 0 0 8px rgba(29,138,95,0)}}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;font-size:.92rem;border-radius:999px;padding:11px 20px;border:0;background:var(--ink);color:var(--on-ink);cursor:pointer;box-shadow:0 6px 18px rgba(30,37,88,.22);transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{background:var(--ink-hover);transform:translateY(-1px);box-shadow:0 10px 24px rgba(30,37,88,.28)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:none;border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn.sm{padding:7px 14px;font-size:.84rem}
.btn svg{width:17px;height:17px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
label{display:grid;gap:6px;font-weight:700;font-size:.88rem}
input,select,textarea{font:inherit;font-weight:500;color:var(--fg);background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:11px 14px;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--sky);outline:none;box-shadow:0 0 0 4px rgba(75,107,214,.12)}
textarea{min-height:120px;resize:vertical}
.form{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.hint{font-size:.8rem;color:var(--muted);font-weight:500}
pre.fmt{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px;font-family:var(--f-mono);font-size:.78rem;overflow-x:auto;margin:0;color:var(--muted)}
.seg{display:inline-flex;gap:2px;flex-wrap:wrap;padding:4px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);justify-self:start}
.seg button{font:inherit;font-weight:600;font-size:.88rem;padding:8px 16px;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* hero */
.hero{padding:clamp(22px,4vw,36px);display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center;position:relative;overflow:hidden;background:var(--hero-bg);box-shadow:var(--shadow-lg)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 90% at 100% 0%,rgba(75,107,214,.08),transparent 60%),radial-gradient(50% 80% at 0% 100%,rgba(168,130,58,.07),transparent 60%)}
.hero>*{position:relative}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero h2{font-size:clamp(2rem,6vw,3.1rem);line-height:1.02}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:760px){.stats{justify-content:flex-start}}
.ring{position:relative;width:108px;height:108px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring .lbl b{font-family:var(--f-display);font-size:2rem;font-weight:400}
.ring .lbl span{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.statbox{display:grid;gap:0;padding:12px 18px;min-width:118px;box-shadow:none;background:var(--surface)}
.statbox b{font-family:var(--f-display);font-size:1.9rem;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.1}
.statbox span{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.flame{color:var(--gold)}
.bar{height:6px;border-radius:4px;background:var(--ink-soft);overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--grad);border-radius:4px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.gold i{background:linear-gradient(90deg,#C9A45C,var(--gold))}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:16px 18px;display:grid;gap:2px;box-shadow:none;background:var(--surface)}
.kpi b{font-family:var(--f-display);font-weight:400;font-size:2.1rem;font-variant-numeric:tabular-nums;line-height:1.05}
.kpi b small{font-size:.55em}
.kpi span{font-size:.66rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:700}

/* tables */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem;min-width:640px}
th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface2)}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface2)}
td.num,.num{font-variant-numeric:tabular-nums}
.mini{height:5px;border-radius:3px;background:var(--ink-soft);overflow:hidden;width:70px}
.mini i{display:block;height:100%;background:var(--grad)}

/* feed */
.feed{display:grid;gap:2px;padding:8px}
.feed .it{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px}
.feed .it:hover{background:var(--surface2)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;color:#1E2558;flex:none;letter-spacing:.02em}
.feed .txt{min-width:0;flex:1}
.feed .txt b{display:block}
.feed .txt span{display:block;color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* leaderboard */
.lb{display:grid;gap:4px;padding:10px}
.lb .it{display:grid;grid-template-columns:30px 36px 1fr auto;gap:12px;align-items:center;padding:9px 12px;border-radius:14px}
.lb .it.me{background:var(--ink-soft)}
.lb .rank{font-family:var(--f-display);font-size:1.3rem;text-align:center;color:var(--muted)}
.lb .it:nth-child(1) .rank{color:var(--gold)} .lb .it:nth-child(2) .rank{color:#8A90A8} .lb .it:nth-child(3) .rank{color:#A86B45}
.lb .mono{color:var(--ink)!important;font-family:var(--f-body);font-weight:700}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.badge{padding:20px 12px;text-align:center;display:grid;gap:8px;justify-items:center}
.badge .medal{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 6px var(--surface),0 0 0 7px var(--line)}
.badge .medal svg{width:26px;height:26px}
.badge:not(.locked) .medal{background:linear-gradient(145deg,#E9D3A2,#B08A3E);color:#fff;box-shadow:0 0 0 6px var(--gold-soft),0 8px 20px rgba(168,130,58,.35)}
.badge b{font-size:.84rem;line-height:1.2}
.badge span{font-size:.72rem;color:var(--muted);line-height:1.35}
.badge.locked .medal{background:var(--surface2)!important;color:var(--line2)}
.badge.locked b{color:var(--muted)}

/* lesson */
.lesson-body{max-width:64ch;font-size:1.08rem;line-height:1.8}
.lesson-body p{margin:0 0 1em}
.lesson-body strong{color:var(--ink);cursor:pointer;background:linear-gradient(transparent 62%,var(--gold-soft) 62%);padding:0 2px}
.lesson-body strong:hover{background:linear-gradient(transparent 62%,var(--line2) 62%)}

/* quiz */
.quiz{max-width:640px;margin:0 auto;display:grid;gap:16px}
.qtext{font-family:var(--f-display);font-size:clamp(1.6rem,5vw,2.2rem);line-height:1.15;text-wrap:balance}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:1.05rem;font-weight:600;background:var(--surface);border:1px solid var(--line2);border-radius:18px;padding:15px 16px;cursor:pointer;color:var(--fg);box-shadow:var(--shadow);transition:transform .2s,border-color .2s,background .2s}
.choice .k{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);font-size:.8rem;font-weight:700;flex:none;color:var(--muted)}
.choice .k svg{width:16px;height:16px}
.choice:hover:not(:disabled){border-color:var(--ink);transform:translateY(-1px)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .k{background:var(--ok);color:#fff;border-color:transparent}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.choice.wrong .k{background:var(--bad);color:#fff;border-color:transparent}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.combo{color:var(--gold);font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;gap:4px}
.score{font-family:var(--f-display);font-size:clamp(4rem,14vw,6rem);line-height:1}

/* flashcards 3D */
.deck-stage{perspective:1400px;max-width:440px;margin:0 auto;width:100%}
.flash{position:relative;height:290px;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.flash.flipped{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;display:grid;place-items:center;align-content:center;gap:10px;padding:26px;text-align:center;border:1px solid var(--line)}
.flash .front{background:var(--flash-front);box-shadow:var(--shadow-lg)}
.flash .back{background:linear-gradient(160deg,#1E2558,#33408F);color:#fff;transform:rotateY(180deg);box-shadow:var(--shadow-lg);border-color:transparent}
.flash .back .eyebrow{color:#C9D0F5}
.flash .word{font-family:var(--f-display);font-size:clamp(2.2rem,8vw,3rem);line-height:1.05}
.flash .ex{font-style:italic;opacity:.8;max-width:32ch}

/* misc */
.note{background:var(--gold-soft);border:1px solid #EADBB8;border-radius:var(--r);padding:16px 18px}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:28px;color:var(--muted);text-align:center;background:var(--empty-bg)}
.feedback{border-left:3px solid var(--gold);padding:12px 16px;background:var(--surface);border-radius:0 14px 14px 0;box-shadow:var(--shadow)}
.ann{padding:18px 20px;display:flex;gap:14px;align-items:flex-start}
.ann .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--rose-soft);color:var(--rose);flex:none}
.ann .ic svg{width:20px;height:20px}
.back{display:inline-flex;align-items:center;gap:6px;font:inherit;background:none;border:0;color:var(--ink);font-weight:700;cursor:pointer;padding:0}
.toggle{position:relative;width:52px;height:30px;border-radius:999px;background:var(--line2);border:0;cursor:pointer;flex:none;transition:background .25s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s}
.toggle[aria-checked="true"]{background:var(--ink)}
.toggle[aria-checked="true"]::after{transform:translateX(22px)}
.toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--on-ink);padding:12px 18px;border-radius:999px;font-weight:600;z-index:80;max-width:calc(100% - 32px);box-shadow:0 14px 40px rgba(20,24,60,.3)}
.toast .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.15);flex:none}
.toast .ic svg{width:14px;height:14px}
.xpfloat{position:fixed;z-index:75;pointer-events:none;font-family:var(--f-display);font-style:italic;color:var(--gold);font-size:1.6rem}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media (prefers-reduced-motion:no-preference){
  .enter>*{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  .enter>*:nth-child(2){animation-delay:.07s}.enter>*:nth-child(3){animation-delay:.14s}.enter>*:nth-child(4){animation-delay:.21s}.enter>*:nth-child(5){animation-delay:.28s}
  .xpfloat{animation:floatup 1.2s ease-out forwards}
}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}
@media (prefers-reduced-motion:reduce){.flash{transition:none}.dot.on{animation:none}}

/* splash */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);transition:opacity .7s,visibility .7s}
#splash.out{opacity:0;visibility:hidden}
#splash .in{display:grid;justify-items:center;gap:18px;text-align:center;padding:16px}
#splash .big{width:84px;height:84px;border-radius:26px;background:var(--grad);display:grid;place-items:center;font-family:var(--f-display);font-style:italic;font-size:2.2rem;color:#fff;box-shadow:0 20px 50px rgba(30,37,88,.3)}
#splash h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,6vw,2.8rem);margin:0}
#splash .load{width:140px;height:2px;border-radius:2px;background:var(--line);overflow:hidden}
#splash .load i{display:block;height:100%;width:40%;background:var(--ink);border-radius:2px}
@media (prefers-reduced-motion:no-preference){#splash .big{animation:pop 1s cubic-bezier(.2,.8,.2,1) both}#splash h1{animation:rise 1s .15s both}#splash .load i{animation:slide 1.2s ease-in-out infinite}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes slide{from{transform:translateX(-110%)}to{transform:translateX(260%)}}

/* hero accent */
.hero.glow-border{border-color:var(--line)}

/* mascot */
.mascot-wrap{display:grid;justify-items:center;gap:6px}
#mascotSlot{width:150px;height:150px;flex:none;position:relative}
#mascotSlot canvas{width:100%;height:100%;display:block}
#mascotSlot::after{content:"";position:absolute;left:22%;right:22%;bottom:4%;height:10%;border-radius:50%;background:radial-gradient(closest-side,rgba(30,37,88,.18),transparent);pointer-events:none}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:.84rem;max-width:220px;text-align:center;box-shadow:var(--shadow);font-style:italic;color:var(--muted)}
.hero-side{display:flex;align-items:center;gap:16px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:760px){.hero-side{justify-content:flex-start}#mascotSlot{width:120px;height:120px}}

/* word of the day */
.wotd{padding:24px;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center}
@media (max-width:620px){.wotd{grid-template-columns:1fr}}
.wotd .w{font-family:var(--f-display);font-size:clamp(2rem,6vw,2.6rem);line-height:1.05}
.wotd .medal{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#E9D3A2,#B08A3E);color:#fff;box-shadow:0 0 0 6px var(--gold-soft)}
.wotd .medal svg{width:26px;height:26px}

/* typed answers & listening */
.answer-input{font-size:1.25rem;padding:16px;border-radius:18px;text-align:center;font-family:var(--f-display)}
.answer-input.right{border-color:var(--ok);background:var(--ok-soft)}
.answer-input.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.bigplay{width:112px;height:112px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:grid;place-items:center;cursor:pointer;margin:0 auto;box-shadow:0 16px 40px rgba(30,37,88,.3)}
.bigplay svg{width:42px;height:42px}
@media (prefers-reduced-motion:no-preference){.bigplay{animation:pulse 2.4s infinite}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(30,37,88,.25),0 16px 40px rgba(30,37,88,.3)}70%,100%{box-shadow:0 0 0 20px rgba(30,37,88,0),0 16px 40px rgba(30,37,88,.3)}}
.modes{display:flex;gap:8px;flex-wrap:wrap}

/* celebration modal */
#celebrate{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:var(--overlay);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#celebrate .box{max-width:380px;width:100%;padding:36px 26px;text-align:center;display:grid;gap:14px;justify-items:center;background:var(--surface);box-shadow:0 30px 80px rgba(20,24,60,.25)}
#celebrate .medal3d{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#EBD7A8,#A8823A)!important;color:#fff!important;box-shadow:0 0 0 8px var(--gold-soft),0 18px 40px rgba(168,130,58,.4)}
#celebrate .medal3d svg{width:46px;height:46px}
@media (prefers-reduced-motion:no-preference){#celebrate .medal3d{animation:medal 1.3s cubic-bezier(.2,.8,.2,1) both}#celebrate .box{animation:rise .5s both}}
@keyframes medal{0%{transform:perspective(600px) rotateY(0) scale(.4)}70%{transform:perspective(600px) rotateY(540deg) scale(1.05)}100%{transform:perspective(600px) rotateY(720deg) scale(1)}}

/* chat */
.chat{display:grid;grid-template-rows:1fr auto;height:min(62vh,580px);overflow:hidden}
.msgs{overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;background:var(--surface2)}
.msg{max-width:78%;align-self:flex-start;background:var(--surface);border:1px solid var(--line);padding:10px 14px;border-radius:20px 20px 20px 6px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:var(--shadow)}
.msg.mine{align-self:flex-end;background:var(--ink);color:var(--on-ink);border-color:transparent;border-radius:20px 20px 6px 20px}
.msg span{display:block;font-size:.7rem;opacity:.6;margin-top:4px}
.chatbar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--surface)}
.chatbar input{flex:1}
.unread{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--rose);border:2px solid var(--bg)}
.thread{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;cursor:pointer}
.thread:hover{background:var(--surface2)}
.thread .txt{flex:1;min-width:0}.thread .txt span{display:block;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* exam */
.timer{font-weight:700;padding:6px 14px;border-radius:999px;background:var(--rose-soft);color:var(--rose);display:inline-flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.timer.low{background:var(--rose);color:#fff}
.editbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:var(--gold-soft);border:1px solid #EADBB8}
.check{display:flex;align-items:center;gap:10px;font-weight:700}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.role{display:grid;gap:8px;justify-items:start;text-align:left;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s,border-color .25s}
.role:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--ink)}
.role .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.role .ic svg{width:22px;height:22px}
.role b{font-size:1.02rem}.role span{font-size:.82rem;color:var(--muted);line-height:1.4}
.who{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.who img{width:34px;height:34px;border-radius:50%}
.filebtn{display:inline-flex!important;cursor:pointer}
.scanbox{display:grid;gap:12px;padding:14px;border:1px dashed var(--line2);border-radius:18px;background:var(--surface2)}
.scanprev{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.scanprev{grid-template-columns:1fr}}
.scanprev figure{margin:0;position:relative;display:grid;gap:6px;min-width:0}
.scanprev img{width:100%;max-height:340px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:12px}
.scanprev figcaption{font-size:.76rem;color:var(--muted);font-weight:600}
.scanbusy{position:absolute;inset:0 0 22px 0;display:grid;place-items:center;background:var(--glass-bg);border-radius:12px;font-weight:700;color:var(--ink)}
.scanimg{display:block;max-width:100%}
.scanimg img{width:100%;max-width:760px;border-radius:14px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
/* AI assistant */
#aiFab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;align-items:center;gap:10px;padding:10px 18px 10px 10px;border-radius:999px;border:0;background:var(--ink);color:var(--on-ink);font:inherit;font-weight:700;cursor:pointer;box-shadow:0 14px 34px rgba(30,37,88,.35)}
#aiFab .orb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#EBD7A8,#A8823A)}
#aiFab .orb svg{width:19px;height:19px}
@media (max-width:760px){#aiFab{bottom:calc(84px + env(safe-area-inset-bottom,0px));right:12px;padding:8px}#aiFab span.lbl{display:none}}
@media (prefers-reduced-motion:no-preference){#aiFab .orb{animation:pulse 3s infinite}}
#aiPanel{position:fixed;z-index:60;right:16px;top:calc(16px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 32px));display:grid;grid-template-rows:auto 1fr auto;background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:0 30px 80px rgba(20,24,60,.28);overflow:hidden}
@media (max-width:760px){#aiPanel{inset:0;width:auto;border-radius:0;top:env(safe-area-inset-top,0px);bottom:0}}
@media (prefers-reduced-motion:no-preference){#aiPanel:not([hidden]){animation:rise .35s cubic-bezier(.2,.8,.2,1)}}
.ai-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface2)}
.ai-head .orb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#fff;flex:none}
.ai-head h3{font-family:var(--f-display);font-weight:400;font-size:1.35rem}
.ai-msgs{overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px;background:var(--surface2)}
.ai-b{max-width:88%;padding:11px 14px;border-radius:20px;line-height:1.55;overflow-wrap:anywhere}
.ai-b.u{align-self:flex-end;background:var(--ink);color:var(--on-ink);border-radius:20px 20px 6px 20px;white-space:pre-wrap}
.ai-b.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:20px 20px 20px 6px;box-shadow:var(--shadow)}
.ai-b.a p{margin:0 0 .6em}.ai-b.a p:last-child{margin:0}.ai-b.a ul{margin:.2em 0 .6em;padding-left:1.2em}
.ai-b img{max-width:180px;border-radius:12px;display:block;margin-bottom:6px}
.ai-tools{display:flex;gap:4px;margin-top:6px}
.ai-tools button{font:inherit;font-size:.74rem;font-weight:700;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer}
.ai-tools button:hover{color:var(--ink);border-color:var(--ink)}
.ai-err{font-size:.8rem;color:var(--bad);margin-top:6px}
.ai-think{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:.85rem}
.ai-think i{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.4}
@media (prefers-reduced-motion:no-preference){.ai-think i{animation:blink 1.2s infinite}.ai-think i:nth-child(2){animation-delay:.2s}.ai-think i:nth-child(3){animation-delay:.4s}}
@keyframes blink{50%{opacity:1}}
.ai-sugg{display:grid;gap:8px}
.ai-sugg button{text-align:left;font:inherit;font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;color:var(--fg)}
.ai-sugg button:hover{border-color:var(--ink)}
.ai-comp{display:grid;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--surface)}
.ai-comp .row{flex-wrap:nowrap}
.ai-comp textarea{min-height:46px;max-height:140px;resize:none;border-radius:16px;padding:11px 14px}
.ai-attach{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.ai-attach img{width:40px;height:40px;object-fit:cover;border-radius:8px}
.unum{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ink-soft);color:var(--ink);font-weight:800;font-size:.85rem;flex:none}
.unum.done{background:var(--ok);color:#fff}.unum svg{width:16px;height:16px}
.it.unit:hover{background:var(--surface2)}
.steps{display:flex;gap:6px}.steps i{height:4px;flex:1;border-radius:2px;background:var(--line)}.steps i.on{background:var(--ink)}
.check input{width:20px;height:20px;accent-color:var(--ink)}
.list{display:grid;gap:2px;padding:8px}
.list .it{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;flex-wrap:wrap}
.list .it .txt{flex:1;min-width:140px}

/* teacher chart */
.chart{padding:18px 18px 8px;overflow-x:auto}
.chart svg{width:100%;min-width:520px;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);padding:0 18px 16px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

function voiceScore(v,lang){const n=(v.name||"").toLowerCase();let sc=0;if(/natural|neural|online/.test(n))sc+=7;if(/google/.test(n))sc+=5;if(/premium|enhanced|siri/.test(n))sc+=5;
  if(/samantha|daniel|karen|serena|moira|tessa|aria|jenny|guy|libby|sonia|ryan|thomas|amelie|audrey/.test(n))sc+=3;if(lang==="en"&&/^en[-_](gb|us)/i.test(v.lang))sc+=2;if(lang==="fr"&&/^fr[-_]fr/i.test(v.lang))sc+=2;if(/espeak|compact|eloquence|grandma|grandpa|whisper|zarvox|bad news|bells|bubbles|cellos|jester|organ|trinoids|albert|boing/.test(n))sc-=10;return sc}
function loadVoices(){if(!canSpeak)return;let vs=[];try{vs=speechSynthesis.getVoices()||[]}catch(e){}VOICE.list=vs;
  const en=vs.filter(v=>/^en/i.test(v.lang)).sort((a,b)=>voiceScore(b,"en")-voiceScore(a,"en")),fr=vs.filter(v=>/^fr/i.test(v.lang)).sort((a,b)=>voiceScore(b,"fr")-voiceScore(a,"fr"));
  VOICE.en=en.find(v=>v.voiceURI===VOICE.pref)||en[0]||null;VOICE.fr=fr[0]||null}
if(canSpeak){loadVoices();try{speechSynthesis.addEventListener("voiceschanged",()=>{loadVoices();if(!S.view&&(S.tab==="me"||S.tab==="class"))render()})}catch(e){}}
function chunks(t){const parts=String(t).match(/[^.!?;:\n]+[.!?;:]*|\n+/g)||[t];const out=[];let cur="";for(const p of parts){if((cur+p).length>180&&cur){out.push(cur);cur=p}else cur+=p}if(cur.trim())out.push(cur);return out.map(x=>x.trim()).filter(Boolean)}
function speak(text,lang="en"){if(!canSpeak)return;try{if(!VOICE.list.length)loadVoices();const v=lang==="fr"?VOICE.fr:VOICE.en;speechSynthesis.cancel();
  setTimeout(()=>{for(const c of chunks(text)){const u=new SpeechSynthesisUtterance(c);if(v){u.voice=v;u.lang=v.lang}else u.lang=lang==="fr"?"fr-FR":"en-US";u.rate=lang==="fr"?1:VOICE.rate;u.pitch=1;speechSynthesis.speak(u)}},80)}catch(e){toast("L'audio n'est pas disponible sur cet appareil.","mute")}}

  for(const[f,t]of seq){const o=actx.createOscillator(),g=actx.createGain();o.type=kind==="bad"?"sawtooth":"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(kind==="bad"?.06:.14,actx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.22);o.connect(g).connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.25)}}catch(e){}}

/* progress engine: XP, streak, daily goal, badges */
function addToday(arr){const t=today(),a=Array.isArray(arr)?arr:[];return a.includes(t)?null:[...a,t].slice(-120)}
function activeSet(s){const set=new Set(s.activeDays||[]);for(const a of s.attempts||[])if(a.at)set.add(dayStr(new Date(a.at)));for(const v of Object.values(s.submissions||{}))if(v&&v.at)set.add(dayStr(new Date(v.at)));if(s.lastDay)set.add(s.lastDay);if(s.lastActive)set.add(dayStr(new Date(s.lastActive)));return set}
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return dayStr(d)};
const liveStreak=s=>s.lastDay===today()||s.lastDay===yesterday()||(s.lastDay===daysAgo(2)&&(s.freezes||0)>0)?(s.streak||0):0;
function daysActive(s,n){const set=activeSet(s);let c=0;for(let i=0;i<n;i++){const d=new Date();d.setDate(d.getDate()-i);if(set.has(dayStr(d)))c++}return c}
function stripHTML(s,n=30){const set=activeSet(s);let h="";for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dayStr(d);h+=`<i class="${set.has(k)?"on":""}" title="${k}"></i>`}return`<span class="strip" role="img" aria-label="${daysActive(s,n)} jours actifs sur ${n}">${h}</span>`}
function heatHTML(s,weeks=12){const set=activeSet(s),t=new Date();t.setHours(12,0,0,0);const st=new Date(t);st.setDate(t.getDate()-((t.getDay()+6)%7)-(weeks-1)*7);let h="";
  for(const d=new Date(st);d<=t||((d.getDay()+6)%7)!==0;d.setDate(d.getDate()+1)){const k=dayStr(d),fut=d>t;h+=`<i class="${!fut&&set.has(k)?"on":""}${k===today()?" today":""}"${fut?' style="visibility:hidden"':""} title="${k}"></i>`}

function gain(xp,activity,extra={},anchor){
  if(!S.me||S.mode!=="student")return;
  const me=S.me,t=today();let streak=me.streak||0,dayXp=me.lastDay===t?(me.dayXp||0):0;
  let usedFreeze=false;if(me.lastDay!==t){if(me.lastDay===yesterday())streak++;else if(me.lastDay===daysAgo(2)&&(me.freezes||0)>0){streak++;usedFreeze=true}else streak=1}
  const xpTotal=(me.xp||0)+xp;dayXp+=xp;
  const merged=deepMerge(me,{...extra,xp:xpTotal,streak});
  const newB={};for(const b of BADGES)if(!(me.badges||{})[b.id]&&b.test(merged))newB[b.id]=Date.now();
  const payload={...extra,...(usedFreeze?{freezes:(me.freezes||0)-1,freezeUsed:yesterday()}:{}),xp:xpTotal,streak,bestStreak:Math.max(me.bestStreak||0,streak),lastDay:t,dayXp,lastActive:Date.now(),activity};const ad=addToday(me.activeDays);if(ad)payload.activeDays=ad;
  if(Object.keys(newB).length)payload.badges=newB;
  const wasGoal=me.lastDay===t&&(me.dayXp||0)>=DAILY_GOAL, rankUp=rankOf(xpTotal)>rankOf(me.xp);
  write(()=>meRef().update(payload));
  if(!S.isOwner&&!S.isStaff)write(()=>S.db.doc("board/"+S.uid).set({...boardEntry(me),xp:xpTotal,streak}));
  presence(activity);
  if(xp>0)xpFloat(xp,anchor);
  const bs=Object.keys(newB);
  if(bs.length){const b=BADGES.find(x=>x.id===bs[0]);setTimeout(()=>celebrate("Badge « "+b.name+" »",b.desc+" : badge débloqué !",b.icon,b.tone),700)}
  else if(rankUp){setTimeout(()=>celebrate("Rang "+rankOf(xpTotal)+" !","Tu passes au rang supérieur. Keep it up!","rocket","t-grad"),700)}
  else if(!wasGoal&&dayXp>=DAILY_GOAL){setTimeout(()=>celebrate("Objectif atteint","Tu as gagné "+DAILY_GOAL+" XP aujourd'hui. Reviens demain pour garder ta série !","target","t-ok"),700)}
}

const bestFor=qid=>{const a=(S.me?.attempts||[]).filter(x=>x.quizId===qid);return a.length?Math.max(...a.map(x=>pct(x.score,x.total))):null};
function pendingHw(){if(S.mode!=="student"||!S.me)return 0;return S.homework.filter(visible).filter(h=>!(S.me.submissions||{})[h.id]).length}
const visible=x=>S.mode!=="student"||!teacherOk(x)?S.mode!=="student":S.showAll||S.showAll||!S.me?.profile||!x.audience||x.audience==="tous"||x.audience===S.me.profile;
const byLevel=list=>{const my=S.me?.level;return[...list].filter(visible).sort((a,b)=>(a.level===my?0:1)-(b.level===my?0:1))};
const audChip=x=>x.audience&&x.audience!=="tous"?`<span class="chip">${ic("grad")}${esc(AUDIENCES[x.audience]||"")}</span>`:"";
const audBar=()=>S.me?.profile?`<div class="section" style="margin-bottom:18px"><div class="glass row between" style="padding:10px 16px;border-radius:16px"><span class="small row">${ic("grad")}<span class="muted">Contenu adapté à :</span><b>${esc(PROFILES[S.me.profile])}${S.me.classe?" · "+esc(S.me.classe):""}</b></span><button class="btn ghost sm" data-a="showAll">${S.showAll?"Voir seulement mon profil":"Voir tout le contenu"}</button></div></div>`:"";

function profileFields(pre,cur={}){const p=S.drafts[pre+"_prof"]||cur.profile||"lycee";const cls=CLASSES[p]||[];const curC=String(cur.classe||"");
  return`<div class="two"><label>Tu es…<select id="${pre}_prof">${Object.entries(PROFILES).map(([k,l])=>`<option value="${k}" ${k===p?"selected":""}>${l}</option>`).join("")}</select></label><label>${p==="adulte"?"Situation":"Classe / année"}<select id="${pre}_cls">${cls.map(c=>`<option ${curC.startsWith(c)?"selected":""}>${c}</option>`).join("")}</select></label></div>${p==="lycee"?`<label>Série<select id="${pre}_serie"><option value="">Pas encore de série (2nde)</option>${SERIES.map(x=>`<option ${cur.profile==="lycee"&&curC.split(" ")[1]===x?"selected":""}>${x}</option>`).join("")}</select></label>`:p==="etudiant"?`<label>Filière (facultatif)<input id="${pre}_serie" maxlength="40" placeholder="Ex. Anglais, Droit, Gestion" value="${esc(cur.profile===p?curC.split(" ").slice(/^(Licence|BTS)/.test(curC)?2:1).join(" "):"")}"></label>`:""}`}

const knownOf=d=>((S.me?.deckProgress||{})[d.id]?.known||[]);
function studentView(){
  if(isParent(S.me)){if(S.view?.type==="chat"||S.tab==="pmsg"){if(S.chatFor!==S.uid)subChat(S.uid);return`<div class="section" style="max-width:720px;margin-inline:auto"><div class="row">${ic("chat")}<div><span class="eyebrow">Messagerie privée</span><h2>La professeure</h2></div></div><p class="sub">Seuls vous et la professeure voyez cette conversation.</p>${chatHTML(S.uid,"student")}</div>`}return S.tab==="me"?parentProfileView():parentHomeView()}
  if(S.liveOn&&liveOpen(S.live))return liveStudentView();if(S.srs)return srsRunView();if(S.run)return quizRunView();if(S.deck)return deckRunView();
  if(S.view?.type==="chat")return`<div class="section" style="max-width:720px;margin-inline:auto">${backBtn()}<div class="row">${ic("chat")}<div><span class="eyebrow">Messagerie privée</span><h2>Ma professeure</h2></div></div><p class="sub">Seuls toi et ta professeure voyez cette conversation.</p>${chatHTML(S.uid,"student")}</div>`;
  if(S.view?.type==="lesson")return lessonView();if(S.view?.type==="hw")return hwView();
  if(S.view?.type==="ep")return epView();if(S.view?.type==="shop")return shopView();if(S.view?.type==="talk")return talkView();
  return netBanner()+liveBanner()+({home:homeView,learn:learnView,prac:practiceView,talk:talkView,hw:hwListView,me:profileView}[S.tab]||homeView)()}

function homeView(){const m=S.me,xp=m.xp||0,rank=rankOf(xp),into=xp%XP_PER_RANK,t=today();
  const streak=liveStreak(m),dayXp=m.lastDay===t?(m.dayXp||0):0;
  const read=m.lessonsRead||{};
  const nextLesson=progUnits(myProgClass(m)).find(l=>!read[l.id])||byLevel(S.lessons.filter(l=>!l.classe)).find(l=>!read[l.id]);
  const practice=byLevel(S.quizzes.filter(q=>!q.exam)),nextQuiz=practice.find(q=>bestFor(q.id)==null)||practice.find(q=>bestFor(q.id)<100);
  const nextHw=[...S.homework].filter(visible).filter(h=>!(m.submissions||{})[h.id]).sort((a,b)=>String(a.due).localeCompare(String(b.due)))[0];
  const nextDeck=S.decks.filter(visible).find(d=>knownOf(d).length<(d.cards||[]).length);
  const hour=new Date().getHours(),greet=hour<12?"Good morning":hour<18?"Good afternoon":"Good evening";
  const sq=S.decks.length?srsQueue():{due:[],fresh:[]},sn=Math.min(SRS_MAX,sq.due.length+sq.fresh.length);
  const sugg=[
    sn&&{a:"startSrs",id:"",icon:"brain",tone:"t-gold",eb:"Révision du jour · +3 XP / mot",t:sq.due.length?`${sq.due.length} mot(s) à revoir avant de les oublier`:`${sq.fresh.length} nouveaux mots à mémoriser`,lvl:S.me.level},
    AI.sample&&!AI.disabled&&{a:"openTalk",id:"",icon:"chat",tone:"t-cyan",eb:"Conversation avec Nova · +5 XP / message",t:"Parle anglais avec l'IA : elle te corrige et te pose des questions",lvl:S.me.level},
    {a:"startPic",id:"mix",icon:"camera",tone:"t-coral",eb:"Jeu d'images · +10 XP / réponse",t:"Devine les images : objets, actions, métiers…",lvl:S.me.level},
    nextLesson&&{a:"openLesson",id:nextLesson.id,icon:"book",tone:"t-cyan",eb:"Leçon · +20 XP",t:nextLesson.title,lvl:nextLesson.level},
    nextQuiz&&{a:"startQuiz",id:nextQuiz.id,icon:"bolt",tone:"t-coral",eb:"Quiz · jusqu'à +"+((nextQuiz.questions||[]).length*10+50)+" XP",t:nextQuiz.title,lvl:nextQuiz.level},
    nextDeck&&{a:"startDeck",id:nextDeck.id,icon:"cards",tone:"t-gold",eb:"Vocabulaire · +5 XP / mot",t:nextDeck.title,lvl:nextDeck.level},
    nextHw&&{a:"openHw",id:nextHw.id,icon:"pen",tone:"t-ok",eb:"Devoir · pour le "+fmtDate(nextHw.due),t:nextHw.title,lvl:nextHw.level}].filter(Boolean).slice(0,6);
  const earned=BADGES.filter(b=>(m.badges||{})[b.id]);
  const w=wordOfDay(),wDone=m.wotdDay===t;
  return`${m.profile?"":profileCard()}<div class="section"><div class="glass hero glow-border"><div style="display:grid;gap:10px"><span class="eyebrow">${greet}${schoolPeriod().label?" · "+schoolPeriod().label:""}</span><h2>${esc(m.name.split(" ")[0])}, <span class="gradtext">let's learn!</span></h2>
    <p class="sub">Niveau ${esc(m.level)} · ${LEVEL_NAMES[m.level]||""}${m.profile?" · "+esc(PROFILES[m.profile])+(m.classe?" ("+esc(m.classe)+")":""):""}. ${dayXp>=DAILY_GOAL?"Objectif du jour atteint, bravo !":`Encore ${DAILY_GOAL-dayXp} XP pour ton objectif du jour.`}</p>
    <div style="max-width:340px;display:grid;gap:6px"><div class="row between small"><span class="muted">Objectif du jour</span><span class="mono">${Math.min(dayXp,DAILY_GOAL)}/${DAILY_GOAL} XP</span></div><div class="bar gold"><i style="width:${Math.min(100,pct(dayXp,DAILY_GOAL))}%"></i></div></div></div>
    <div class="hero-side">${mascotHTML(TIPS_STUDENT)}<div class="stats"><div class="ring">${ringSVG(into/XP_PER_RANK)}<div class="lbl"><div><span>Rang</span><br><b>${rank}</b></div></div></div>
    <div style="display:grid;gap:10px"><div class="glass statbox"><b class="flame">${streak}</b><span>${streak>1?"jours de suite":"jour de suite"}</span></div><div class="glass statbox"><b class="gradtext">${xp}</b><span>XP au total</span></div></div></div></div></div></div>
  <div class="section"><div class="head"><div><span class="eyebrow">Pour toi aujourd'hui</span><h2>Continue ta progression</h2></div></div>

  for(const d of byLevel(decks)){if(!room)break;const kn=new Set(knownOf(d));(d.cards||[]).forEach((c,i)=>{const k=d.id+":"+i;if(room&&!srs[k]&&!kn.has(i)){fresh.push(k);room--}})}

function gbParts(s,y,t){const gb=S.gb||{},ev=gb.evals||{},mk=gb.marks||{},inT=ts=>{const r=triOf(ts);return!!r&&r.y===y&&r.t===t};const I=[],D=[],Q=[];

const ACT_Q={h:"What is he doing?",s:"What is she doing?",t:"What are they doing?",p:"What is this person doing?",a:"What activity is it?"};

    return{q:s==="h"?"What does he do?":s==="s"?"What does she do?":"What does this person do?",say:`${P} ${art(w)} ${w}.`,easy:w,mid:`${P} ${art(w)} ${w}.`,acc:x.alts.flatMap(a=>[a,...sub.map(p=>`${p} ${art(a)} ${a}`),...sub.map(p=>`${p} ${a}`)])}}

function picTip(x,P){const w=x.en,a=art(w);switch(x.kind){
  case"noun":case"place":return x.f==="u"?`« ${w} » est indénombrable : pas de a / an. On dit simplement : It's ${w}.`:x.f==="p"?`« ${w} » est au pluriel : on dit They are ${w}.`:`On dit « ${a} ${w} » : ${a==="an"?"an devant un son voyelle (an apple, an umbrella)":"a devant un son consonne (a dog, a book)"}.`;

  case"job":return`Pour un métier, on met toujours a / an : ${P.say}`;
  case"weather":return`Pour la météo, on commence par It's : ${P.say}`;

const NATIVE_SR=()=>{try{return window.Capacitor?.Plugins?.SpeechRecognition||null}catch(e){return null}};
const IN_CLAUDE=(()=>{try{return window.top!==window.self}catch(e){return true}})();
const SRC=typeof window!=="undefined"&&(window.SpeechRecognition||window.webkitSpeechRecognition||(NATIVE_SR()?true:null));
const micBtn=t=>SRC?`<button type="button" class="micbtn ${S.mic?.target===t?"on":""}" data-a="mic" data-t="${t}" aria-label="${S.mic?.target===t?"Arrêter l'écoute":"Parler en anglais"}" title="Parler en anglais">${ic("mic")}</button>`:"";
async function micNative(target){const P=NATIVE_SR();try{const av=await P.available();if(!av?.available){S.micHelp="nosupport";render();return}const perm=await P.requestPermissions();if(perm&&(perm.speechRecognition==="denied"||perm.microphone==="denied")){S.micHelp="denied";render();return}
  S.mic={target};render();const res=await P.start({language:"en-US",maxResults:1,prompt:"Speak in English",partialResults:false,popup:true});S.mic=null;const t=(res?.matches||[])[0]||"";if(!t){S.micHelp="nospeech";render();return}
  const el=document.getElementById(target),val=(((el?.value||"").trim()?(el.value.trim()+" "):"")+t).trim();S.drafts[target]=val;render();if(target==="talkIn")talkSend(val)}catch(e){S.mic=null;S.micHelp="blocked";render()}}
async function micGo(target){if(target==="__pron"){S.micHelp=null;return pronListen()}S.micLast=target;if(S.micRec){try{S.micRec.stop()}catch(e){}return}if(NATIVE_SR()&&!(window.SpeechRecognition||window.webkitSpeechRecognition)){S.micHelp=null;return micNative(target)}
  if(!SRC){S.micHelp="nosupport";render();return}
  let ok=false;try{ok=localStorage.getItem("mca_micok")==="1"}catch(e){}
  try{const st=await navigator.permissions?.query({name:"microphone"});if(st&&st.state==="denied"){S.micHelp="denied";render();return}if(st&&st.state==="granted")ok=true}catch(e){}
  if(!ok&&S.micHelp!=="ask"){S.micHelp="ask";render();return}
  S.micHelp=null;render();
  try{if(navigator.mediaDevices?.getUserMedia){const st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(t=>t.stop())}try{localStorage.setItem("mca_micok","1")}catch(e){}}
  catch(e){S.micHelp=e&&(e.name==="NotAllowedError"||e.name==="SecurityError")?"denied":"blocked";render();return}
  const el=document.getElementById(target),base=(el?.value||"").trim();let finalT="";const r=new SRC();r.lang="en-US";r.interimResults=true;r.continuous=false;r.maxAlternatives=1;S.micRec=r;S.mic={target};render();
  r.onresult=ev=>{let fin="",tmp="";for(let i=0;i<ev.results.length;i++){const x=ev.results[i];if(x.isFinal)fin+=x[0].transcript;else tmp+=x[0].transcript}finalT=fin;const val=((base?base+" ":"")+(fin+tmp).trim()).trim();const e2=document.getElementById(target);if(e2)e2.value=val;S.drafts[target]=val};
  r.onerror=ev=>{S.micErr=ev.error};
  r.onend=()=>{S.micRec=null;S.mic=null;const err=S.micErr;S.micErr=null;if(err&&err!=="aborted"){S.micHelp=err==="no-speech"?"nospeech":(err==="not-allowed"||err==="service-not-allowed"||err==="audio-capture")?"denied":"blocked";render();return}
    const val=(S.drafts[target]||"").trim();render();if(target==="talkIn"&&finalT.trim()&&val)talkSend(val)};
  try{r.start();beep("ok")}catch(e){S.micRec=null;S.mic=null;S.micHelp="blocked";render()}}

function subChat(sid){if(S.chatFor===sid)return;S.chatUnsub?.();S.msgs=[];S.msgsReady=false;S.chatFor=sid;

function curQuiz(){const r=S.run;return r?(r.temp||S.quizzes.find(x=>x.id===r.quizId)||null):null}
function finishQuiz(q){const r=S.run;if(!r||r.finished)return;r.finished=true;const tot=q.questions.length;
  for(let i=0;i<tot;i++)if(r.answers[i]===undefined&&!r.wrong.includes(i))r.wrong.push(i);
  r.i=tot;const perfect=r.score===tot;if(perfect||r.score/tot>=.7){beep("win");confetti()}
  if(S.me&&S.mode==="student"){const att={quizId:q.id,title:q.title,score:r.score,total:tot,wrong:r.wrong,at:Date.now()};if(r.temp?.kind==="ai"||r.temp?.kind==="pic"||r.temp?.kind==="ex")att.wrongQ=r.wrong.slice(0,10).map(i=>q.questions[i]).filter(Boolean);if(r.exam)att.exam=true;
    gain(r.score*10+(perfect?50:0),`${r.exam?"A terminé l'examen":"A terminé"} « ${q.title} » : ${r.score}/${tot}`,{attempts:[...(S.me.attempts||[]),att].slice(-150)})}}

function loadImg(file){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}

      const nb=(L[y>0?p-W:p]+L[y<H-1?p+W:p]+L[xx>0?p-1:p]+L[xx<W-1?p+1:p])/4;let o=v+.55*(v-nb);o=o<0?0:o>1?1:o;

      else{const g=o*255;d[j]=d[j+1]=d[j+2]=g}}
    x.putImageData(id,0,0)}
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.92));return{blob,w:W,h:H}}

const DOC_NOTE="Corrigé généré avec Nova · Ma Classe d'Anglais";
const CORR_RULES="Écris le corrigé complet : réponses attendues en anglais, explications courtes en français. Une partie par exercice, avec le titre en **gras** (par exemple **A. Compréhension (8 pts)**). Reprends la numérotation du sujet. Donne le barème par question et le total (sur 20 pour une épreuve). Pour les questions ouvertes et la production écrite, donne les critères de notation et une réponse modèle. Laisse une ligne vide entre les parties. N'écris ni introduction ni conclusion, n'utilise ni tableau ni titre markdown (#). Vérifie chaque réponse.";
const docPrep=t=>String(t||"").replace(/\r/g,"").replace(/→/g,"->").replace(/[✓✔]/g,"v").replace(/\u00a0/g," ");
function docLines(text){return docPrep(text).split("\n").map(line=>{const out=[];let bold=false;for(const part of line.split("**")){for(const w of part.split(/\s+/).filter(Boolean))out.push({t:w,b:bold});bold=!bold}return out})}
const HW=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
function pdfW(str,bold,size){let w=0;for(const ch of str){let c=ch.charCodeAt(0);if(c>126||c<32){const b=ch.normalize("NFD").charCodeAt(0);c=(b>=32&&b<=126)?b:(ch==="œ"?722:556)}w+=HW[c-32]||556}return w*size/1000*(bold?1.07:1)}
function pdfEnc(str){const m={"’":0x92,"‘":0x91,"“":0x93,"”":0x94,"–":0x96,"—":0x97,"…":0x85,"œ":0x9C,"Œ":0x8C,"•":0x95,"€":0x80};let o="";for(const ch of str){const c=ch.charCodeAt(0);o+=String.fromCharCode(m[ch]!==undefined?m[ch]:(c<256?c:63))}return o.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)")}
function pdfBlob(title,text){
  const W=595.28,H=841.89,M=56,FS=11,LH=16,maxW=W-2*M,sp=pdfW(" ",false,FS);
  const pages=[[]];let y=H-M-14;const add=o=>pages[pages.length-1].push(o),nl=()=>{pages.push([]);y=H-M-14};
  const wrap=(words,size,max)=>{const L=[];let cur=[],w=0;const spw=pdfW(" ",false,size);for(const x of words){const ww=pdfW(x.t,x.b,size);if(cur.length&&w+spw+ww>max){L.push(cur);cur=[];w=0}w+=(cur.length?spw:0)+ww;cur.push(x)}if(cur.length)L.push(cur);return L};
  const put=(segs,size,color)=>{if(y<M+8)nl();let x=M;const spw=pdfW(" ",false,size);for(const g of segs){add(`BT ${color} /F${g.b?2:1} ${size} Tf ${x.toFixed(2)} ${y.toFixed(2)} Td (${pdfEnc(g.t)}) Tj ET`);x+=pdfW(g.t,g.b,size)+spw}};
  const tw=String(title).split(/\s+/).filter(Boolean).map(t=>({t,b:true}));
  for(const ln of wrap(tw,17,maxW)){put(ln.map(g=>({...g,b:true})),17,"0.17 0.23 0.55 rg");y-=22}
  add(`0.89 0.76 0.45 RG 1.4 w ${M} ${(y+8).toFixed(2)} m ${W-M} ${(y+8).toFixed(2)} l S`);y-=16;
  for(const line of docLines(text)){if(!line.length){y-=LH*.6;continue}
    // fusionner les mots d'une ligne en segments (gras / normal) pour garder le style
    for(const ln of wrap(line,FS,maxW)){const segs=[];for(const x of ln){const last=segs[segs.length-1];if(last&&last.b===x.b)last.t+=" "+x.t;else segs.push({t:x.t,b:x.b})}
      if(y<M+8)nl();let xx=M;for(const g of segs){add(`BT 0 g /F${g.b?2:1} ${FS} Tf ${xx.toFixed(2)} ${y.toFixed(2)} Td (${pdfEnc(g.t)}) Tj ET`);xx+=pdfW(g.t,g.b,FS)+sp}y-=LH}}
  const N=pages.length,objs=[];
  objs[1]="<< /Type /Catalog /Pages 2 0 R >>";objs[2]=`<< /Type /Pages /Kids [${pages.map((_,i)=>`${5+i*2} 0 R`).join(" ")}] /Count ${N} >>`;
  objs[3]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";objs[4]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  pages.forEach((ops,i)=>{const foot=`BT 0.5 g /F1 8 Tf ${M} 28 Td (${pdfEnc(DOC_NOTE+" · page "+(i+1)+"/"+N)}) Tj ET`,content=ops.join("\n")+"\n"+foot;
    objs[5+i*2]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6+i*2} 0 R >>`;
    objs[6+i*2]=`<< /Length ${content.length} >>\nstream\n${content}\nendstream`});
  let out="%PDF-1.4\n";const off=[];for(let i=1;i<objs.length;i++){off[i]=out.length;out+=`${i} 0 obj\n${objs[i]}\nendobj\n`}
  const xr=out.length;out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`+off.slice(1).map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
  const bytes=new Uint8Array(out.length);for(let i=0;i<out.length;i++)bytes[i]=out.charCodeAt(i)&255;return new Blob([bytes],{type:"application/pdf"})}
function corrigeWordHTML(title,text){const body=docPrep(text).split(/\n{2,}/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${esc(p).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>")}</p>`).join("");
  return`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Calibri,Arial,sans-serif;font-size:12pt;line-height:1.45;color:#111}h1{font-size:20pt;color:#2B3A8C;border-bottom:2px solid #E3C173;padding-bottom:6px}p{margin:0 0 10pt}.f{color:#777;font-size:9pt;margin-top:24pt}</style></head><body><h1>${esc(title)}</h1>${body}<p class="f">${esc(DOC_NOTE)}</p></body></html>`}
function corrigePNG(title,text){return new Promise((res,rej)=>{try{
  const Wc=1240,PAD=90,FS=30,LH=44,max=Wc-2*PAD,fam='Manrope,"Segoe UI",Arial,sans-serif',font=(b,px=FS)=>`${b?700:400} ${px}px ${fam}`;
  const c=document.createElement("canvas"),x=c.getContext("2d");x.font=font(false);const spw=x.measureText(" ").width;
  const lay=[];const wrapLine=(words,px)=>{const L=[];let cur=[],w=0;for(const g of words){x.font=font(g.b,px);const ww=x.measureText(g.t).width;if(cur.length&&w+spw+ww>max){L.push(cur);cur=[];w=0}w+=(cur.length?spw:0)+ww;cur.push(g)}if(cur.length)L.push(cur);return L};
  const tl=wrapLine(String(title).split(/\s+/).filter(Boolean).map(t=>({t,b:true})),44);
  let y=PAD+44;const items=[];for(const ln of tl){items.push({ln,y,px:44,col:"#2B3A8C"});y+=58}
  const ruleY=y-26;y+=26;
  for(const line of docLines(text)){if(!line.length){y+=LH*.55;continue}for(const ln of wrapLine(line,FS)){items.push({ln,y,px:FS,col:"#111"});y+=LH}}
  const H=Math.min(15000,Math.max(900,Math.round(y+PAD+50)));c.width=Wc;c.height=H;
  x.fillStyle="#fff";x.fillRect(0,0,Wc,H);x.textBaseline="alphabetic";
  x.fillStyle="#E3C173";x.fillRect(PAD,ruleY,max,4);
  for(const it of items){if(it.y>H-PAD)break;let xx=PAD;for(const g of it.ln){x.font=font(g.b,it.px);x.fillStyle=it.col;x.fillText(g.t,xx,it.y);xx+=x.measureText(g.t).width+spw}}
  x.font=font(false,20);x.fillStyle="#888";x.fillText(DOC_NOTE,PAD,H-34);
  c.toBlob(b=>b?res(b):rej(new Error("png")),"image/png")}catch(e){rej(e)}})}
async function corDownload(fmt,title,text){title=String(title||"").trim()||"Corrigé";text=String(text||"").trim();if(!text){toast("Rien à télécharger : génère ou écris d'abord le corrigé.","x");return}
  const nm="Corrige-"+safeName(title),full="Corrigé : "+title;
  try{if(fmt==="pdf")return await saveFile(nm+".pdf",pdfBlob(full,text));
    if(fmt==="doc")return await saveFile(nm+".doc",new Blob(["\ufeff"+corrigeWordHTML(full,text)],{type:"application/msword"}));
    return await saveFile(nm+".png",await corrigePNG(full,text))}catch(e){console.error(e);toast("Création du fichier impossible.","x")}}

function mdLite(t){const out=[];let list=false;for(const raw of String(t||"").split("\n")){let line=esc(raw).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/^#{1,4}\s*(.+)$/,"<b>$1</b>");const li=/^\s*(?:[-•*]|\d+[.)])\s+(.*)$/.exec(line);
  if(li){if(!list){out.push("<ul>");list=true}out.push("<li>"+li[1]+"</li>");continue}if(list){out.push("</ul>");list=false}if(line.trim())out.push("<p>"+line+"</p>")}if(list)out.push("</ul>");return out.join("")}

async function aiSend(text){if(AI.busy||!AI.sample)return;text=String(text||"").trim();const img=AI.img;if(!text&&!img)return;if(!text)text="Explique-moi cette image.";

  const opts={cache:false,signal:AI.ctl.signal,onText:({text})=>{bubble.content=text;if(bubble.pending){bubble.pending=false;renderAI()}else updateBubble(bi)}};if(img)opts.images=[img.blob];

  catch(e){bubble.pending=false;bubble.content=e.text||"";if(e.code==="cancelled"){if(!bubble.content)AI.turns.splice(bi,1)}else{bubble.error=aiErr(e.code);if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code))bubble.error+=" ";if(e.code==="images_unavailable")AI.canImg=false}}

function cleanGenQuestions(arr){if(!Array.isArray(arr))return[];const out=[];for(const x of arr){if(!x||typeof x.q!=="string"||!x.q.trim())continue;const explain=typeof x.explain==="string"?x.explain.slice(0,300):"";
  if(x.type==="type"){const acc=(Array.isArray(x.accept)?x.accept:[]).map(String).map(t=>t.trim()).filter(Boolean);if(acc.length)out.push({q:x.q.trim(),type:"type",accept:acc,explain});continue}
  const ch=(Array.isArray(x.choices)?x.choices:[]).map(String).map(t=>t.trim()).filter(Boolean),ans=Number(x.answer);if(ch.length<2||ch.length>6||!(ans>=0&&ans<ch.length)||new Set(ch).size!==ch.length)continue;
  const order=shuffle([...ch.keys()]);out.push({q:x.q.trim(),choices:order.map(i=>ch[i]),answer:order.indexOf(ans),explain})}return out}
async function aiGenQuiz(topic,n){if(!AI.sample||S.gen?.busy)return;S.gen={busy:true};render();const m=S.me||{};
  const prompt=`Crée un quiz d'anglais de ${n} questions pour un apprenant au Togo : ${PROFILES[m.profile]||"élève"}${m.classe?" ("+m.classe+")":""}, niveau ${m.level||"A2"} (${LEVEL_NAMES[m.level]||""}). Sujet : ${topic}.
Environ 70 % de questions à choix multiple (4 propositions, une seule correcte, des distracteurs plausibles) et 30 % de questions à réponse courte à écrire (un mot ou quelques mots, en listant toutes les variantes correctes acceptées, contractions comprises). Varie les formes : phrase à compléter avec ___, traduction du français vers l'anglais, vocabulaire, trouver l'erreur, mini-compréhension. Prends des situations de la vie au Togo. Consignes en français si besoin, contenu testé en anglais. Vérifie soigneusement que chaque bonne réponse est réellement correcte et qu'une seule proposition est juste. Pour chaque question, une explication courte en français (une phrase).
Réponds uniquement avec un tableau JSON, par exemple : [{"q":"She ___ to school every day.","choices":["go","goes","going","gone"],"answer":1,"explain":"Avec she, le présent simple prend un -s."},{"q":"Traduis : « J'ai faim. »","type":"type","accept":["I am hungry","I'm hungry"],"explain":"Avoir faim se dit to be hungry."}]`;
  try{const arr=await AI.sample.json(prompt,{cache:false});const qs=cleanGenQuestions(arr).slice(0,n);if(qs.length<3)throw{code:"empty_completion"};
    S.gen=null;S.view=null;S.run={temp:{id:"ai-"+Date.now(),title:"Nova · "+topic,kind:"ai",topic,n,questions:qs},quizId:"ai",i:0,picked:null,score:0,answers:[],wrong:[],combo:0,best:0};S.animate=true;scrollTo(0,0);touch("Quiz Nova : "+topic)}
  catch(e){S.gen={err:e&&e.code==="invalid_json"?"Nova s'est embrouillé. Réessaie.":aiErr(e&&e.code)}}render()}

function devSave(id,map,msg,icn){const cur=S.access[id]||{};write(()=>S.db.doc("access/"+id).set({...cur,status:cur.status||"active",at:cur.at||Date.now(),by:cur.by||S.uid,blockedDevices:map})).then(()=>toast(msg,icn))}

/* ===== Mots du jour de Nova : une liste personnelle, renouvelée chaque jour ===== */
async function dwEnsure(){const m=S.me;if(S.mode!=="student"||!m||isParent(m)||S.dwBusy||stOf(m)!=="active")return;const t=today(),d=m.dailyWords||{};if(d.day===t||S.dwTry===t)return;
  if(AI.sample===undefined){aiInit().then(()=>dwEnsure());return}if(!AI.sample||AI.disabled)return;
  S.dwTry=t;S.dwBusy=true;
  const keep=(d.list||[]).filter(w=>w&&w.en),need=Math.min(Math.max(2,6-keep.length),12-keep.length);
  try{if(need<=0){await write(()=>meRef().update({dailyWords:{day:t,list:keep}}));return}
    const avoid=[...new Set([...(m.dwSeen||[]),...keep.map(w=>w.en)])].slice(-150);
    const prompt=`Choisis ${need} mots ou expressions d'anglais NOUVEAUX à apprendre aujourd'hui pour cet apprenant togolais : ${PROFILES[m.profile]||"élève"}${m.classe?" ("+m.classe+")":""}, niveau ${m.level||"A2"} (${LEVEL_NAMES[m.level]||""}). Prends des mots utiles de la vie quotidienne et de l'école (marché, famille, transport, études, métiers), variés : noms, verbes, adjectifs, expressions. Ne reprends AUCUN de ces mots : ${avoid.join(", ")||"(aucun)"}.\nPour chaque mot : "en" (le mot ou l'expression), "fr" (la traduction française), "ex" (une phrase d'exemple courte en anglais, adaptée au niveau). Réponds uniquement avec un tableau JSON, par exemple : [{"en":"to borrow","fr":"emprunter","ex":"Can I borrow your pen?"}]`;
    const arr=await AI.sample.json(prompt,{cache:false,modelTier:"quick"});
    const low=avoid.map(a=>a.toLowerCase()),fresh=(Array.isArray(arr)?arr:[]).filter(w=>w&&cleanStr(w.en,60)&&cleanStr(w.fr,80)).map(w=>({en:cleanStr(w.en,60),fr:cleanStr(w.fr,80),ex:cleanStr(w.ex,160),lvl:m.level||"A2",at:Date.now()})).filter(w=>!low.includes(w.en.toLowerCase())).slice(0,need);
    if(!fresh.length)return;
    await write(()=>meRef().update({dailyWords:{day:t,list:[...keep,...fresh]},dwSeen:[...avoid,...fresh.map(w=>w.en)].slice(-150)}))}
  catch(e){console.warn("mots du jour",e)}
  finally{S.dwBusy=false;render()}}
function dwHTML(){const m=S.me,L=(m&&m.dailyWords&&m.dailyWords.list)||[];if(!L.length)return"";

async function aiFillDeck(){if(!AI.sample||S.dfill)return;const topic=(document.getElementById("d_title")?.value||"").trim();if(!topic){toast("Écris d'abord le titre de la liste (le thème).","x");return}
  const lvl=document.getElementById("d_level")?.value||"A2",aud=document.getElementById("d_aud")?.value||"tous";S.dfill=true;render();
  try{const r=await AI.sample(`Écris une liste de 15 mots ou expressions d'anglais sur le thème « ${topic} », niveau ${lvl}, public : ${AUDIENCES[aud]||"tous"} (élèves togolais). Utilise EXACTEMENT ce format, une ligne par mot, sans rien d'autre : anglais | français | exemple court en anglais. Exemple :\napple | pomme | I eat an apple every day.\nto borrow | emprunter | Can I borrow your pen?`,{cache:false,modelTier:"quick"});
    const lines=r.text.trim().split("\n").map(l=>l.replace(/^[-*•\d.)\s]+/,"").trim()).filter(l=>l.includes("|")),prev=(S.drafts.d_body||"").trim();
    if(!lines.length)throw{code:"empty_completion"};S.drafts.d_body=(prev?prev+"\n":"")+lines.join("\n");toast(lines.length+" mots prêts : relis-les avant de publier","spark")}
  catch(e){toast(aiErr(e&&e.code),"x")}S.dfill=false;render()}

/* ---- Copies d'élèves : photo / fichier à joindre au devoir ou à l'épreuve ---- */
const PEND={},COPYURL={};
const isImg=t=>/^image\//.test(t||"");
async function shrinkImg(file,max=1600,q=.72){if(!isImg(file.type))return file;
  try{const bmp=await createImageBitmap(file),r=Math.min(1,max/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");
    c.width=Math.round(bmp.width*r);c.height=Math.round(bmp.height*r);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(res=>c.toBlob(res,"image/jpeg",q));
    return b&&b.size<file.size?new File([b],(file.name||"photo").replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"}):file}catch(e){return file}}
async function addCopies(key,files){const a=PEND[key]=PEND[key]||[];
  for(const f of files){if(a.length>=5){toast("5 fichiers maximum.","x");break}
    if(!isImg(f.type)&&f.type!=="application/pdf"){toast("Format non accepté : photo ou PDF.","x");continue}
    if(f.type==="application/pdf"&&f.size>5*1024*1024){toast("PDF trop lourd (5 Mo maximum).","x");continue}
    a.push(await shrinkImg(f))}
  render()}
function pendHTML(key){const a=PEND[key]||[];return a.length?`<div class="row" style="gap:8px;flex-wrap:wrap">${a.map((f,i)=>`<span class="chip">${ic(isImg(f.type)?"camera":"file")}${esc(f.name.length>22?f.name.slice(0,19)+"…":f.name)}<button type="button" class="iconbtn" data-a="cpRm" data-k="${key}" data-i="${i}" aria-label="Retirer" style="margin-left:4px">${ic("x")}</button></span>`).join("")}</div>`:""}
function fileBtnsHTML(key){return`<div class="row" style="gap:8px;flex-wrap:wrap"><label class="btn ghost sm" style="cursor:pointer">${ic("camera")}Prendre une photo<input id="cpf_cam_${key}" type="file" accept="image/*" capture="environment" hidden></label><label class="btn ghost sm" style="cursor:pointer">${ic("file")}Importer photo ou PDF<input id="cpf_${key}" type="file" accept="image/*,application/pdf" multiple hidden></label></div>${pendHTML(key)}<span class="hint">Facultatif · jusqu'à 5 fichiers (photos ou PDF de 5 Mo maximum).</span>`}
function copyTiles(files){if(!files||!files.length)return"";

async function copyURL(p){return COPYURL[p]=COPYURL[p]||await window.__copies.url(p)}
async function openCopy(p,t){try{const u=await copyURL(p);
  if(isImg(t)){const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:12px;overflow:auto";

/* ---- Rendre un devoir ou une épreuve (texte et/ou photos), même sans réseau ---- */
async function sendCopy(kind,id,text,pend,btn){const isEp=kind==="ep",item=isEp?S.eps.find(x=>x.id===id):S.homework.find(x=>x.id===id);
  const old=((isEp?S.me.epreuveSubs:S.me.submissions)||{})[id],up=[];
  if(pend.length){if(!window.__copies)throw{message:"indisponible ici"};for(const file of pend)up.push(await window.__copies.upload(file))}
  const files=[...((old&&old.files)||[]),...up].slice(-6),first=!old,sub={text,at:Date.now(),files};
  const extra=isEp?{epreuveSubs:{[id]:sub}}:{submissions:{[id]:sub}};
  if(first)gain(40,(isEp?"A traité l'épreuve : ":"A rendu : ")+(item?.title||""),extra,btn);else touch((isEp?"A modifié sa copie : ":"A modifié : ")+(item?.title||""),extra);
  return{item,sub}}
const netErr=e=>!navigator.onLine||/fetch|network|load failed|timeout|unavailable/i.test(String((e&&(e.message||e.code))||e||""));
async function submitCopy(kind,f){const isEp=kind==="ep",id=f.dataset.id,key=kind+"_"+id,fid=(isEp?"ep_":"hw_")+id;
  const text=(document.getElementById(fid)?.value||"").trim(),pend=PEND[key]||[];
  if(!text&&!pend.length){toast("Écris ta réponse ou ajoute une photo.","x");return}
  const btn=f.querySelector('button[type="submit"]');if(btn)btn.disabled=true;
  const done=()=>{PEND[key]=[];delete S.drafts[fid];f.reset()};
  const toOutbox=async()=>{try{await window.__outbox.put({k:key+"_"+Date.now(),kind,id,text,files:pend.map(x=>({name:x.name,type:x.type,blob:x}))});
    done();S.outboxN=(await window.__outbox.all()).length;toast("Pas de réseau : ta copie sera envoyée automatiquement dès que tu seras connecté.","clock");render()}
    catch(e){toast("Impossible de garder ta copie hors ligne : réessaie avec du réseau.","x");if(btn)btn.disabled=false}};
  if(pend.length&&(!navigator.onLine)&&window.__outbox){await toOutbox();return}
  const first=!((isEp?S.me.epreuveSubs:S.me.submissions)||{})[id];
  try{if(pend.length)toast("Envoi des fichiers…","send");
    const r=await sendCopy(kind,id,text,pend,btn);done();
    toast(!navigator.onLine?"Enregistré : sera envoyé dès que le réseau revient":first?(isEp?"Copie rendue":"Devoir rendu"):"Réponse mise à jour",isEp?"send":"pen");
    if(r.item&&r.item.autoCorrect&&navigator.onLine)autoCorrect(kind,id)}
  catch(e){if(pend.length&&netErr(e)&&window.__outbox){await toOutbox();return}toast("Envoi impossible : "+((e&&e.message)||"réessaie"),"x");if(btn)btn.disabled=false}}
let flushingOb=false;
async function flushOutbox(){if(flushingOb||!window.__outbox||!S.me||S.mode!=="student"||!navigator.onLine)return;flushingOb=true;
  try{const all=await window.__outbox.all();S.outboxN=all.length;
    for(const it of all){try{const files=it.files.map(x=>new File([x.blob],x.name,{type:x.type})),r=await sendCopy(it.kind,it.id,it.text,files,null);
      await window.__outbox.del(it.k);toast("Copie envoyée : "+(r.item?.title||""),"send");if(r.item&&r.item.autoCorrect)autoCorrect(it.kind,it.id)}catch(e){break}}
    S.outboxN=(await window.__outbox.all()).length}catch(e){}finally{flushingOb=false;render()}}

/* ---- Correction automatique par l'IA : calculée sur le SERVEUR (l'élève ne peut pas modifier sa note) ---- */
async function autoCorrect(kind,id){const isEp=kind==="ep",item=isEp?S.eps.find(x=>x.id===id):S.homework.find(x=>x.id===id);
  if(!item||!item.autoCorrect)return;toast("Nova corrige ta copie…","spark");
  try{if(!window.__grade)throw new Error("indisponible");const r=await window.__grade({kind,id});
    if(r&&r.mode==="draft")toast("Copie reçue : ta prof validera ta note.","check");
    else if(r&&typeof r.grade==="number")toast("Ta copie est corrigée : "+r.grade+"/20","check");
    else throw new Error("réponse vide")}
  catch(e){toast("Correction automatique impossible : ta prof corrigera ta copie.","x")}}

const LN=()=>{try{return window.Capacitor?.Plugins?.LocalNotifications||null}catch(e){return null}};

    const list=[],now=new Date(),at=(d,h,m)=>{const x=new Date(d);x.setHours(h,m,0,0);return x},streak=liveStreak(S.me),did=S.me.lastDay===today();
    for(let i=0;i<3;i++){const d=new Date();d.setDate(d.getDate()+i);const t=at(d,18,0);if(t<=now||(i===0&&did))continue;
      list.push({id:nid("daily"+i),title:"Ma Classe d'Anglais",body:i===0&&streak>0?`Ta série de ${streak} jour${streak>1?"s":""} t'attend : 5 minutes d'anglais ?`:DAILY[i%DAILY.length],schedule:{at:t,allowWhileIdle:true},channelId:"rappels"})}
    for(const h of S.homework.filter(visible)){if(!h.due||(S.me.submissions||{})[h.id])continue;const due=new Date(h.due+"T00:00:00"),t1=at(new Date(due.getTime()-864e5),17,0),t2=at(due,8,0);

/* ---- Prononciation : lire une phrase, Nova dit quels mots sont mal compris ---- */
const PRON={A1:["I like chocolate and bananas.","My brother is thirteen years old.","Thank you very much for your help.","This is my third English book.","The weather is nice today.","I have three black cats."],
 A2:["I usually have breakfast at seven o'clock.","She works in a hospital near my house.","Which language do you speak at home?","It was a wonderful Thursday evening.","We watched a really funny film last night.","Could you repeat that, please?"],
 B1:["I would rather travel by train than by plane.","Vegetables are very important for a healthy life.","He thought about the question for three months.","Although it was raining, we decided to walk.","Learning a language takes patience and practice.","The company develops comfortable furniture."],
 B2:["Whether you agree or not, the results are remarkably clear.","The government announced a series of environmental measures.","Thoroughly prepared students rarely feel anxious before exams.","She has been working there since she graduated.","Despite the weather, the ceremony took place as planned.","Nobody could have predicted such a dramatic outcome."]};
const NUMW=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];
const pnw=w=>{let x=String(w).toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9']/g,"");if(/^\d+$/.test(x)&&+x<=20)x=NUMW[+x];return x};
function pronAlign(target,said){const A=target.split(/\s+/).filter(Boolean),a=A.map(pnw),b=String(said).split(/\s+/).map(pnw).filter(Boolean),n=a.length,m=b.length,d=[];
  for(let i=0;i<=n;i++){d.push(new Array(m+1).fill(0));d[i][0]=i}for(let j=0;j<=m;j++)d[0][j]=j;
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  const ok=new Array(n).fill(false);let i=n,j=m;
  while(i>0&&j>0){if(a[i-1]===b[j-1]&&d[i][j]===d[i-1][j-1]){ok[i-1]=true;i--;j--}else if(d[i][j]===d[i-1][j-1]+1){i--;j--}else if(d[i][j]===d[i-1][j]+1)i--;else j--}
  const good=ok.filter(Boolean).length;return{words:A.map((w,k)=>({w,ok:ok[k]})),score:n?Math.round(good/n*100):0}}
function pronNew(){const lv=(S.me&&S.me.level)||"A2",bank=PRON[lv]||PRON.B2,i=Math.floor(Math.random()*bank.length);return{target:bank[i],res:null,busy:false,rewarded:false,last:bank[i]}}
function pronNext(){const lv=(S.me&&S.me.level)||"A2",bank=PRON[lv]||PRON.B2;let t=S.pron?.target,k=0;while((t===S.pron?.target)&&k++<8)t=bank[Math.floor(Math.random()*bank.length)];S.pron={target:t,res:null,busy:false,rewarded:false}}
async function pronAI(){if(!AI.sample||AI.disabled)return;const T=S.pron||(S.pron=pronNew());T.busy=true;render();
  try{const r=await AI.sample(`Écris UNE seule phrase en anglais de 8 à 14 mots, niveau ${(S.me&&S.me.level)||"A2"}, utile dans la vie de tous les jours, avec 1 ou 2 mots difficiles à prononcer pour un francophone (th, h, r, voyelles longues, -ed). Réponds uniquement par la phrase, sans guillemets ni explication.`,{cache:false,modelTier:"quick"});
    const t=String(r.text||"").trim().replace(/^["“]|["”]$/g,"").split("\n")[0];if(t.split(/\s+/).length>=4&&t.length<160){S.pron={target:t,res:null,busy:false,rewarded:false}}else T.busy=false}
  catch(e){T.busy=false;toast("Nova n'a pas pu proposer de phrase : en voici une autre.","x");pronNext()}render()}
async function pronListen(){const T=S.pron||(S.pron=pronNew());if(T.busy)return;T.busy=true;T.res=null;S.micLast="__pron";render();
  try{let alts=[];const P=NATIVE_SR();
    if(P&&!(window.SpeechRecognition||window.webkitSpeechRecognition)){const av=await P.available();if(!av?.available){S.micHelp="nosupport";return}
      const perm=await P.requestPermissions();if(perm&&(perm.speechRecognition==="denied"||perm.microphone==="denied")){S.micHelp="denied";return}

    else if(SRC&&SRC!==true){alts=await new Promise((resolve,reject)=>{const r=new SRC();r.lang="en-US";r.maxAlternatives=3;r.interimResults=false;r.continuous=false;const out=[];
      r.onresult=ev=>{for(const x of ev.results[0])out.push(x.transcript)};r.onerror=ev=>reject(ev.error||"blocked");r.onend=()=>resolve(out);try{r.start()}catch(e){reject("blocked")}})}

  finally{T.busy=false;render()}}
