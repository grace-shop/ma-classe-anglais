const aiRules=()=>`You are Nova, the AI assistant of the "English Classes" app, used in Togo. You know the Togolese school system: primary school from CP1 to CM2 (CEPD exam, English taught in primary school since 2025), middle school (collège) from 6e to 3e (BEPC, 2-hour English test, coefficient 2: reading, grammar and writing), high school (lycée) from 2nde to Terminale (BAC I in 1re, BAC II in Terminale; series A4, C, D, E, F1 to F4, G1 to G3, Ti), marks out of 20 with the grades Passable, Assez bien, Bien and Très bien, school year in three terms. Take your examples from life in Togo (Lomé, Kara, Kpalimé, Sokodé, Aného, the market, the CFA franc, the rainy season, the harmattan). Today is ${new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}${schoolPeriod().label?", "+schoolPeriod().label:""}. ${aiContext()}\nYou can answer any question: English, other subjects, general knowledge, career guidance, everyday life. This is an app for learning English: ALWAYS answer ONLY in English, even if the user writes in French or another language. Use very simple English (A1–A2 level words and short sentences) unless the user's level is higher. Be clear, warm and rather short (3 to 8 sentences, unless asked for more). Put important words in **bold**, use lists with "- " when useful, and give examples when relevant. Do not use tables or headings with #.`;
function mdLite(t){const out=[];let list=false;for(const raw of String(t||"").split("\n")){let line=esc(raw).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/^#{1,4}\s*(.+)$/,"<b>$1</b>");const li=/^\s*(?:[-•*]|\d+[.)])\s+(.*)$/.exec(line);
  if(li){if(!list){out.push("<ul>");list=true}out.push("<li>"+li[1]+"</li>");continue}if(list){out.push("</ul>");list=false}if(line.trim())out.push("<p>"+line+"</p>")}if(list)out.push("</ul>");return out.join("")}

async function aiSend(text){if(AI.busy||!AI.sample)return;text=String(text||"").trim();const img=AI.img;if(!text&&!img)return;if(!text)text="Explain this picture to me.";
  AI.turns.push({role:"user",content:text,img:img?.url||null});AI.img=null;const bubble={role:"assistant",content:"",pending:true};AI.turns.push(bubble);const bi=AI.turns.length-1;AI.busy=true;AI.ctl=new AbortController();renderAI();
  const hist=AI.turns.slice(0,-1).filter(t=>t.content&&!(t.role==="assistant"&&t.error&&!t.content)).slice(-16).map(t=>({role:t.role,content:t.role==="user"&&t.img&&t!==AI.turns[bi-1]?t.content+" (a photo was attached)":t.content}));
  const opts={cache:false,signal:AI.ctl.signal,onText:({text})=>{bubble.content=text;if(bubble.pending){bubble.pending=false;renderAI()}else updateBubble(bi)}};if(img)opts.images=[img.blob];
  try{const r=await AI.sample([{role:"user",content:aiRules()},...hist],opts);bubble.content=r.text;bubble.pending=false;if(r.truncated)bubble.note="Answer cut off: type “continue” to get the rest.";if(AI.speak)aiSpeakText(r.text)}
  catch(e){bubble.pending=false;bubble.content=e.text||"";if(e.code==="cancelled"){if(!bubble.content)AI.turns.splice(bi,1)}else{bubble.error=aiErr(e.code);if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code))bubble.error+=" ";if(e.code==="images_unavailable")AI.canImg=false}}
  finally{AI.busy=false;AI.ctl=null;if(img)setTimeout(()=>{},0);renderAI()}}

function cleanGenQuestions(arr){if(!Array.isArray(arr))return[];const out=[];for(const x of arr){if(!x||typeof x.q!=="string"||!x.q.trim())continue;const explain=typeof x.explain==="string"?x.explain.slice(0,300):"";
  if(x.type==="type"){const acc=(Array.isArray(x.accept)?x.accept:[]).map(String).map(t=>t.trim()).filter(Boolean);if(acc.length)out.push({q:x.q.trim(),type:"type",accept:acc,explain});continue}
  const ch=(Array.isArray(x.choices)?x.choices:[]).map(String).map(t=>t.trim()).filter(Boolean),ans=Number(x.answer);if(ch.length<2||ch.length>6||!(ans>=0&&ans<ch.length)||new Set(ch).size!==ch.length)continue;
  const order=shuffle([...ch.keys()]);out.push({q:x.q.trim(),choices:order.map(i=>ch[i]),answer:order.indexOf(ans),explain})}return out}
async function aiGenQuiz(topic,n){if(!AI.sample||S.gen?.busy)return;S.gen={busy:true};render();const m=S.me||{};
  const prompt=`Create an English quiz of ${n} questions for a learner in Togo: ${PROFILES[m.profile]||"student"}${m.classe?" ("+m.classe+")":""}, level ${m.level||"A2"} (${LEVEL_NAMES[m.level]||""}). Topic: ${topic}.
About 70% multiple-choice questions (4 options, only one correct, plausible distractors) and 30% short written-answer questions (one word or a few words, listing all accepted correct variants, including contractions). Vary the forms: sentence to complete with ___, vocabulary, definitions, find the mistake, mini reading comprehension. Use situations from life in Togo. Everything must be ONLY in English: instructions in very simple English (A1–A2 level), never in French. Check carefully that each correct answer is really correct and that only one option is right. For each question, a short explanation in very simple English (one sentence).
Answer only with a JSON array, for example: [{"q":"She ___ to school every day.","choices":["go","goes","going","gone"],"answer":1,"explain":"With she, the present simple takes an -s."},{"q":"You need food. Complete: I ___ hungry.","type":"type","accept":["am","'m"],"explain":"We use the verb to be: I am hungry."}]`;
  try{const arr=await AI.sample.json(prompt,{cache:false});const qs=cleanGenQuestions(arr).slice(0,n);if(qs.length<3)throw{code:"empty_completion"};
    S.gen=null;S.view=null;S.run={temp:{id:"ai-"+Date.now(),title:"Nova · "+topic,kind:"ai",topic,n,questions:qs},quizId:"ai",i:0,picked:null,score:0,answers:[],wrong:[],combo:0,best:0};S.animate=true;scrollTo(0,0);touch("Nova quiz: "+topic)}

const PEND={},COPYURL={};
const isImg=t=>/^image\//.test(t||"");
async function shrinkImg(file,max=1600,q=.72){if(!isImg(file.type))return file;
  try{const bmp=await createImageBitmap(file),r=Math.min(1,max/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");
    c.width=Math.round(bmp.width*r);c.height=Math.round(bmp.height*r);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(res=>c.toBlob(res,"image/jpeg",q));
    return b&&b.size<file.size?new File([b],(file.name||"photo").replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"}):file}catch(e){return file}}
async function addCopies(key,files){const a=PEND[key]=PEND[key]||[];
  for(const f of files){if(a.length>=5){toast("5 files maximum.","x");break}
    if(!isImg(f.type)&&f.type!=="application/pdf"){toast("Format not accepted: photo or PDF only.","x");continue}
    if(f.type==="application/pdf"&&f.size>5*1024*1024){toast("PDF too big (5 MB maximum).","x");continue}
    a.push(await shrinkImg(f))}
  render()}
function pendHTML(key){const a=PEND[key]||[];return a.length?`<div class="row" style="gap:8px;flex-wrap:wrap">${a.map((f,i)=>`<span class="chip">${ic(isImg(f.type)?"camera":"file")}${esc(f.name.length>22?f.name.slice(0,19)+"…":f.name)}<button type="button" class="iconbtn" data-a="cpRm" data-k="${key}" data-i="${i}" aria-label="Remove" style="margin-left:4px">${ic("x")}</button></span>`).join("")}</div>`:""}

async function sendCopy(kind,id,text,pend,btn){const isEp=kind==="ep",item=isEp?S.eps.find(x=>x.id===id):S.homework.find(x=>x.id===id);
  const old=((isEp?S.me.epreuveSubs:S.me.submissions)||{})[id],up=[];
  if(pend.length){if(!window.__copies)throw{message:"not available here"};for(const file of pend)up.push(await window.__copies.upload(file))}
  const files=[...((old&&old.files)||[]),...up].slice(-6),first=!old,sub={text,at:Date.now(),files};
  const extra=isEp?{epreuveSubs:{[id]:sub}}:{submissions:{[id]:sub}};
  if(first)gain(40,(isEp?"Did the test: ":"Handed in: ")+(item?.title||""),extra,btn);else touch((isEp?"Edited their test answers: ":"Edited: ")+(item?.title||""),extra);
  return{item,sub}}
const netErr=e=>!navigator.onLine||/fetch|network|load failed|timeout|unavailable/i.test(String((e&&(e.message||e.code))||e||""));
async function submitCopy(kind,f){const isEp=kind==="ep",id=f.dataset.id,key=kind+"_"+id,fid=(isEp?"ep_":"hw_")+id;
  const text=(document.getElementById(fid)?.value||"").trim(),pend=PEND[key]||[];
  if(!text&&!pend.length){toast("Write your answer or add a photo.","x");return}
  const btn=f.querySelector('button[type="submit"]');if(btn)btn.disabled=true;
  const done=()=>{PEND[key]=[];delete S.drafts[fid];f.reset()};
  const toOutbox=async()=>{try{await window.__outbox.put({k:key+"_"+Date.now(),kind,id,text,files:pend.map(x=>({name:x.name,type:x.type,blob:x}))});
    done();S.outboxN=(await window.__outbox.all()).length;toast("No network: your work will be sent automatically as soon as you are connected.","clock");render()}
    catch(e){toast("Cannot keep your work offline: try again with a network.","x");if(btn)btn.disabled=false}};
  if(pend.length&&(!navigator.onLine)&&window.__outbox){await toOutbox();return}
  const first=!((isEp?S.me.epreuveSubs:S.me.submissions)||{})[id];
  try{if(pend.length)toast("Sending files…","send");
    const r=await sendCopy(kind,id,text,pend,btn);done();
    toast(!navigator.onLine?"Saved: will be sent when the network is back":first?(isEp?"Test handed in":"Homework handed in"):"Answer updated",isEp?"send":"pen");
    if(r.item&&r.item.autoCorrect&&navigator.onLine)autoCorrect(kind,id)}
  catch(e){if(pend.length&&netErr(e)&&window.__outbox){await toOutbox();return}toast("Cannot send: "+((e&&e.message)||"try again"),"x");if(btn)btn.disabled=false}}
let flushingOb=false;
async function flushOutbox(){if(flushingOb||!window.__outbox||!S.me||S.mode!=="student"||!navigator.onLine)return;flushingOb=true;
  try{const all=await window.__outbox.all();S.outboxN=all.length;
    for(const it of all){try{const files=it.files.map(x=>new File([x.blob],x.name,{type:x.type})),r=await sendCopy(it.kind,it.id,it.text,files,null);
      await window.__outbox.del(it.k);toast("Work sent: "+(r.item?.title||""),"send");if(r.item&&r.item.autoCorrect)autoCorrect(it.kind,it.id)}catch(e){break}}
    S.outboxN=(await window.__outbox.all()).length}catch(e){}finally{flushingOb=false;render()}}

/* ---- Prononciation : lire une phrase, Nova dit quels mots sont mal compris ---- */
const PRON={A1:["I like chocolate and bananas.","My brother is thirteen years old.","Thank you very much for your help.","This is my third English book.","The weather is nice today.","I have three black cats."],
 A2:["I usually have breakfast at seven o'clock.","She works in a hospital near my house.","Which language do you speak at home?","It was a wonderful Thursday evening.","We watched a really funny film last night.","Could you repeat that, please?"],
 B1:["I would rather travel by train than by plane.","Vegetables are very important for a healthy life.","He thought about the question for three months.","Although it was raining, we decided to walk.","Learning a language takes patience and practice.","The company develops comfortable furniture."],
 B2:["Whether you agree or not, the results are remarkably clear.","The government announced a series of environmental measures.","Thoroughly prepared students rarely feel anxious before exams.","She has been working there since she graduated.","Despite the weather, the ceremony took place as planned.","Nobody could have predicted such a dramatic outcome."]};
const NUMW=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];
const pnw=w=>{let x=String(w).toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9']/g,"");if(/^\d+$/.test(x)&&+x<=20)x=NUMW[+x];return x};
function pronAlign(target,said){const A=target.split(/\s+/).filter(Boolean),a=A.map(pnw),b=String(said).split(/\s+/).map(pnw).filter(Boolean),n=a.length,m=b.length,d=[];
  for(let i=0;i<=n;i++){d.push(new Array(m+1).fill(0));d[i][0]=i}for(let j=0;j<=m;j++)d[0][j]=j;
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  const ok=new Array(n).fill(false);let i=n,j=m;
  while(i>0&&j>0){if(a[i-1]===b[j-1]&&d[i][j]===d[i-1][j-1]){ok[i-1]=true;i--;j--}else if(d[i][j]===d[i-1][j-1]+1){i--;j--}else if(d[i][j]===d[i-1][j]+1)i--;else j--}
  const good=ok.filter(Boolean).length;return{words:A.map((w,k)=>({w,ok:ok[k]})),score:n?Math.round(good/n*100):0}}
function pronNew(){const lv=(S.me&&S.me.level)||"A2",bank=PRON[lv]||PRON.B2,i=Math.floor(Math.random()*bank.length);return{target:bank[i],res:null,busy:false,rewarded:false,last:bank[i]}}
function pronNext(){const lv=(S.me&&S.me.level)||"A2",bank=PRON[lv]||PRON.B2;let t=S.pron?.target,k=0;while((t===S.pron?.target)&&k++<8)t=bank[Math.floor(Math.random()*bank.length)];S.pron={target:t,res:null,busy:false,rewarded:false}}
async function pronAI(){if(!AI.sample||AI.disabled)return;const T=S.pron||(S.pron=pronNew());T.busy=true;render();
  try{const r=await AI.sample(`Write ONE single English sentence of 8 to 14 words, level ${(S.me&&S.me.level)||"A2"}, useful in everyday life, with 1 or 2 words that are hard to pronounce for a French speaker (th, h, r, long vowels, -ed). Answer only with the sentence, without quotes or explanation.`,{cache:false,modelTier:"quick"});
    const t=String(r.text||"").trim().replace(/^["“]|["”]$/g,"").split("\n")[0];if(t.split(/\s+/).length>=4&&t.length<160){S.pron={target:t,res:null,busy:false,rewarded:false}}else T.busy=false}
  catch(e){T.busy=false;toast("Nova could not suggest a sentence: here is another one.","x");pronNext()}render()}
async function pronListen(){const T=S.pron||(S.pron=pronNew());if(T.busy)return;T.busy=true;T.res=null;S.micLast="__pron";render();
  try{let alts=[];const P=NATIVE_SR();
    if(P&&!(window.SpeechRecognition||window.webkitSpeechRecognition)){const av=await P.available();if(!av?.available){S.micHelp="nosupport";return}
      const perm=await P.requestPermissions();if(perm&&(perm.speechRecognition==="denied"||perm.microphone==="denied")){S.micHelp="denied";return}
      const res=await P.start({language:"en-US",maxResults:3,prompt:"Read the sentence aloud",partialResults:false,popup:true});alts=res?.matches||[]}
    else if(SRC&&SRC!==true){alts=await new Promise((resolve,reject)=>{const r=new SRC();r.lang="en-US";r.maxAlternatives=3;r.interimResults=false;r.continuous=false;const out=[];
      r.onresult=ev=>{for(const x of ev.results[0])out.push(x.transcript)};r.onerror=ev=>reject(ev.error||"blocked");r.onend=()=>resolve(out);try{r.start()}catch(e){reject("blocked")}})}
    else{S.micHelp="nosupport";return}
    if(!alts.length){S.micHelp="nospeech";return}
    let best=null;for(const a of alts){const r=pronAlign(T.target,a);if(!best||r.score>best.score)best={...r,said:a}}
    T.res=best;if(best.score>=80&&!T.rewarded){T.rewarded=true;gain(10,"Practised pronunciation",{})}}
  catch(e){S.micHelp=(e==="not-allowed"||e==="service-not-allowed"||e==="audio-capture")?"denied":e==="no-speech"?"nospeech":"blocked"}
  finally{T.busy=false;render()}}

function chartHTML(st){const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(dayStr(d))}

  if(el.type==="checkbox"&&el.id){S.drafts[el.id]=el.checked?"1":"";if(el.id==="q_exam"||el.id==="h_auto"||el.id==="e_auto")render()}});

async function srcBlob(src){const key=src.k+":"+src.id;let b=await fcGet(key);if(b)return b;
  const r=await fetch(await srcURL(src));if(!r.ok)throw new Error("http "+r.status);b=await r.blob();
  if(src.t&&(!b.type||b.type==="application/octet-stream"||b.type==="binary/octet-stream"))b=new Blob([b],{type:src.t});
  await fcPut(key,b);return b}

function v4FilesToKeep(){const out=[];if(S.mode!=="student"||!S.me)return out;
  const eps=typeof byLevel==="function"?byLevel(S.eps||[]):(S.eps||[]);
  for(const e of eps){if(e.fileId)out.push({k:"a",id:e.fileId,t:e.fileType});const cp=e.corrigeVisible&&e.corrigePublic;if(cp&&cp.fileId)out.push({k:"a",id:cp.fileId,t:cp.fileType})}
  for(const h of (S.homework||[]).filter(x=>typeof visible!=="function"||visible(x)))for(const f of h.files||[])out.push({k:"a",id:f.id,t:f.type});
  return out}

async function pdfToImages(blob,max=3){const lib=await loadPdfJs(),doc=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer()),isEvalSupported:false}).promise,out=[];
  for(let i=1;i<=Math.min(max,doc.numPages);i++){const p=await doc.getPage(i),v0=p.getViewport({scale:1}),vp=p.getViewport({scale:Math.min(2,1400/v0.width)}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
    const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);await p.render({canvasContext:g,viewport:vp}).promise;out.push(await new Promise(r=>c.toBlob(r,"image/jpeg",.8)))}return out.filter(Boolean)}

const cleanMd=t=>String(t||"").replace(/\r/g,"");
function toCp1252(str){const map={"€":128,"‚":130,"ƒ":131,"„":132,"…":133,"†":134,"‡":135,"ˆ":136,"‰":137,"Š":138,"‹":139,"Œ":140,"Ž":142,"‘":145,"’":146,"“":147,"”":148,"•":149,"–":150,"—":151,"˜":152,"™":153,"š":154,"›":155,"œ":156,"ž":158,"Ÿ":159};
  let o="";for(const ch of str){const c=ch.codePointAt(0);let b=c<128||(c>=160&&c<256)?c:map[ch];if(b===undefined)b=63;const s=String.fromCharCode(b);o+=s==="("||s===")"||s==="\\"?"\\"+s:s}return o}
function makePdf(title,text){const W=595,H=842,M=50,lines=[];const wrap=(s,size,bold)=>{const max=Math.floor((W-2*M)/(size*(bold?.56:.52)));const words=s.split(/\s+/);let cur="";const out=[];for(const w of words){if((cur+" "+w).trim().length>max&&cur){out.push(cur);cur=w}else cur=(cur+" "+w).trim()}out.push(cur);return out};
  lines.push({t:title,s:16,b:true,gap:8});lines.push({t:"Answer key · English Classes",s:9,b:false,gap:14});
  for(let raw of cleanMd(text).split("\n")){raw=raw.replace(/\*\*/g,"").replace(/^\s*[-*•]\s+/,"• ");if(!raw.trim()){lines.push({t:"",s:6});continue}const h=/^#{1,3}\s+/.test(raw);const t=raw.replace(/^#{1,3}\s+/,"");for(const l of wrap(t,h?12.5:11,h))lines.push({t:l,s:h?12.5:11,b:h,gap:h?4:0})}
  const pages=[];let cur=[],y=H-M;for(const l of lines){const lh=l.s*1.38+(l.gap||0);if(y-lh<M){pages.push(cur);cur=[];y=H-M}y-=l.s*1.38;cur.push({...l,y});y-=(l.gap||0)}pages.push(cur);
  const objs=[];const add=s=>{objs.push(s);return objs.length};const fR=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>"),fB=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  const pagesId=objs.length+1;objs.push(null);const kids=[];
  pages.forEach((pg,i)=>{let c="BT\n";for(const l of pg){if(!l.t)continue;c+=`/${l.b?"F2":"F1"} ${l.s} Tf 1 0 0 1 ${M} ${l.y.toFixed(1)} Tm (${toCp1252(l.t)}) Tj\n`}c+=`/F1 8 Tf 1 0 0 1 ${W-M-40} 28 Tm (${i+1} / ${pages.length}) Tj\nET`;
    const cid=add(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);kids.push(add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${fR} 0 R /F2 ${fB} 0 R >> >> /Contents ${cid} 0 R >>`))});
  objs[pagesId-1]=`<< /Type /Pages /Kids [${kids.map(k=>k+" 0 R").join(" ")}] /Count ${kids.length} >>`;const cat=add(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);
  let out="%PDF-1.4\n",offs=[];objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});const xref=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n${offs.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")}trailer\n<< /Size ${objs.length+1} /Root ${cat} 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes=new Uint8Array(out.length);for(let i=0;i<out.length;i++)bytes[i]=out.charCodeAt(i)&255;return new Blob([bytes],{type:"application/pdf"})}
function makeDoc(title,text){const body=cleanMd(text).split("\n").map(l=>/^#{1,3}\s+/.test(l)?`<h2>${esc(l.replace(/^#{1,3}\s+/,""))}</h2>`:l.trim()?`<p>${esc(l).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}</p>`:"").join("");
  return new Blob([`﻿<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Calibri,Arial,sans-serif;font-size:12pt}h1{font-size:18pt;color:#1E2558}h2{font-size:14pt;color:#1E2558;margin-top:14pt}p{margin:4pt 0}</style></head><body><h1>${esc(title)}</h1><p><i>Answer key · English Classes</i></p>${body}</body></html>`],{type:"application/msword"})}
async function makePng(title,text){const W=1240,pad=70,c=document.createElement("canvas"),g=c.getContext("2d");const font=(s,b)=>`${b?"700":"400"} ${s}px Manrope, Arial, sans-serif`;
  const items=[];const wrap=(t,s,b)=>{g.font=font(s,b);const out=[];let cur="";for(const w of t.split(/\s+/)){const tt=(cur+" "+w).trim();if(g.measureText(tt).width>W-2*pad&&cur){out.push(cur);cur=w}else cur=tt}out.push(cur);return out};
  for(const l of wrap(title,46,true))items.push({t:l,s:46,b:true,c:"#1E2558"});items.push({t:"Answer key · English Classes",s:22,b:false,c:"#8A8FA8",gap:24});
  for(let raw of cleanMd(text).split("\n")){raw=raw.replace(/\*\*/g,"").replace(/^\s*[-*•]\s+/,"• ");if(!raw.trim()){items.push({t:"",s:14});continue}const h=/^#{1,3}\s+/.test(raw),t=raw.replace(/^#{1,3}\s+/,"");for(const l of wrap(t,h?32:27,h))items.push({t:l,s:h?32:27,b:h,c:h?"#1E2558":"#1B1F33",gap:h?6:0})}
  const H=Math.min(16000,pad*2+items.reduce((n,i)=>n+i.s*1.45+(i.gap||0),0));c.width=W;c.height=H;g.fillStyle="#fff";g.fillRect(0,0,W,H);g.fillStyle="#4B6BD6";g.fillRect(0,0,W,14);
  let y=pad;for(const i of items){y+=i.s*1.2;g.font=font(i.s,i.b);g.fillStyle=i.c||"#000";if(i.t)g.fillText(i.t,pad,y);y+=i.s*.25+(i.gap||0)}
  return await new Promise(r=>c.toBlob(r,"image/png"))}
async function corDownload(kind){const C=V4.cor;if(!C)return;const x=corItem(C.kind,C.id),title="Answer key - "+(x?.title||"homework"),text=corText(),base=title.replace(/[\\/:*?"<>|]+/g,"").slice(0,70);
  try{const blob=kind==="pdf"?makePdf(title,text):kind==="doc"?makeDoc(title,text):await makePng(title,text);const name=base+"."+(kind==="doc"?"doc":kind);
    if(S.dl&&S.dl.save)await S.dl.save({filename:name,data:blob});else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}toast("File saved","download")}

async function v4Check(t){try{
  const r=await Promise.race([AI.sample.json(`You check chat messages written by a learner of English in Togo. Message:
"""${String(t).slice(0,600)}"""
Decide:
- "french": the message is fully or partly in French (or another language than English) → give the natural English version.
- "mistakes": it is in English but has real mistakes (grammar, spelling, wrong word, word order, missing words) → give the corrected English.
- "ok": it is correct English. Ignore small things: capital letters, final punctuation, informal chat style (hi, ok, lol, pls), emojis, names.
Keep the same meaning, the emojis and the names; simple, natural English, as a friendly student would write.
The topic can be anything (personal, private, sensitive or taboo): only correct the language. Never refuse, never judge, never add advice, never change or soften the meaning.
Answer only in JSON: {"status":"ok" or "french" or "mistakes","english":"the correct English version (empty if ok)"}`,{cache:false}),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),15000))]);
  const st=r&&r.status,en=String(r&&r.english||"").trim();
  if(!en||(st!=="french"&&st!=="mistakes"))return null;
  const n=x=>x.toLowerCase().replace(/[^\p{L}\p{N}]+/gu,"");if(n(en)===n(String(t)))return null;
  return{k:st==="french"?"fr":"fix",en:en.slice(0,480)}}catch(e){return null}}

  if(col==="decks")t+=" "+(d.cards||[]).map(c=>[c.fr,c.ex].join(" ")).join(" ");
  if(col==="pictures")t+=" "+(d.alt||[]).join(" ");return t}
/* a) syllabus content → English */
async function progEnglish(){if(progEnglish.busy||S.mode!=="teacher"||!S.isOwner||!S.db)return;if((S.settings||{}).contentVer===CONTENT_VER)return;
  if(PROGC===null){progLoad();return}if(!PROGC||!(S.lessons||[]).length)return;progEnglish.busy=true;
  const have={lessons:S.lessons,quizzes:S.quizzes,decks:S.decks||[],epreuves:S.eps};let n=0;
  try{for(const[col,docs]of Object.entries(PROGC)){
      for(const[id,en]of Object.entries(docs)){let cur;
        if(col==="corriges"){cur=(S.corriges||{})[id];if(!cur)continue;if(cur.text===en.text)continue;await write(()=>S.db.doc("corriges/"+id).set({...cur,text:en.text}));n++;continue}
        const L=have[col];if(!L)continue;cur=L.find(x=>x.id===id);if(!cur)continue;
        const keep={};for(const k of["createdAt","fileId","fileName","fileType","corrigeVisible","hidden","teacherId","audience","minutes","exam"])if(cur[k]!==undefined&&cur[k]!=="")keep[k]=cur[k];
        const next={...en,...keep};const {id:_i,...curData}=cur;if(JSON.stringify(Object.fromEntries(Object.entries(curData).sort()))===JSON.stringify(Object.fromEntries(Object.entries(next).sort())))continue;
        await write(()=>S.db.doc(col+"/"+id).set(next));n++}}
    await write(()=>S.db.doc("settings/main").set({...S.settings,contentVer:CONTENT_VER}));
    if(n)toast(`${n} lessons, quizzes and papers updated to English`,"check")}
  catch(e){console.warn("progEnglish",e)}progEnglish.busy=false}
setInterval(()=>{try{progEnglish()}catch(e){}},5000);
/* b) teachers' own content still in French */
const TR={busy:false,done:0,total:0,err:0};
function frItems(){const progIds=new Set();if(PROGC)for(const docs of Object.values(PROGC))for(const id of Object.keys(docs))progIds.add(id);
  const out=[];for(const[col,key]of Object.entries(COLS))for(const d of(S[key]||[])){if(!d||progIds.has(d.id))continue;if(S.mode==="teacher"&&!S.isOwner&&d.teacherId&&d.teacherId!==S.uid)continue;if(frLike(docText(col,d)))out.push([col,d])}
  for(const[id,c]of Object.entries(S.corriges||{}))if(!progIds.has(id)&&frLike(c.text))out.push(["corriges",{id,...c}]);return out}
function trPayload(col,d){const k=col==="announcements"?"anns":col,p={};for(const f of(TXT[k]||[]))if(d[f])p[f]=d[f];
  if(col==="quizzes")p.questions=(d.questions||[]).map(q=>({q:q.q||"",...(q.choices?{choices:q.choices}:{}),...(q.hint?{hint:q.hint}:{}),...(q.explain?{explain:q.explain}:{})}));
  if(col==="decks")p.cards=(d.cards||[]).map(c=>({en:c.en||"",fr:c.fr||"",ex:c.ex||""}));
  if(col==="pictures"&&d.alt)p.alt=d.alt;if(col==="corriges")p.text=d.text||"";return p}
function trMerge(col,d,r){const out={...d};delete out.id;const k=col==="announcements"?"anns":col;
  for(const f of[...(TXT[k]||[]),"text"])if(typeof r[f]==="string"&&r[f].trim()&&d[f]!==undefined)out[f]=r[f];
  if(col==="quizzes"&&Array.isArray(r.questions)&&r.questions.length===(d.questions||[]).length)out.questions=d.questions.map((q,i)=>{const t=r.questions[i]||{};const o={...q};if(typeof t.q==="string"&&t.q.trim())o.q=t.q;if(Array.isArray(t.choices)&&q.choices&&t.choices.length===q.choices.length)o.choices=t.choices.map((c,j)=>String(c||q.choices[j]));if(typeof t.hint==="string"&&q.hint)o.hint=t.hint;if(typeof t.explain==="string"&&q.explain)o.explain=t.explain;return o});
  if(col==="decks"&&Array.isArray(r.cards)&&r.cards.length===(d.cards||[]).length)out.cards=d.cards.map((c,i)=>{const t=r.cards[i]||{};return{...c,...(typeof t.fr==="string"&&t.fr.trim()?{fr:t.fr}:{}),...(typeof t.ex==="string"&&t.ex.trim()?{ex:t.ex}:{})}});
  if(col==="pictures"&&Array.isArray(r.alt))out.alt=r.alt.map(String);return out}
async function trAll(){if(TR.busy||!AI.sample)return;const L=frItems();if(!L.length){toast("Everything is already in English.","check");return}TR.busy=true;TR.done=0;TR.err=0;TR.total=L.length;render();
  for(const[col,d]of L){try{const p=trPayload(col,d);
      const r=await AI.sample.json(`This is content from an English-learning app for students in Togo. Some text is in French. Translate EVERY French text into natural, simple English (A1–B1 level). Keep text that is already in English exactly as it is. Keep exactly the same JSON keys, the same arrays, the same number and order of items, and markdown such as **bold**.
For a field named "fr": write a short, very simple English definition of the English word (never French).
For a quiz question that asks to translate from French (for example « Août » in English is…), rewrite it as an English-only question that has the same correct answer (for example: The 8th month of the year is…), and keep the choices in the same order.
Return ONLY the JSON object.
${JSON.stringify(p)}`,{modelTier:"complex",cache:false});
      if(!r||typeof r!=="object")throw new Error("bad");const next=trMerge(col,d,r);const path=(col==="announcements"?"announcements":col)+"/"+d.id;
      await write(()=>S.db.doc(path).set(next))}catch(e){TR.err++}TR.done++;render()}
  TR.busy=false;toast(TR.err?`Done, ${TR.err} item(s) could not be translated: try again.`:"All your content is now in English!",TR.err?"x":"check");render()}
function trCardHTML(){if(S.mode!=="teacher"||!(S.isOwner||S.isStaff)||!AI.sample||AI.disabled)return"";if(PROGC===null)progLoad();const n=TR.busy?TR.total-TR.done:frItems().length;if(!n&&!TR.busy)return"";
  return`<div class="section"><div class="glass card row between trcard"><div><b>${ic("spark")} ${TR.busy?`Nova is translating… ${TR.done} / ${TR.total}`:`${n} of your lessons, quizzes or homework still contain French`}</b><p class="sub small" style="margin:0">The app is English only. Nova can translate them into simple English for you (French quiz questions become English questions).</p></div>${TR.busy?`<span class="v4spin"></span>`:`<button type="button" class="btn sm" data-v4="trAll">${ic("spark")}Translate with Nova</button>`}</div></div>`}
{const _cv=contentView;contentView=function(){return trCardHTML()+_cv()}}
{const _dv=dashView;dashView=function(){const h=_dv();return(S.isOwner&&(S.settings||{}).contentVer!==CONTENT_VER&&PROGC?`<div class="section"><div class="glass card small">${ic("refresh")} Updating the syllabus lessons and quizzes to English…</div></div>`:"")+h}}
document.addEventListener("click",e=>{const el=e.target.closest&&e.target.closest('[data-v4="trAll"]');if(el){e.preventDefault();trAll()}},true);
/* c) daily words with French meanings (made before the English version) are replaced */
setInterval(()=>{try{if(S.mode!=="student"||!S.me||isParent(S.me)||V4.wdFix===S.uid)return;V4.wdFix=S.uid;const d=wdOf(),items=d.items||[];
  const bad=items.filter(w=>frLike(w.fr)||frLike(w.exfr)||/[àâçéèêëîïôûùœ]/.test((w.fr||"")+(w.exfr||"")));if(!bad.length)return;
  write(()=>meRef().update({dailyWords:{day:"",items:items.filter(w=>!bad.includes(w))}})).then(()=>{V4.wdAt=0;V4.words=false;try{wdGen()}catch(e){}}).catch(()=>{})}catch(e){}},6000);

   23. Students always see the English syllabus (even before the owner's

function progOverlay(){if(!S.lessons||!S.lessons.length)return;const fr=[["lessons","lessons"],["quizzes","quizzes"],["decks","decks"],["epreuves","eps"]].some(([c,k])=>(S[k]||[]).some(x=>String(x.id).startsWith("prog-")&&frLike(docText(c,x))));
  if(!fr)return;if(PROGC===null){progLoad();return}if(!PROGC)return;let ch=0;
  for(const[c,k]of[["lessons","lessons"],["quizzes","quizzes"],["decks","decks"],["epreuves","eps"]]){const src=PROGC[c]||{};
    for(const x of(S[k]||[])){const en=src[x.id];if(!en||!frLike(docText(c,x)))continue;for(const f of["title","theme","grammar","body","questions","cards","sujet","year"])if(en[f]!==undefined)x[f]=en[f];ch++}}
  for(const[id,cc]of Object.entries(S.corriges||{})){const en=(PROGC.corriges||{})[id];if(en&&frLike(cc.text)){cc.text=en.text;ch++}}
  if(ch)render()}
setInterval(()=>{try{progOverlay()}catch(e){}},2500);

progEnglish=async function(){if(progEnglish.busy||!(S.isOwner||S.isStaff)||!S.db)return;if((S.settings||{}).contentVer===CONTENT_VER)return;if(!S.isOwner&&progEnglish.ranFor===S.uid)return;
  if(PROGC===null){progLoad();return}if(!PROGC||!(S.lessons||[]).length)return;progEnglish.busy=true;progEnglish.ranFor=S.uid;
  const have={lessons:S.lessons,quizzes:S.quizzes,decks:S.decks||[],epreuves:S.eps};let n=0;
  try{for(const[col,docs]of Object.entries(PROGC)){for(const[id,en]of Object.entries(docs)){
      if(col==="corriges"){const cur=(S.corriges||{})[id];if(!cur||cur.text===en.text)continue;await write(()=>S.db.doc("corriges/"+id).set({...cur,text:en.text}));n++;continue}
      const L=have[col];if(!L)continue;const cur=L.find(x=>x.id===id);if(!cur)continue;
      const same=["title","theme","grammar","body","sujet"].every(f=>(cur[f]||"")===(en[f]||""))&&JSON.stringify(cur.questions||null)===JSON.stringify(en.questions||null)&&JSON.stringify(cur.cards||null)===JSON.stringify(en.cards||null);if(same)continue;
      const keep={};for(const k of["createdAt","fileId","fileName","fileType","corrigeVisible","hidden","teacherId","audience","minutes","exam"])if(cur[k]!==undefined&&cur[k]!=="")keep[k]=cur[k];
      await write(()=>S.db.doc(col+"/"+id).set({...en,...keep}));n++}}
    if(S.isOwner)await write(()=>S.db.doc("settings/main").set({...S.settings,contentVer:CONTENT_VER}));
    if(n)toast(`${n} lessons, quizzes and papers updated to English`,"check")}catch(e){console.warn("progEnglish",e)}progEnglish.busy=false};
/* lessons: | tables |, *italics* */
{const _lh=lessonHTML;lessonHTML=function(body){const parts=String(body||"").split(/\n{2,}/);
  return parts.map(p=>{const lines=p.split("\n").map(x=>x.trim()).filter(Boolean);
    if(lines.length>=2&&lines.every(x=>x.startsWith("|"))){const rows=lines.filter(x=>!/^\|[\s:|-]+\|?$/.test(x)).map(x=>x.replace(/^\||\|$/g,"").split("|").map(c=>c.trim()));
      const cell=c=>esc(c).replace(/\*\*(.+?)\*\*/g,(m,w)=>`<strong data-say="${w}">${w}</strong>`).replace(/\*(.+?)\*/g,"<em>$1</em>");
      return`<div class="ltable"><table><thead><tr>${rows[0].map(c=>`<th>${cell(c)}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${cell(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
    return _lh(p).replace(/(^|[\s(>])\*([^*\n<>]+?)\*(?=[\s).,;:!?<]|$)/g,"$1<em>$2</em>")}).join("")}}
{const st=document.createElement("style");st.textContent=`.ltable{overflow-x:auto;margin:10px 0}.ltable table{border-collapse:collapse;width:100%;font-size:.95rem}.ltable th,.ltable td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}.ltable th{background:var(--surface2);font-weight:800}`;document.head.appendChild(st)}
