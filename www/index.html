<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: porcelain app — soft light ground with slow pearl 3D behind, white cards with hairline borders, ink primary + gold for rewards; sticky header, segmented nav (top on desktop, bottom bar on phone) */
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --surface2:#F7F8FB; --line:#E3E6EE; --line2:#D2D6E3;
  --fg:#141833; --muted:#646A85; --ink:#1E2558; --ink-soft:#ECEEF8;
  --sky:#4B6BD6; --sky-soft:#E8EDFB; --gold:#A8823A; --gold-soft:#F6EFDF; --rose:#B4546F; --rose-soft:#F8E8EE;
  --ok:#1D8A5F; --ok-soft:#E2F3EA; --bad:#C0394F; --bad-soft:#FAE5E9;
  --cyan:var(--sky); --coral:var(--rose); --glass2:var(--surface2);
  --grad:linear-gradient(120deg,#1E2558 0%,#3F55C4 100%);
  --gradtext:linear-gradient(100deg,#1E2558 0%,#4B6BD6 55%,#A8823A 100%);
  --shadow:0 1px 2px rgba(20,24,60,.04),0 10px 30px rgba(20,24,60,.06);
  --shadow-lg:0 2px 6px rgba(20,24,60,.05),0 24px 60px rgba(20,24,60,.10);
  --f-display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:22px; color-scheme:light;
  --glass-bg:rgba(255,255,255,.86); --header-bg:rgba(242,243,247,.78); --nav-bg:rgba(255,255,255,.88); --hero-bg:linear-gradient(135deg,rgba(255,255,255,.95),rgba(248,249,253,.88)); --empty-bg:rgba(255,255,255,.6); --flash-front:linear-gradient(160deg,#FFFFFF,#F1F3FA); --overlay:rgba(20,24,51,.35); --ink-hover:#2A3372; --on-ink:#FFFFFF; --warn-ink:#765417; --ok-ink:#126042; --bad-ink:#9E2639;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;min-height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased}
#bg3d{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none;opacity:.9}
.aurora{position:fixed;inset:-10%;z-index:0;pointer-events:none;background:
  radial-gradient(38% 32% at 12% 8%,rgba(75,107,214,.10),transparent 70%),
  radial-gradient(32% 30% at 92% 18%,rgba(168,130,58,.09),transparent 70%),
  radial-gradient(40% 36% at 60% 100%,rgba(180,84,111,.06),transparent 70%)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:70;pointer-events:none}
.wrap{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 120px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;margin-inline:-16px;padding-inline:16px;background:var(--header-bg);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-bottom:1px solid rgba(211,214,227,.55)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;border-radius:13px;background:var(--grad);display:grid;place-items:center;font-family:var(--f-display);font-style:italic;font-size:1.25rem;color:#fff;flex:none;box-shadow:0 6px 16px rgba(30,37,88,.25)}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:1.45rem;margin:0;line-height:1;white-space:nowrap;letter-spacing:-.01em}
.brand small{display:block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:3px}
.hdr-right{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.85rem;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.pill.fire{color:var(--gold)}
.pill.xp{color:var(--ink)}
.iconbtn{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--surface);border:1px solid var(--line);color:var(--ink);cursor:pointer;box-shadow:var(--shadow)}
.iconbtn:hover{border-color:var(--line2)}
@media (max-width:520px){.brand h1,.brand small{display:none}}

/* nav */
nav.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:9;display:flex;gap:2px;padding:5px;margin:14px auto 28px;width:max-content;max-width:100%;border-radius:999px;background:var(--nav-bg);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow)}
nav.tabs button{position:relative;display:flex;align-items:center;gap:7px;font:inherit;font-weight:600;font-size:.92rem;color:var(--muted);background:none;border:0;padding:9px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button svg{width:18px;height:18px}
nav.tabs button[aria-current="true"]{color:var(--on-ink);background:var(--ink);box-shadow:0 4px 14px rgba(30,37,88,.25)}
nav.tabs .count{position:absolute;top:1px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rose);color:#fff;font-size:.66rem;display:grid;place-items:center;font-weight:700}
@media (max-width:760px){
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;margin:0;border-radius:24px 24px 0 0;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:var(--nav-bg);border-width:1px 0 0}
  nav.tabs button{flex-direction:column;gap:3px;font-size:.66rem;padding:7px 4px;border-radius:14px;flex:1;min-width:0}
  nav.tabs button svg{width:22px;height:22px}
  nav.tabs .count{right:calc(50% - 22px)}
}

/* type */
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.6rem,4vw,2.15rem);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-family:var(--f-body);font-weight:700;font-size:1.04rem;margin:0;text-wrap:balance;line-height:1.35}
.gradtext{background:var(--gradtext);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic;padding-right:.08em}
.eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sub{color:var(--muted);margin:6px 0 0;font-size:.98rem;max-width:62ch}
.muted{color:var(--muted)} .small{font-size:.86rem} .mono{font-family:var(--f-mono)}

/* layout */
.section{display:grid;gap:16px;margin-bottom:40px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.glass{background:var(--glass-bg);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);min-width:0}
.card{padding:20px;display:grid;gap:10px;align-content:start;position:relative;overflow:hidden}
.card .glow{display:none}
.card.click,.tilt{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s}
.card.click{cursor:pointer}
.card.click:hover,.tilt:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--line2)}
.card .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.card .ic svg{width:21px;height:21px}
.t-cyan{background:var(--sky-soft);color:var(--sky)} .t-coral{background:var(--rose-soft);color:var(--rose)} .t-gold{background:var(--gold-soft);color:var(--gold)} .t-ok{background:var(--ok-soft);color:var(--ok)} .t-grad{background:var(--grad);color:#fff}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;letter-spacing:.02em;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip svg{width:13px;height:13px}
.chip.lvl{background:var(--ink-soft);color:var(--ink);border-color:transparent;font-family:var(--f-mono)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.ex{background:transparent;border:1px dashed var(--line2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 0 rgba(29,138,95,.5);animation:ping 2.2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(29,138,95,.45)}80%,100%{box-shadow:0 0 0 8px rgba(29,138,95,0)}}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;font-size:.92rem;border-radius:999px;padding:11px 20px;border:0;background:var(--ink);color:var(--on-ink);cursor:pointer;box-shadow:0 6px 18px rgba(30,37,88,.22);transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{background:var(--ink-hover);transform:translateY(-1px);box-shadow:0 10px 24px rgba(30,37,88,.28)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:none;border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn.sm{padding:7px 14px;font-size:.84rem}
.btn svg{width:17px;height:17px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
label{display:grid;gap:6px;font-weight:700;font-size:.88rem}
input,select,textarea{font:inherit;font-weight:500;color:var(--fg);background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:11px 14px;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--sky);outline:none;box-shadow:0 0 0 4px rgba(75,107,214,.12)}
textarea{min-height:120px;resize:vertical}
.form{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.hint{font-size:.8rem;color:var(--muted);font-weight:500}
pre.fmt{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px;font-family:var(--f-mono);font-size:.78rem;overflow-x:auto;margin:0;color:var(--muted)}
.seg{display:inline-flex;gap:2px;flex-wrap:wrap;padding:4px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);justify-self:start}
.seg button{font:inherit;font-weight:600;font-size:.88rem;padding:8px 16px;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* hero */
.hero{padding:clamp(22px,4vw,36px);display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center;position:relative;overflow:hidden;background:var(--hero-bg);box-shadow:var(--shadow-lg)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 90% at 100% 0%,rgba(75,107,214,.08),transparent 60%),radial-gradient(50% 80% at 0% 100%,rgba(168,130,58,.07),transparent 60%)}
.hero>*{position:relative}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero h2{font-size:clamp(2rem,6vw,3.1rem);line-height:1.02}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:760px){.stats{justify-content:flex-start}}
.ring{position:relative;width:108px;height:108px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring .lbl b{font-family:var(--f-display);font-size:2rem;font-weight:400}
.ring .lbl span{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.statbox{display:grid;gap:0;padding:12px 18px;min-width:118px;box-shadow:none;background:var(--surface)}
.statbox b{font-family:var(--f-display);font-size:1.9rem;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.1}
.statbox span{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.flame{color:var(--gold)}
.bar{height:6px;border-radius:4px;background:var(--ink-soft);overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--grad);border-radius:4px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.gold i{background:linear-gradient(90deg,#C9A45C,var(--gold))}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:16px 18px;display:grid;gap:2px;box-shadow:none;background:var(--surface)}
.kpi b{font-family:var(--f-display);font-weight:400;font-size:2.1rem;font-variant-numeric:tabular-nums;line-height:1.05}
.kpi b small{font-size:.55em}
.kpi span{font-size:.66rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:700}

/* tables */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem;min-width:640px}
th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface2)}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface2)}
td.num,.num{font-variant-numeric:tabular-nums}
.mini{height:5px;border-radius:3px;background:var(--ink-soft);overflow:hidden;width:70px}
.mini i{display:block;height:100%;background:var(--grad)}

/* feed */
.feed{display:grid;gap:2px;padding:8px}
.feed .it{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px}
.feed .it:hover{background:var(--surface2)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;color:#1E2558;flex:none;letter-spacing:.02em}
.feed .txt{min-width:0;flex:1}
.feed .txt b{display:block}
.feed .txt span{display:block;color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* leaderboard */
.lb{display:grid;gap:4px;padding:10px}
.lb .it{display:grid;grid-template-columns:30px 36px 1fr auto;gap:12px;align-items:center;padding:9px 12px;border-radius:14px}
.lb .it.me{background:var(--ink-soft)}
.lb .rank{font-family:var(--f-display);font-size:1.3rem;text-align:center;color:var(--muted)}
.lb .it:nth-child(1) .rank{color:var(--gold)} .lb .it:nth-child(2) .rank{color:#8A90A8} .lb .it:nth-child(3) .rank{color:#A86B45}
.lb .mono{color:var(--ink)!important;font-family:var(--f-body);font-weight:700}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.badge{padding:20px 12px;text-align:center;display:grid;gap:8px;justify-items:center}
.badge .medal{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 6px var(--surface),0 0 0 7px var(--line)}
.badge .medal svg{width:26px;height:26px}
.badge:not(.locked) .medal{background:linear-gradient(145deg,#E9D3A2,#B08A3E);color:#fff;box-shadow:0 0 0 6px var(--gold-soft),0 8px 20px rgba(168,130,58,.35)}
.badge b{font-size:.84rem;line-height:1.2}
.badge span{font-size:.72rem;color:var(--muted);line-height:1.35}
.badge.locked .medal{background:var(--surface2)!important;color:var(--line2)}
.badge.locked b{color:var(--muted)}

/* lesson */
.lesson-body{max-width:64ch;font-size:1.08rem;line-height:1.8}
.lesson-body p{margin:0 0 1em}
.lesson-body strong{color:var(--ink);cursor:pointer;background:linear-gradient(transparent 62%,var(--gold-soft) 62%);padding:0 2px}
.lesson-body strong:hover{background:linear-gradient(transparent 62%,var(--line2) 62%)}

/* quiz */
.quiz{max-width:640px;margin:0 auto;display:grid;gap:16px}
.qtext{font-family:var(--f-display);font-size:clamp(1.6rem,5vw,2.2rem);line-height:1.15;text-wrap:balance}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:1.05rem;font-weight:600;background:var(--surface);border:1px solid var(--line2);border-radius:18px;padding:15px 16px;cursor:pointer;color:var(--fg);box-shadow:var(--shadow);transition:transform .2s,border-color .2s,background .2s}
.choice .k{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);font-size:.8rem;font-weight:700;flex:none;color:var(--muted)}
.choice .k svg{width:16px;height:16px}
.choice:hover:not(:disabled){border-color:var(--ink);transform:translateY(-1px)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .k{background:var(--ok);color:#fff;border-color:transparent}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.choice.wrong .k{background:var(--bad);color:#fff;border-color:transparent}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.combo{color:var(--gold);font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;gap:4px}
.score{font-family:var(--f-display);font-size:clamp(4rem,14vw,6rem);line-height:1}

/* flashcards 3D */
.deck-stage{perspective:1400px;max-width:440px;margin:0 auto;width:100%}
.flash{position:relative;height:290px;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.flash.flipped{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;display:grid;place-items:center;align-content:center;gap:10px;padding:26px;text-align:center;border:1px solid var(--line)}
.flash .front{background:var(--flash-front);box-shadow:var(--shadow-lg)}
.flash .back{background:linear-gradient(160deg,#1E2558,#33408F);color:#fff;transform:rotateY(180deg);box-shadow:var(--shadow-lg);border-color:transparent}
.flash .back .eyebrow{color:#C9D0F5}
.flash .word{font-family:var(--f-display);font-size:clamp(2.2rem,8vw,3rem);line-height:1.05}
.flash .ex{font-style:italic;opacity:.8;max-width:32ch}

/* misc */
.note{background:var(--gold-soft);border:1px solid #EADBB8;border-radius:var(--r);padding:16px 18px}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:28px;color:var(--muted);text-align:center;background:var(--empty-bg)}
.feedback{border-left:3px solid var(--gold);padding:12px 16px;background:var(--surface);border-radius:0 14px 14px 0;box-shadow:var(--shadow)}
.ann{padding:18px 20px;display:flex;gap:14px;align-items:flex-start}
.ann .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--rose-soft);color:var(--rose);flex:none}
.ann .ic svg{width:20px;height:20px}
.back{display:inline-flex;align-items:center;gap:6px;font:inherit;background:none;border:0;color:var(--ink);font-weight:700;cursor:pointer;padding:0}
.toggle{position:relative;width:52px;height:30px;border-radius:999px;background:var(--line2);border:0;cursor:pointer;flex:none;transition:background .25s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s}
.toggle[aria-checked="true"]{background:var(--ink)}
.toggle[aria-checked="true"]::after{transform:translateX(22px)}
.toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--on-ink);padding:12px 18px;border-radius:999px;font-weight:600;z-index:80;max-width:calc(100% - 32px);box-shadow:0 14px 40px rgba(20,24,60,.3)}
.toast .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.15);flex:none}
.toast .ic svg{width:14px;height:14px}
.xpfloat{position:fixed;z-index:75;pointer-events:none;font-family:var(--f-display);font-style:italic;color:var(--gold);font-size:1.6rem}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media (prefers-reduced-motion:no-preference){
  .enter>*{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  .enter>*:nth-child(2){animation-delay:.07s}.enter>*:nth-child(3){animation-delay:.14s}.enter>*:nth-child(4){animation-delay:.21s}.enter>*:nth-child(5){animation-delay:.28s}
  .xpfloat{animation:floatup 1.2s ease-out forwards}
}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}
@media (prefers-reduced-motion:reduce){.flash{transition:none}.dot.on{animation:none}}

/* splash */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);transition:opacity .7s,visibility .7s}
#splash.out{opacity:0;visibility:hidden}
#splash .in{display:grid;justify-items:center;gap:18px;text-align:center;padding:16px}
#splash .big{width:84px;height:84px;border-radius:26px;background:var(--grad);display:grid;place-items:center;font-family:var(--f-display);font-style:italic;font-size:2.2rem;color:#fff;box-shadow:0 20px 50px rgba(30,37,88,.3)}
#splash h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,6vw,2.8rem);margin:0}
#splash .load{width:140px;height:2px;border-radius:2px;background:var(--line);overflow:hidden}
#splash .load i{display:block;height:100%;width:40%;background:var(--ink);border-radius:2px}
@media (prefers-reduced-motion:no-preference){#splash .big{animation:pop 1s cubic-bezier(.2,.8,.2,1) both}#splash h1{animation:rise 1s .15s both}#splash .load i{animation:slide 1.2s ease-in-out infinite}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes slide{from{transform:translateX(-110%)}to{transform:translateX(260%)}}

/* hero accent */
.hero.glow-border{border-color:var(--line)}

/* mascot */
.mascot-wrap{display:grid;justify-items:center;gap:6px}
#mascotSlot{width:150px;height:150px;flex:none;position:relative}
#mascotSlot canvas{width:100%;height:100%;display:block}
#mascotSlot::after{content:"";position:absolute;left:22%;right:22%;bottom:4%;height:10%;border-radius:50%;background:radial-gradient(closest-side,rgba(30,37,88,.18),transparent);pointer-events:none}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:.84rem;max-width:220px;text-align:center;box-shadow:var(--shadow);font-style:italic;color:var(--muted)}
.hero-side{display:flex;align-items:center;gap:16px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:760px){.hero-side{justify-content:flex-start}#mascotSlot{width:120px;height:120px}}

/* word of the day */
.wotd{padding:24px;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center}
@media (max-width:620px){.wotd{grid-template-columns:1fr}}
.wotd .w{font-family:var(--f-display);font-size:clamp(2rem,6vw,2.6rem);line-height:1.05}
.wotd .medal{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#E9D3A2,#B08A3E);color:#fff;box-shadow:0 0 0 6px var(--gold-soft)}
.wotd .medal svg{width:26px;height:26px}

/* typed answers & listening */
.answer-input{font-size:1.25rem;padding:16px;border-radius:18px;text-align:center;font-family:var(--f-display)}
.answer-input.right{border-color:var(--ok);background:var(--ok-soft)}
.answer-input.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.bigplay{width:112px;height:112px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:grid;place-items:center;cursor:pointer;margin:0 auto;box-shadow:0 16px 40px rgba(30,37,88,.3)}
.bigplay svg{width:42px;height:42px}
@media (prefers-reduced-motion:no-preference){.bigplay{animation:pulse 2.4s infinite}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(30,37,88,.25),0 16px 40px rgba(30,37,88,.3)}70%,100%{box-shadow:0 0 0 20px rgba(30,37,88,0),0 16px 40px rgba(30,37,88,.3)}}
.modes{display:flex;gap:8px;flex-wrap:wrap}

/* celebration modal */
#celebrate{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:var(--overlay);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#celebrate .box{max-width:380px;width:100%;padding:36px 26px;text-align:center;display:grid;gap:14px;justify-items:center;background:var(--surface);box-shadow:0 30px 80px rgba(20,24,60,.25)}
#celebrate .medal3d{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#EBD7A8,#A8823A)!important;color:#fff!important;box-shadow:0 0 0 8px var(--gold-soft),0 18px 40px rgba(168,130,58,.4)}
#celebrate .medal3d svg{width:46px;height:46px}
@media (prefers-reduced-motion:no-preference){#celebrate .medal3d{animation:medal 1.3s cubic-bezier(.2,.8,.2,1) both}#celebrate .box{animation:rise .5s both}}
@keyframes medal{0%{transform:perspective(600px) rotateY(0) scale(.4)}70%{transform:perspective(600px) rotateY(540deg) scale(1.05)}100%{transform:perspective(600px) rotateY(720deg) scale(1)}}

/* chat */
.chat{display:grid;grid-template-rows:1fr auto;height:min(62vh,580px);overflow:hidden}
.msgs{overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;background:var(--surface2)}
.msg{max-width:78%;align-self:flex-start;background:var(--surface);border:1px solid var(--line);padding:10px 14px;border-radius:20px 20px 20px 6px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:var(--shadow)}
.msg.mine{align-self:flex-end;background:var(--ink);color:var(--on-ink);border-color:transparent;border-radius:20px 20px 6px 20px}
.msg span{display:block;font-size:.7rem;opacity:.6;margin-top:4px}
.chatbar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--surface)}
.chatbar input{flex:1}
.unread{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--rose);border:2px solid var(--bg)}
.thread{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;cursor:pointer}
.thread:hover{background:var(--surface2)}
.thread .txt{flex:1;min-width:0}.thread .txt span{display:block;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* exam */
.timer{font-weight:700;padding:6px 14px;border-radius:999px;background:var(--rose-soft);color:var(--rose);display:inline-flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.timer.low{background:var(--rose);color:#fff}
.editbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:var(--gold-soft);border:1px solid #EADBB8}
.check{display:flex;align-items:center;gap:10px;font-weight:700}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.role{display:grid;gap:8px;justify-items:start;text-align:left;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s,border-color .25s}
.role:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--ink)}
.role .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.role .ic svg{width:22px;height:22px}
.role b{font-size:1.02rem}.role span{font-size:.82rem;color:var(--muted);line-height:1.4}
.who{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.who img{width:34px;height:34px;border-radius:50%}
.filebtn{display:inline-flex!important;cursor:pointer}
.scanbox{display:grid;gap:12px;padding:14px;border:1px dashed var(--line2);border-radius:18px;background:var(--surface2)}
.scanprev{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.scanprev{grid-template-columns:1fr}}
.scanprev figure{margin:0;position:relative;display:grid;gap:6px;min-width:0}
.scanprev img{width:100%;max-height:340px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:12px}
.scanprev figcaption{font-size:.76rem;color:var(--muted);font-weight:600}
.scanbusy{position:absolute;inset:0 0 22px 0;display:grid;place-items:center;background:var(--glass-bg);border-radius:12px;font-weight:700;color:var(--ink)}
.scanimg{display:block;max-width:100%}
.scanimg img{width:100%;max-width:760px;border-radius:14px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
/* AI assistant */
#aiFab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;align-items:center;gap:10px;padding:10px 18px 10px 10px;border-radius:999px;border:0;background:var(--ink);color:var(--on-ink);font:inherit;font-weight:700;cursor:pointer;box-shadow:0 14px 34px rgba(30,37,88,.35)}
#aiFab .orb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#EBD7A8,#A8823A)}
#aiFab .orb svg{width:19px;height:19px}
@media (max-width:760px){#aiFab{bottom:calc(84px + env(safe-area-inset-bottom,0px));right:12px;padding:8px}#aiFab span.lbl{display:none}}
@media (prefers-reduced-motion:no-preference){#aiFab .orb{animation:pulse 3s infinite}}
#aiPanel{position:fixed;z-index:60;right:16px;top:calc(16px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 32px));display:grid;grid-template-rows:auto 1fr auto;background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:0 30px 80px rgba(20,24,60,.28);overflow:hidden}
@media (max-width:760px){#aiPanel{inset:0;width:auto;border-radius:0;top:env(safe-area-inset-top,0px);bottom:0}}
@media (prefers-reduced-motion:no-preference){#aiPanel:not([hidden]){animation:rise .35s cubic-bezier(.2,.8,.2,1)}}
.ai-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface2)}
.ai-head .orb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#fff;flex:none}
.ai-head h3{font-family:var(--f-display);font-weight:400;font-size:1.35rem}
.ai-msgs{overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px;background:var(--surface2)}
.ai-b{max-width:88%;padding:11px 14px;border-radius:20px;line-height:1.55;overflow-wrap:anywhere}
.ai-b.u{align-self:flex-end;background:var(--ink);color:var(--on-ink);border-radius:20px 20px 6px 20px;white-space:pre-wrap}
.ai-b.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:20px 20px 20px 6px;box-shadow:var(--shadow)}
.ai-b.a p{margin:0 0 .6em}.ai-b.a p:last-child{margin:0}.ai-b.a ul{margin:.2em 0 .6em;padding-left:1.2em}
.ai-b img{max-width:180px;border-radius:12px;display:block;margin-bottom:6px}
.ai-tools{display:flex;gap:4px;margin-top:6px}
.ai-tools button{font:inherit;font-size:.74rem;font-weight:700;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer}
.ai-tools button:hover{color:var(--ink);border-color:var(--ink)}
.ai-err{font-size:.8rem;color:var(--bad);margin-top:6px}
.ai-think{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:.85rem}
.ai-think i{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.4}
@media (prefers-reduced-motion:no-preference){.ai-think i{animation:blink 1.2s infinite}.ai-think i:nth-child(2){animation-delay:.2s}.ai-think i:nth-child(3){animation-delay:.4s}}
@keyframes blink{50%{opacity:1}}
.ai-sugg{display:grid;gap:8px}
.ai-sugg button{text-align:left;font:inherit;font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;color:var(--fg)}
.ai-sugg button:hover{border-color:var(--ink)}
.ai-comp{display:grid;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--surface)}
.ai-comp .row{flex-wrap:nowrap}
.ai-comp textarea{min-height:46px;max-height:140px;resize:none;border-radius:16px;padding:11px 14px}
.ai-attach{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.ai-attach img{width:40px;height:40px;object-fit:cover;border-radius:8px}
.unum{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ink-soft);color:var(--ink);font-weight:800;font-size:.85rem;flex:none}
.unum.done{background:var(--ok);color:#fff}.unum svg{width:16px;height:16px}
.it.unit:hover{background:var(--surface2)}
.steps{display:flex;gap:6px}.steps i{height:4px;flex:1;border-radius:2px;background:var(--line)}.steps i.on{background:var(--ink)}
.check input{width:20px;height:20px;accent-color:var(--ink)}
.list{display:grid;gap:2px;padding:8px}
.list .it{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;flex-wrap:wrap}
.list .it .txt{flex:1;min-width:140px}

/* teacher chart */
.chart{padding:18px 18px 8px;overflow-x:auto}
.chart svg{width:100%;min-width:520px;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);padding:0 18px 16px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

:root[data-skin="nuit"] .flame{text-shadow:0 0 14px rgba(227,193,115,.45)}
:root[data-skin="nuit"] #splash{background:radial-gradient(120% 80% at 50% -10%,#1A2150 0%,#0E1120 50%,#090B16 100%)}

function addToday(arr){const t=today(),a=Array.isArray(arr)?arr:[];return a.includes(t)?null:[...a,t].slice(-120)}
function activeSet(s){const set=new Set(s.activeDays||[]);for(const a of s.attempts||[])if(a.at)set.add(dayStr(new Date(a.at)));for(const v of Object.values(s.submissions||{}))if(v&&v.at)set.add(dayStr(new Date(v.at)));if(s.lastDay)set.add(s.lastDay);if(s.lastActive)set.add(dayStr(new Date(s.lastActive)));return set}
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return dayStr(d)};
const liveStreak=s=>s.lastDay===today()||s.lastDay===yesterday()||(s.lastDay===daysAgo(2)&&(s.freezes||0)>0)?(s.streak||0):0;
function daysActive(s,n){const set=activeSet(s);let c=0;for(let i=0;i<n;i++){const d=new Date();d.setDate(d.getDate()-i);if(set.has(dayStr(d)))c++}return c}
function stripHTML(s,n=30){const set=activeSet(s);let h="";for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dayStr(d);h+=`<i class="${set.has(k)?"on":""}" title="${k}"></i>`}return`<span class="strip" role="img" aria-label="${daysActive(s,n)} active days out of ${n}">${h}</span>`}
function heatHTML(s,weeks=12){const set=activeSet(s),t=new Date();t.setHours(12,0,0,0);const st=new Date(t);st.setDate(t.getDate()-((t.getDay()+6)%7)-(weeks-1)*7);let h="";
  for(const d=new Date(st);d<=t||((d.getDay()+6)%7)!==0;d.setDate(d.getDate()+1)){const k=dayStr(d),fut=d>t;h+=`<i class="${!fut&&set.has(k)?"on":""}${k===today()?" today":""}"${fut?' style="visibility:hidden"':""} title="${k}"></i>`}
  return`<div class="heat" role="img" aria-label="Activity over the last ${weeks} weeks">${h}</div><div class="row small muted" style="gap:6px"><span>Mon → Sun, top to bottom</span><span class="strip"><i></i></span>rest<span class="strip"><i class="on"></i></span>active day</div>`}
function regularityCard(s,title){const live=liveStreak(s),best=Math.max(s.bestStreak||0,live),d30=daysActive(s,30),d7=daysActive(s,7);
  return`<div class="section"><div><span class="eyebrow">Consistency</span><h2>${title}</h2></div><div class="kpis"><div class="glass kpi"><b class="flame">${live}</b><span>Current streak</span></div><div class="glass kpi"><b>${best}</b><span>Best streak</span></div><div class="glass kpi"><b>${d7}/7</b><span>Active days (7 d)</span></div><div class="glass kpi"><b>${pct(d30,30)}<small> %</small></b><span>Consistency (30 d)</span></div></div><div class="glass card">${heatHTML(s)}</div></div>`}
function regularityHTML(st){if(!st.length)return"";const rows=st.map(s=>({s,live:liveStreak(s),d30:daysActive(s,30),best:Math.max(s.bestStreak||0,liveStreak(s))})).sort((a,b)=>b.live-a.live||b.d30-a.d30||(b.s.lastActive||0)-(a.s.lastActive||0));
  const top=rows.filter(r=>r.live>0||r.d30>0).slice(0,3),idle=rows.filter(r=>!r.s.lastActive||Date.now()-r.s.lastActive>3*864e5).sort((a,b)=>(a.s.lastActive||0)-(b.s.lastActive||0)),avg=Math.round(rows.reduce((n,r)=>n+r.d30,0)/rows.length/30*100);
  return`<div class="section"><div class="head"><div><span class="eyebrow">Consistency</span><h2>Class consistency</h2><p class="sub">The flame counts the days in a row the student has worked. The bars show their last 30 days (green = active day). A regular student makes faster progress.</p></div><span class="chip ok">Average consistency: ${avg}%</span></div>
  ${top.length?`<div class="podium">${top.map((r,i)=>`<div class="glass p r${i+1}" data-a="openStudent" data-id="${r.s.id}" tabindex="0" style="cursor:pointer">${avatar(r.s.id,r.s.name,48)}<span class="eyebrow">${i===0?"1st place":i===1?"2nd place":"3rd place"}</span><b>${esc(r.s.name)}</b><span class="fl">${ic("flame")} ${r.live}</span><span class="small muted">${r.live>1?"days in a row":"day in a row"} · ${r.d30}/30 active days</span></div>`).join("")}</div>`:""}
  <div class="glass tablewrap"><table><thead><tr><th>Student</th><th>Streak</th><th>Best</th><th>Last 30 days</th><th>Active days</th><th>Last activity</th></tr></thead><tbody>${rows.map(r=>`<tr class="click" data-a="openStudent" data-id="${r.s.id}"><td><div class="row" style="flex-wrap:nowrap">${avatar(r.s.id,r.s.name)}<b>${esc(r.s.name)}</b></div></td><td class="num">${r.live?`<span class="flame">${ic("flame")} ${r.live}</span>`:"—"}</td><td class="num">${r.best||"—"}</td><td>${stripHTML(r.s)}</td><td class="num">${r.d30}/30</td><td class="small muted">${ago(r.s.lastActive)}</td></tr>`).join("")}</tbody></table></div>
  ${idle.length?`<div class="glass card" style="border-color:var(--rose-soft)"><b class="row">${ic("clock")} Follow up: ${idle.length} student${idle.length>1?"s":""} with no activity for 3 days or more</b><div class="list" style="padding:0">${idle.slice(0,10).map(r=>`<div class="it">${avatar(r.s.id,r.s.name)}<div class="txt"><b>${esc(r.s.name)}</b><div class="small muted">Last activity: ${ago(r.s.lastActive)}</div></div><button class="btn ghost sm" data-a="openChat" data-id="${r.s.id}">${ic("chat")}Encourage</button></div>`).join("")}</div></div>`:""}</div>`}
function gain(xp,activity,extra={},anchor){
  if(!S.me||S.mode!=="student")return;
  const me=S.me,t=today();let streak=me.streak||0,dayXp=me.lastDay===t?(me.dayXp||0):0;
  let usedFreeze=false;if(me.lastDay!==t){if(me.lastDay===yesterday())streak++;else if(me.lastDay===daysAgo(2)&&(me.freezes||0)>0){streak++;usedFreeze=true}else streak=1}
  const xpTotal=(me.xp||0)+xp;dayXp+=xp;
  const merged=deepMerge(me,{...extra,xp:xpTotal,streak});
  const newB={};for(const b of BADGES)if(!(me.badges||{})[b.id]&&b.test(merged))newB[b.id]=Date.now();
  const payload={...extra,...(usedFreeze?{freezes:(me.freezes||0)-1,freezeUsed:yesterday()}:{}),xp:xpTotal,streak,bestStreak:Math.max(me.bestStreak||0,streak),lastDay:t,dayXp,lastActive:Date.now(),activity};const ad=addToday(me.activeDays);if(ad)payload.activeDays=ad;
  if(Object.keys(newB).length)payload.badges=newB;
  const wasGoal=me.lastDay===t&&(me.dayXp||0)>=DAILY_GOAL, rankUp=rankOf(xpTotal)>rankOf(me.xp);
  write(()=>meRef().update(payload));
  if(!S.isOwner&&!S.isStaff)write(()=>S.db.doc("board/"+S.uid).set({...boardEntry(me),xp:xpTotal,streak}));
  presence(activity);
  if(xp>0)xpFloat(xp,anchor);
  const bs=Object.keys(newB);
  if(bs.length){const b=BADGES.find(x=>x.id===bs[0]);setTimeout(()=>celebrate("Badge “"+b.name+"”",b.desc+": badge unlocked!",b.icon,b.tone),700)}
  else if(rankUp){setTimeout(()=>celebrate("Rank "+rankOf(xpTotal)+"!","You moved up a rank. Keep it up!","rocket","t-grad"),700)}
  else if(!wasGoal&&dayXp>=DAILY_GOAL){setTimeout(()=>celebrate("Goal reached","You earned "+DAILY_GOAL+" XP today. Come back tomorrow to keep your streak!","target","t-ok"),700)}
}
function touch(activity,extra={}){if(!S.me||S.mode!=="student")return;const ad=addToday(S.me.activeDays);write(()=>meRef().update({...extra,...(ad?{activeDays:ad}:{}),lastActive:Date.now(),activity}));presence(activity)}

  if(!db){S.offline=true;render();return}
  S.uid=user?await user.id():null;S.who=user?await user.me():null;S.isOwner=user?await user.isOwner():false;S.canEdit=user?await user.canEdit():false;S.mode=S.isOwner?"teacher":"student";S.animate=true;
  let teacherOn=false;const startTeacher=()=>{if(teacherOn)return;teacherOn=true;
    db.collection("students").onSnapshot(s=>{S.allPeople=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>!x.preview);applyScope();syncParents();render()},e=>console.warn(e));

    db.collection("access").onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.access=m;applyScope();render()},e=>console.warn(e));
    db.doc("live/"+S.uid).onSnapshot(d=>{S.liveT=d.exists?d.data():null;render()},e=>console.warn(e));
    db.collection("parents").onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.plinks=m;syncParents();render()},e=>console.warn(e));
    db.doc("gradebook/"+S.uid).onSnapshot(d=>{S.gb=d.exists?d.data():{};render()},e=>{console.warn(e);S.gb={}});
    db.collection("attendance").orderBy("date","desc").limit(500).onSnapshot(q=>{S.att=q.docs.map(d=>({id:d.id,...d.data()})).filter(d=>d.tid===S.uid);render()},e=>console.warn(e));claude.use("assets").then(a=>{S.assets=a;render()})};
  db.collection("staff").onSnapshot(q=>{S.staff=q.docs.map(d=>({id:d.id,...d.data()}));const first=!S.staffLoaded;S.staffLoaded=true;
    if(S.isOwner&&first&&S.uid&&!S.staff.some(d=>d.id===S.uid))write(()=>db.doc("staff/"+S.uid).set({name:S.who?.name||"Head teacher",role:"principal",at:Date.now()}));
    if(!S.isOwner){const was=S.isStaff;S.isStaff=S.staff.some(d=>d.id===S.uid&&d.role==="teacher");if(S.isStaff&&!was){S.mode="teacher";S.tab=null;S.view=null;S.animate=true;startTeacher()}if(!S.isStaff&&was){S.mode="student";S.tab=null;S.view=null}}
    applyScope();render()},e=>console.warn(e));
  if(S.isOwner){startTeacher();db.collection("staffRequests").onSnapshot(q=>{S.reqs=q.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.warn(e))}
  else if(S.uid)db.doc("staffRequests/"+S.uid).onSnapshot(d=>{S.myReq=d.exists?d.data():null;render()},e=>console.warn(e));
  const sub=(col,key)=>db.collection(col).orderBy("createdAt","desc").onSnapshot(s=>{S[key]=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.warn(col,e));
  sub("lessons","lessons");sub("pictures","pictures");sub("rewards","rewards");sub("quizzes","quizzes");sub("homework","homework");sub("decks","decks");sub("announcements","anns");sub("epreuves","eps");
  let unBoard=null;
  db.doc("settings/main").onSnapshot(s=>{S.settings={leaderboard:false,...(s.exists?s.data():{})};
    if(S.settings.leaderboard&&!unBoard&&!S.isOwner)unBoard=db.collection("board").orderBy("xp","desc").limit(50).onSnapshot(q=>{S.board=q.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.warn(e));
    if(!S.settings.leaderboard&&unBoard){unBoard();unBoard=null;S.board=[]}render()},e=>console.warn(e));
  if(S.uid&&!S.isOwner)db.doc("parents/"+S.uid).onSnapshot(d=>{S.plink=d.exists?d.data():null;if(isParent(S.me))render()},()=>{});
  if(S.uid)db.doc("access/"+S.uid).onSnapshot(d=>{S.myAccess=d.exists?d.data():null;if(S.me&&stOf(S.me)==="active")recordDevice();render()},e=>console.warn(e));
  if(S.uid)meRef().onSnapshot(s=>{S.me=s.exists?{id:s.id,...s.data()}:null;notifRefresh();S.meLoaded=true;liveSub();if(S.me&&stOf(S.me)==="active")recordDevice();render()},()=>{S.meLoaded=true;render()});else S.meLoaded=true;
  claude.use("downloads").then(d=>{S.dl=d;render()});
  aiInit();
  claude.use("room").then(room=>{if(!room)return;S.room=room;
    room.onPeers(list=>{const p={},cnt={};for(const x of list||[]){const st=x.state||x.presence||x;if(st&&st.uid){p[st.uid]={doing:String(st.doing||"")};cnt[st.uid]=(cnt[st.uid]||0)+1}}const sig=JSON.stringify([p,cnt]);if(sig===S._peerSig)return;S._peerSig=sig;S.peers=p;S.peerCount=cnt;if(S.mode==="teacher"&&!S.view)render()});
    if(S.uid&&!S.isOwner)room.presence({uid:S.uid,doing:"Online"})});

})();

function homeView(){const m=S.me,xp=m.xp||0,rank=rankOf(xp),into=xp%XP_PER_RANK,t=today();
  const streak=liveStreak(m),dayXp=m.lastDay===t?(m.dayXp||0):0;

  const sq=S.decks.length?srsQueue():{due:[],fresh:[]},sn=Math.min(SRS_MAX,sq.due.length+sq.fresh.length);

    {a:"startPic",id:"mix",icon:"camera",tone:"t-coral",eb:"Picture game · +10 XP / answer",t:"Guess the pictures: objects, actions, jobs…",lvl:S.me.level},

    nextDeck&&{a:"startDeck",id:nextDeck.id,icon:"cards",tone:"t-gold",eb:"Vocabulary · +5 XP / word",t:nextDeck.title,lvl:nextDeck.level},

    <p class="sub">Level ${esc(m.level)} · ${LEVEL_NAMES[m.level]||""}${m.profile?" · "+esc(PROFILES[m.profile])+(m.classe?" ("+esc(CL(m.classe))+")":""):""}. ${dayXp>=DAILY_GOAL?"Daily goal reached, well done!":`${DAILY_GOAL-dayXp} more XP to reach your daily goal.`}</p>
    <div style="max-width:340px;display:grid;gap:6px"><div class="row between small"><span class="muted">Daily goal</span><span class="mono">${Math.min(dayXp,DAILY_GOAL)}/${DAILY_GOAL} XP</span></div><div class="bar gold"><i style="width:${Math.min(100,pct(dayXp,DAILY_GOAL))}%"></i></div></div></div>
    <div class="hero-side">${mascotHTML(TIPS_STUDENT)}<div class="stats"><div class="ring">${ringSVG(into/XP_PER_RANK)}<div class="lbl"><div><span>Rank</span><br><b>${rank}</b></div></div></div>

  <div class="section"><div class="head"><div><span class="eyebrow">For you today</span><h2>Keep making progress</h2></div></div>
  ${sugg.length?`<div class="grid sugg-grid">${sugg.map(s=>`<div class="glass card click tilt" tabindex="0" data-a="${s.a}" data-id="${s.id}"><span class="glow ${s.tone}"></span><span class="ic ${s.tone}">${ic(s.icon)}</span><span class="eyebrow">${esc(s.eb)}</span><h3>${esc(s.t)}</h3><div class="row">${lvlChip(s.lvl)}</div></div>`).join("")}</div>`:`<div class="empty">You have finished everything! Your teacher will add new activities soon.</div>`}</div>

function mistakesPool(){const pool=[],seenQ=new Set();for(const a of [...(S.me?.attempts||[])].reverse()){if(a.quizId==="revision")continue;

const SRS_INT=[0,1,3,7,14,30],SRS_NEW=10,SRS_MAX=30;
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return dayStr(d)}
function srsQueue(){const m=S.me||{},srs=m.srs||{},t=today(),decks=S.decks.filter(visible),byId=Object.fromEntries(decks.map(d=>[d.id,d]));
  const due=Object.entries(srs).filter(([k,v])=>{const[id,i]=k.split(":");return byId[id]?.cards?.[+i]&&String(v.due||"")<=t}).sort((a,b)=>String(a[1].due).localeCompare(String(b[1].due))||(a[1].box||0)-(b[1].box||0)).map(([k])=>k);
  let room=Math.max(0,SRS_NEW-(m.srsNewDay===t?(m.srsNew||0):0));const fresh=[];
  for(const d of byLevel(decks)){if(!room)break;const kn=new Set(knownOf(d));(d.cards||[]).forEach((c,i)=>{const k=d.id+":"+i;if(room&&!srs[k]&&!kn.has(i)){fresh.push(k);room--}})}
  const anch=Object.values(srs).filter(v=>(v.box||0)>=3).length;
  return{due,fresh,anch,total:Object.keys(srs).length}}
function srsCard(k){const[id,i]=k.split(":");const d=S.decks.find(x=>x.id===id);return d&&d.cards?.[+i]?{d,c:d.cards[+i],i:+i}:null}
function srsHTML(compact){if(!S.me||!S.decks.length)return"";const q=srsQueue(),n=Math.min(SRS_MAX,q.due.length+q.fresh.length);
  return`<div class="section"><div class="glass card srs-card" style="border-color:var(--gold-soft,#EADBB8)"><div class="row between"><div class="row"><span class="ic t-gold">${ic("brain")}</span><div><span class="eyebrow">Long-term memory</span><h3 style="margin:0">Today's review</h3></div></div>${n?`<span class="chip warn">${n} card${n>1?"s":""}</span>`:`<span class="chip ok">${ic("check")}Up to date</span>`}</div>
  ${compact?"":`<p class="muted small" style="margin:0">Words come back just before you forget them: tomorrow, then in 3 days, 7 days, 14 days and 30 days. A forgotten word goes back to the start. A few minutes a day is enough.</p>`}
  <div class="kpis srs-k"><div class="kpi"><b>${q.due.length}</b><span>To review</span></div><div class="kpi"><b>${q.fresh.length}</b><span>New words</span></div><div class="kpi"><b>${q.anch}</b><span>Words locked in</span></div></div>
  <div>${n?`<button class="btn" data-a="startSrs">${ic("brain")}Start reviewing</button>`:`<span class="muted small">Everything is reviewed for today. Come back tomorrow!</span>`}</div></div></div>`}
function startSrs(){const q=srsQueue();const items=shuffle([...q.due.slice(0,SRS_MAX)]).concat(q.fresh).slice(0,SRS_MAX);if(!items.length){toast("Nothing to review today. Come back tomorrow!");return}
  S.srs={items,i:0,flipped:false,res:{},fresh:new Set(q.fresh),done:false};S.animate=true;scrollTo(0,0);touch("Spaced vocabulary review");const f=srsCard(items[0]);if(f&&canSpeak)setTimeout(()=>say(f.c.en),300)}
function finishSrs(){const st=S.srs,m=S.me,t=today(),srs={...(m.srs||{})},dp={};let ok=0,nNew=0;
  for(const[k,r]of Object.entries(st.res)){const cur=srs[k]||{box:0};const box=r?Math.min((cur.box||0)+1,5):1;srs[k]={box,due:addDays(r?SRS_INT[box]:1)};if(r)ok++;if(st.fresh.has(k))nNew++;
    if(r&&box>=1){const[id,i]=k.split(":");(dp[id]=dp[id]||[]).push(+i)}}
  const deckProgress={};for(const[id,arr]of Object.entries(dp)){const d=S.decks.find(x=>x.id===id);if(d)deckProgress[id]={known:[...new Set([...knownOf(d),...arr])]}}
  st.ok=ok;st.gained=ok*3;st.done=true;
  gain(st.gained,`Spaced review: ${ok}/${Object.keys(st.res).length} words remembered`,{srs,srsNewDay:t,srsNew:(m.srsNewDay===t?(m.srsNew||0):0)+nNew,...(Object.keys(deckProgress).length?{deckProgress}:{})});
  if(ok){beep("win");if(!LITE)confetti()}}
function srsRunView(){const st=S.srs;
  if(st.done){const tot=Object.keys(st.res).length;return`<div class="quiz"><div class="glass card" style="padding:32px;text-align:center;justify-items:center;gap:14px"><span class="ic t-gold" style="width:60px;height:60px">${ic("brain")}</span><h2>Review finished!</h2><p class="sub">${st.ok} of ${tot} word(s) remembered. ${st.gained?`+${st.gained} XP.`:""} Words you remembered will come back later, the others tomorrow.</p><button class="btn" data-a="endSrs">Finish</button></div></div>`}

  ${st.flipped?`<div class="two"><button class="btn ghost" data-a="srsAns" data-k="0">${ic("refresh")}Review again</button><button class="btn" data-a="srsAns" data-k="1">${ic("check")}I knew it</button></div>`:`<button class="btn ghost" data-a="srsFlip">Show the answer</button>`}</div>`}

function triOf(ts){if(!ts)return null;const p=schoolPeriod(new Date(ts));return p.tri?{y:p.year,t:p.tri}:null}
function curTri(){const p=schoolPeriod();if(p.tri)return{y:p.year,t:p.tri};const d=today(),prev=[...TOGO_CAL].reverse().find(c=>d>c.t[2][1]);return{y:prev?prev.y:TOGO_CAL[0].y,t:prev?3:1}}
const selTri=()=>S.gbTri||curTri();
const triKey=(y,t)=>`${y}-T${t}`;
const fmt2=n=>n==null||isNaN(n)?"—":(Math.round(n*100)/100).toFixed(2).replace(".",",");
const rankTxt=(r,ex)=>r==null?"—":r+((r%100>10&&r%100<14)?"th":(["th","st","nd","rd"][r%10]||"th"))+(ex?" (tie)":"");
const GB_DEF={interro:1,devoir:2,quiz:1};
const gbCoef=()=>({...GB_DEF,...((S.gb||{}).coef||{})});
const dateTs=d=>new Date(String(d)+"T12:00").getTime();
function gbParts(s,y,t){const gb=S.gb||{},ev=gb.evals||{},mk=gb.marks||{},inT=ts=>{const r=triOf(ts);return!!r&&r.y===y&&r.t===t};const I=[],D=[],Q=[];
  for(const[id,e]of Object.entries(ev)){if(e.y!==y||e.t!==t)continue;const v=(mk[id]||{})[s.id];if(v===undefined||v===null||v==="")continue;const n=+v/(+e.max||20)*20;if(!isNaN(n))(e.type==="devoir"?D:I).push(n)}
  for(const[hid,f]of Object.entries(s.feedback||{})){const g=+f?.grade;if(!isNaN(g)&&inT(f.at||(s.submissions||{})[hid]?.at))I.push(g)}
  for(const f of Object.values(s.epreuveFb||{})){const g=+f?.grade;if(!isNaN(g)&&inT(f.at))D.push(g)}
  for(const a of s.attempts||[]){if(a.total&&a.quizId!=="revision"&&!String(a.quizId||"").startsWith("pic-")&&inT(a.at))Q.push(a.score/a.total*20)}
  const m=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null,c=gbCoef(),parts={interro:m(I),devoir:m(D),quiz:m(Q)};let sw=0,sc=0;
  for(const k of["interro","devoir","quiz"])if(parts[k]!=null&&+c[k]>0){sw+=parts[k]*+c[k];sc+=+c[k]}
  return{...parts,nI:I.length,nD:D.length,nQ:Q.length,avg:sc?Math.round(sw/sc*100)/100:null}}
function gbRank(y,t){const rows=S.students.map(s=>({s,...gbParts(s,y,t)})),rk=rows.filter(r=>r.avg!=null).sort((a,b)=>b.avg-a.avg);
  rk.forEach((r,i)=>{if(i>0&&rk[i-1].avg===r.avg){r.rank=rk[i-1].rank;r.ex=rk[i-1].ex=true}else r.rank=i+1});
  return{rows:[...rk,...rows.filter(r=>r.avg==null).sort((a,b)=>a.s.name.localeCompare(b.s.name))],n:rk.length,above:rk.filter(r=>r.avg>=10).length,classAvg:rk.length?rk.reduce((x,r)=>x+r.avg,0)/rk.length:null}}

/* ============ quiz en direct (style Kahoot) ============ */
const LIVE_COLORS=["#C8364F","#2F62C8","#A86F0E","#1F8A5E","#7446D6","#0B7E8E"],LIVE_SHAPES=["▲","◆","●","■","★","✚"];
const liveQs=q=>(q?.questions||[]).filter(x=>Array.isArray(x.choices)&&x.choices.length>=2&&x.answer!=null);
const liveOpen=L=>!!L&&!!L.phase&&L.phase!=="off"&&Date.now()-(L.at||0)<4*3600e3;
const livePts=(ok,ms,dur)=>ok?Math.round(1000-500*Math.min(1,(ms||0)/(dur*1000))):0;
function liveQ(L,i){const q=S.quizzes.find(x=>x.id===L.quizId),qs=liveQs(q);return qs[(L.order||[])[i]]}
const liveParts=L=>S.students.filter(s=>s.live&&s.live.sid===L.sid);
function liveBoard(L){const rows=[];for(const s of liveParts(L)){let pts=0,ok=0;for(const[i,a]of Object.entries(s.live.ans||{})){if(+i>L.i)continue;const x=liveQ(L,+i);if(x&&a&&a.c===x.answer){ok++;pts+=livePts(true,a.ms,L.dur)}}rows.push({id:s.id,name:s.name,pts,ok})}
  rows.sort((a,b)=>b.pts-a.pts||a.name.localeCompare(b.name));rows.forEach((r,i)=>r.rank=i>0&&rows[i-1].pts===r.pts?rows[i-1].rank:i+1);return rows}
function liveSet(patch){const L={...(S.liveT||{}),...patch,at:Date.now()};S.liveT=L;render();return write(()=>S.db.doc("live/"+S.uid).set(L))}
function liveChoicesHTML(ch,o={}){const tot=o.counts?o.counts.reduce((a,b)=>a+b,0):0,tag=o.act?"button":"div";
  return`<div class="live-ch">${(ch||[]).map((c,j)=>`<${tag} class="lc ${o.ans!=null?(j===o.ans?"good":"dim"):""} ${o.picked===j?"picked":""}" style="--c:${LIVE_COLORS[j%6]}" ${o.act?`data-a="${o.act}" data-k="${j}" ${o.lock?"disabled":""}`:""}>${o.counts?`<i class="fill" style="width:${pct(o.counts[j]||0,tot||1)}%"></i>`:""}<span class="sh" aria-hidden="true">${LIVE_SHAPES[j%6]}</span><span class="tx">${esc(c)}</span>${o.counts?`<span class="ct">${o.counts[j]||0}</span>`:o.ans===j?ic("check"):""}</${tag}>`).join("")}</div>`}
function livePodium(board){const top=(board||[]).slice(0,3);if(!top.length)return`<div class="empty">No players.</div>`;return`<div class="podium">${top.map((r,i)=>`<div class="glass p r${i+1}"><span class="eyebrow">${i===0?"1st place":i===1?"2nd place":"3rd place"}</span><b style="font-size:1.1rem">${esc(r.name)}</b><span class="fl">${r.pts}</span><span class="small muted">points</span></div>`).join("")}</div>`}
function liveSetupHTML(){const pc=S.liveClass||"",all=vis(S.quizzes).filter(q=>liveQs(q).length>=3),list=all.filter(q=>!pc||(pc==="hors"?!q.classe:q.classe===pc));
  return`<div class="section"><div class="glass card form live-stage"><div class="row"><span class="ic t-grad">${ic("live")}</span><div><span class="eyebrow">Like Kahoot, in your class</span><h2>Start a live quiz</h2></div></div>
  <p class="sub" style="margin:0">Show the questions on the board or read them aloud. Each student answers on their phone: the faster and more correct the answer, the more points they win (up to 1,000 per question). Ranking after each question and a final podium.</p>
  <div class="two"><label>Class<select id="lv_cls"><option value="">All</option>${PROG_CLASSES.map(c=>`<option value="${c}" ${pc===c?"selected":""}>${CL(c)}</option>`).join("")}<option value="hors" ${pc==="hors"?"selected":""}>Outside syllabus</option></select></label><label>Quiz<select id="lv_quiz">${list.map(q=>`<option value="${q.id}">${esc(q.title)} · ${liveQs(q).length} q.${q.classe?" · "+esc(CL(q.classe)):""}</option>`).join("")}</select></label></div>
  <div class="two"><label>Time per question<select id="lv_dur">${[10,15,20,30,45,60].map(n=>`<option value="${n}" ${n===20?"selected":""}>${n} seconds</option>`).join("")}</select></label><label>Number of questions<select id="lv_n">${[5,8,10,15,20].map(n=>`<option value="${n}" ${n===10?"selected":""}>${n} questions</option>`).join("")}<option value="99">All</option></select></label></div>
  <div class="row"><button class="btn" data-a="liveOpen" ${list.length?"":"disabled"}>${ic("live")}Open the room</button><span class="hint">Questions are shuffled for each game.</span></div></div></div>`}
function liveTeacherHTML(){const L=S.liveT;if(!liveOpen(L)||!S.quizzes.find(x=>x.id===L.quizId))return liveSetupHTML();
  const parts=liveParts(L),last=L.i+1>=L.n;
  const top=`<div class="row between"><div><span class="eyebrow">Live quiz · ${esc(L.title)}</span><h3>${L.phase==="lobby"?"Waiting room":L.phase==="end"?"Final podium":`Question ${L.i+1} of ${L.n}`}</h3></div><div class="row"><span class="chip ok">${ic("users")}${parts.length} player${parts.length>1?"s":""}</span><button class="btn ghost sm" data-a="livePresent">${ic("eye")}${S.present?"Exit full screen":"Full screen"}</button>${S.confirm==="liveclose"?`<button class="btn danger sm" data-a="liveClose">Confirm</button><button class="btn ghost sm" data-a="cancelDel">Cancel</button>`:`<button class="btn ghost sm" data-a="askLiveClose">${ic("x")}Close the room</button>`}</div></div>`;
  let body="";
  if(L.phase==="lobby")body=`<div class="glass card live-stage" style="text-align:center;justify-items:center"><span class="eyebrow">Ask students to open the app</span><h2 class="live-q">Join the quiz<br><span class="gradtext">${esc(L.title)}</span></h2><p class="sub">A “Live quiz” banner appears for every student in your class. ${L.n} questions · ${L.dur} seconds per question.</p><div class="live-names">${parts.map(s=>`<span class="chip">${esc(s.name)}</span>`).join("")||`<span class="muted">Waiting for the first players…</span>`}</div><button class="btn" data-a="liveNext" ${parts.length?"":"disabled"}>${ic("rocket")}Start the first question</button></div>`;
  else if(L.phase==="q"){const ans=parts.filter(s=>(s.live.ans||{})[L.i]).length,end=(L.qAt||0)+L.dur*1000;
    body=`<div class="glass card live-stage"><div class="row between"><span class="ltimer timer" data-end="${end}">${Math.max(0,Math.ceil((end-Date.now())/1000))} s</span><span class="chip">${ans}/${parts.length} answer${ans>1?"s":""}</span></div><h2 class="live-q">${esc(L.q?.q||"")}</h2>${liveChoicesHTML(L.q?.choices)}<div class="row" style="justify-content:center">${sayBtn(L.q?.q||"")}<button class="btn" data-a="liveReveal">${ic("eye")}Show the answer</button></div></div>`}
  else if(L.phase==="reveal")body=`<div class="glass card live-stage"><h2 class="live-q">${esc(L.q?.q||"")}</h2>${liveChoicesHTML(L.q?.choices,{ans:L.answer,counts:L.counts})}${L.explain?`<div class="note small">${esc(L.explain)}</div>`:""}
    <div><span class="eyebrow">Ranking</span><div class="lb">${(L.board||[]).map((r,i)=>`<div class="it"><span class="rank">${i+1}</span>${avatar(r.id||r.name,r.name)}<b>${esc(r.name)}</b><span class="mono">${r.pts} pts</span></div>`).join("")||`<span class="muted">Nobody has points yet.</span>`}</div></div>
    <div class="row" style="justify-content:center"><button class="btn" data-a="liveNext">${last?`${ic("trophy")}See the podium`:`Next question${ic("right")}`}</button></div></div>`;
  else{const all=liveBoard(L);body=`<div class="glass card live-stage">${livePodium(L.board)}${all.length?`<div class="glass tablewrap"><table><thead><tr><th>Rank</th><th>Student</th><th>Correct answers</th><th>Points</th></tr></thead><tbody>${all.map(r=>`<tr><td class="num"><b>${r.rank}</b></td><td>${esc(r.name)}</td><td class="num">${r.ok}/${L.n}</td><td class="num">${r.pts}</td></tr>`).join("")}</tbody></table></div>`:""}<div class="row" style="justify-content:center"><button class="btn" data-a="liveAgain">${ic("refresh")}New game</button><button class="btn ghost" data-a="liveClose">Close the room</button></div></div>`}
  return`<div class="section">${top}${body}</div>`}
function liveOpenRoom(){const qid=S.drafts.lv_quiz||document.getElementById("lv_quiz")?.value,q=S.quizzes.find(x=>x.id===qid);if(!q){toast("Choose a quiz.","x");return}
  const qs=liveQs(q),n=Math.min(qs.length,+(S.drafts.lv_n||10)),order=shuffle([...qs.keys()]).slice(0,n);
  liveSet({tid:S.uid,sid:"L"+Date.now().toString(36),quizId:q.id,title:q.title,phase:"lobby",i:-1,n,order,dur:+(S.drafts.lv_dur||20),q:null,qAt:0,answer:null,explain:"",counts:null,board:null,ranks:null}).then(()=>toast("Room open: students can see the banner","live"))}
function liveNext(){const L=S.liveT;if(!L)return;const i=L.i+1;if(i>=L.n){liveEnd();return}const x=liveQ(L,i);if(!x){liveEnd();return}
  liveSet({phase:"q",i,q:{q:x.q,choices:x.choices},qAt:Date.now(),answer:null,explain:"",counts:null});setTimeout(()=>{if(S.present)say(x.q)},200)}
function liveReveal(){const L=S.liveT;if(!L||L.phase!=="q")return;S.liveRev=L.sid+":"+L.i;const x=liveQ(L,L.i),parts=liveParts(L),counts=(x.choices||[]).map((c,j)=>parts.filter(s=>(s.live.ans||{})[L.i]?.c===j).length),b=liveBoard({...L});
  liveSet({phase:"reveal",answer:x.answer,explain:x.explain||"",counts,board:b.slice(0,5).map(r=>({id:r.id,name:r.name,pts:r.pts})),ranks:Object.fromEntries(b.map(r=>[r.id,[r.rank,r.pts,r.ok]])),total:b.length});beep("ok")}
function liveEnd(){const L=S.liveT,b=liveBoard({...L,i:L.n});liveSet({phase:"end",board:b.slice(0,10).map(r=>({id:r.id,name:r.name,pts:r.pts})),ranks:Object.fromEntries(b.map(r=>[r.id,[r.rank,r.pts,r.ok]])),total:b.length});beep("win");if(!LITE)confetti()}
function liveSub(){if(!S.db||!S.me||S.mode!=="student")return;const tid=S.me.teacherId||principalId();if(!tid||S.liveSubTid===tid)return;S.liveSubTid=tid;if(S.liveUnsub)try{S.liveUnsub()}catch(e){}
  S.liveUnsub=S.db.doc("live/"+tid).onSnapshot(d=>{const prev=S.live;S.live=d.exists?d.data():null;const L=S.live;
    if(L&&L.phase==="q"&&(!prev||prev.i!==L.i||prev.sid!==L.sid)){if(S.liveOn){beep("ok");if(canSpeak)setTimeout(()=>say(L.q?.q||""),250)}}
    if(L&&L.phase==="end"&&S.liveOn&&S.me&&S.me.liveDone!==L.sid&&L.ranks?.[S.uid]){const[r,pts,ok]=L.ranks[S.uid];gain(ok*10+(r<=3?30:0),`Live quiz “${L.title}”: rank ${r} of ${L.total}`,{liveDone:L.sid});if(r<=3&&!LITE)confetti()}
    render()},()=>{})}
function liveBanner(){const L=S.live;if(!liveOpen(L)||L.phase==="end"||S.liveOn)return"";return`<div class="section"><div class="live-banner"><span class="ic" style="background:rgba(255,255,255,.18);width:46px;height:46px;border-radius:14px;display:grid;place-items:center">${ic("live")}</span><div style="flex:1;min-width:0"><b>Live quiz now on!</b><div class="small" style="opacity:.9">“${esc(L.title)}” · ${L.phase==="lobby"?"the game is about to start":"question "+(L.i+1)+" of "+L.n}</div></div><button class="btn" data-a="liveJoin" style="background:#fff;color:#1E2558">Join</button></div></div>`}
function liveStudentView(){const L=S.live;const mine=S.liveMine&&S.liveMine.sid===L.sid?S.liveMine:{sid:L.sid,ans:{}},my=L.ranks?.[S.uid];
  const head=`<div class="row between"><button class="back" data-a="liveLeave">${ic("x")}Leave</button><span class="chip lvl">${L.phase==="lobby"?"Waiting room":L.phase==="end"?"Finished":"Question "+(L.i+1)+" / "+L.n}</span></div>`;
  let body="";
  if(L.phase==="lobby")body=`<div class="glass card live-stage" style="text-align:center;justify-items:center"><span class="ic t-ok" style="width:64px;height:64px">${ic("check")}</span><h2>You are in the room!</h2><p class="sub">“${esc(L.title)}” · ${L.n} questions · ${L.dur} s per question. Look at the board: the teacher will start the first question.</p></div>`;
  else if(L.phase==="q"){const k=L.sid+":"+L.i;S.liveSeen[k]=S.liveSeen[k]||Date.now();const end=S.liveSeen[k]+L.dur*1000,a=mine.ans[L.i],late=Date.now()>end;
    body=`<div class="glass card live-stage"><div class="row between"><span class="ltimer timer" data-end="${end}">${Math.max(0,Math.ceil((end-Date.now())/1000))} s</span>${sayBtn(L.q?.q||"")}</div><h2 class="live-q">${esc(L.q?.q||"")}</h2>${liveChoicesHTML(L.q?.choices,{act:"liveAns",picked:a?a.c:null,lock:!!a||late})}${a?`<p class="row" style="justify-content:center;font-weight:700">${ic("check")}Answer sent! Wait for the result…</p>`:late?`<p style="text-align:center" class="muted">Time is up.</p>`:""}</div>`}
  else if(L.phase==="reveal"){const a=mine.ans[L.i],ok=!!a&&a.c===L.answer,pts=a?livePts(ok,a.ms,L.dur):0;
    body=`<div class="glass card live-stage" style="text-align:center"><div class="live-big" style="color:${ok?"var(--ok-ink)":"var(--bad-ink)"}">${ok?"Correct!":a?"Missed…":"No answer"}</div><p class="sub" style="margin:0 auto">${ok?`+${pts} points`:"The right answer is in green."}${my?` · Your rank: <b>${my[0]}</b> of ${L.total} with ${my[1]} pts`:""}</p>${liveChoicesHTML(L.q?.choices,{ans:L.answer,picked:a?a.c:null})}${L.explain?`<div class="note small" style="text-align:left">${esc(L.explain)}</div>`:""}</div>`}
  else body=`<div class="glass card live-stage" style="text-align:center"><span class="eyebrow">Final podium · ${esc(L.title)}</span>${livePodium(L.board)}${my?`<div class="live-big">#${my[0]} <small class="muted" style="font-size:1.2rem">of ${L.total}</small></div><p class="sub" style="margin:0 auto">${my[1]} points · ${my[2]}/${L.n} correct answers · +${my[2]*10+(my[0]<=3?30:0)} XP</p>`:""}<div><button class="btn" data-a="liveLeave">Finish</button></div></div>`;

setInterval(()=>{if(typeof document==="undefined"||!document.querySelectorAll)return;document.querySelectorAll(".ltimer[data-end]").forEach(el=>{const r=Math.max(0,Math.ceil((+el.dataset.end-Date.now())/1000));el.textContent=r+" s";el.classList.toggle("low",r<=5)});

  const M=S.live;if(S.mode==="student"&&S.liveOn&&M&&M.phase==="q"){const k=M.sid+":"+M.i,seen=S.liveSeen[k];if(seen&&Date.now()>seen+M.dur*1000&&S.liveExp!==k){S.liveExp=k;render()}}},500);

const ACT_Q={h:"What is he doing?",s:"What is she doing?",t:"What are they doing?",p:"What is this person doing?",a:"What activity is it?"};

function picParts(x){const w=x.en;
  switch(x.kind){
  case"noun":case"place":return{q:x.kind==="place"?"What place is it?":x.f==="p"?"What are they?":"What is it?",say:nounSent(x),easy:w,mid:nounSent(x),acc:x.alts.flatMap(a=>[nounSent(x,a),a,`this is ${a}`,`these are ${a}`,`it is ${a}`])};
  case"action":{const s=x.f;if(s==="a")return{q:ACT_Q.a,say:cap1(w)+".",easy:w,mid:w,acc:x.alts.flatMap(a=>[a,`he is ${a}`,`she is ${a}`,`they are ${a}`,`i am ${a}`,`this person is ${a}`,`someone is ${a}`])};
    const subs=s==="p"?["he is","she is","they are","this person is","the person is","someone is"]:[SUBJ[s].toLowerCase()];
    return{q:ACT_Q[s],say:`${SUBJ[s]} ${w}.`,easy:w,mid:s==="p"?w:`${SUBJ[s]} ${w}.`,acc:x.alts.flatMap(a=>[a,...subs.map(p=>`${p} ${a}`)])}}
  case"job":{const s=x.f,P=s==="h"?"He is":s==="s"?"She is":"This person is";const sub=s==="h"?["he is","his job is"]:s==="s"?["she is","her job is"]:["this person is","he is","she is","they are"];
    return{q:s==="h"?"What does he do?":s==="s"?"What does she do?":"What does this person do?",say:`${P} ${art(w)} ${w}.`,easy:w,mid:`${P} ${art(w)} ${w}.`,acc:x.alts.flatMap(a=>[a,...sub.map(p=>`${p} ${art(a)} ${a}`),...sub.map(p=>`${p} ${a}`)])}}
  case"feel":return{q:"How does this person feel?",say:`This person is ${w}.`,easy:w,mid:w,acc:x.alts.flatMap(a=>[a,`he is ${a}`,`she is ${a}`,`they are ${a}`,`i am ${a}`,`this person is ${a}`,`he feels ${a}`,`she feels ${a}`])};
  case"weather":return{q:"What's the weather like?",say:`It's ${w}.`,easy:w,mid:`It's ${w}.`,acc:x.alts.flatMap(a=>[a,`it is ${a}`,`it is ${a} today`,`the weather is ${a}`])};
  case"color":return{q:"What colour is it?",say:`It's ${w}.`,easy:w,mid:w,acc:[w,`it is ${w}`,w==="purple"?"violet":w]};
  case"num":return{q:"How many?",say:`There ${x.n>1?"are":"is"} ${w} ${x.n>1?x.thing:x.thing.replace(/s$/,"")}.`,easy:w,mid:w,acc:[w,String(x.n),`there are ${w}`,`there are ${w} ${x.thing}`,`${w} ${x.thing}`]}}}
const PIC_TIP_OLD={action:"For an action happening now, use the present continuous: subject + be + verb-ing (She is running).",job:"For a job, always use a / an: She is a doctor. He is an engineer.",noun:"Do not forget the article: a before a consonant (a dog), an before a vowel (an apple).",place:"To name a place: It's a school. It's an airport.",weather:"For the weather, start with It's…: It's sunny. It's raining.",feel:"For a feeling: be + adjective (I am happy, she is tired)."};
function picTip(x,P){const w=x.en,a=art(w);switch(x.kind){
  case"noun":case"place":return x.f==="u"?`“${w}” is uncountable: no a / an. Just say: It's ${w}.`:x.f==="p"?`“${w}” is plural: say They are ${w}.`:`Say “${a} ${w}”: ${a==="an"?"an before a vowel sound (an apple, an umbrella)":"a before a consonant sound (a dog, a book)"}.`;
  case"action":return`Action happening now = present continuous: subject + be + verb-ing. ${P.say}`;
  case"job":return`For a job, always use a / an: ${P.say}`;
  case"weather":return`For the weather, start with It's: ${P.say}`;
  case"feel":return`For a feeling: be + adjective. I am ${w}. She is ${w}.`;
  case"color":return`In English, the colour comes before the noun: a ${w} car, a ${w} dress.`;
  case"num":return`${cap1(w)} = ${x.n}. For more than one, say There are ${w} ${x.thing}.`}return""}
function picQuestion(x,pool,lvl){const P=picParts(x),q={q:P.q,pic:x.pic,say:P.say,fr:x.fr};
  q.explain=picTip(x,P);
  if(lvl==="hard"){q.type="type";q.accept=[P.say,...P.acc];return q}
  const key=lvl==="easy"?"easy":"mid",right=P[key],same=pool.filter(o=>o.en!==x.en&&o.kind===x.kind&&(x.kind!=="action"||o.f===x.f||x.f==="p"||x.f==="a"||lvl==="easy")),pref=same.filter(o=>o.theme&&o.theme===x.theme),src=shuffle([...(pref.length>=3?pref:same)]);
  const ch=[right];for(const o of src){if(ch.length>=(lvl==="easy"?3:4))break;let t=picParts({...o,f:x.kind==="action"||x.kind==="job"?x.f:o.f})[key];if(!ch.includes(t))ch.push(t)}
  const order=shuffle([...ch.keys()]);q.choices=order.map(i=>ch[i]);q.answer=order.indexOf(0);return q}
function teacherPicQ(p,all,lvl){const DQ={noun:"What is it?",action:"What is the person doing?",job:"What does this person do?",place:"What place is it?"};
  const q={q:p.prompt||DQ[p.kind]||"What can you see?",picId:p.picId,say:p.answer,fr:p.fr||"",explain:p.fr?`${p.answer} = ${p.fr}`:""};
  if(lvl==="hard"){q.type="type";q.accept=[p.answer,...(p.alt||[])];return q}
  const others=shuffle(all.filter(o=>o.id!==p.id&&o.answer!==p.answer).map(o=>o.answer));if(others.length<2){const map={noun:"nouns",action:"actions",job:"jobs",place:"places"};for(const x of shuffle(picPool(map[p.kind]||"nouns")).slice(0,4))others.push(picParts(x).say)}
  const ch=[p.answer,...[...new Set(others)].slice(0,3)],order=shuffle([...ch.keys()]);q.choices=order.map(i=>ch[i]);q.answer=order.indexOf(0);return q}
function startPic(k){const m=PIC_MODES.find(x=>x.k===k)||PIC_MODES[0],lvl=(S.picHard??picHardDefault())?"hard":(S.me?.profile==="primaire"?"easy":"mid");let qs=[];

  else if(k==="mix"){const keys=picModesFor().map(x=>x.k).filter(x=>x!=="mix"&&x!=="teacher");const tp=vis(S.pictures).filter(visible);for(let i=0;i<10;i++){const kk=keys[i%keys.length],pool=picPool(kk);if(!pool.length)continue;let x,tries=0;do{x=pool[Math.random()*pool.length|0]}while(tries++<20&&qs.some(q=>q.pic===x.pic));qs.push(picQuestion(x,pool,lvl))}if(tp.length)qs.splice(3,1,teacherPicQ(tp[Math.random()*tp.length|0],tp,lvl));qs=shuffle(qs)}

function talkPrompt(start){const m=S.me||{},T=S.talk,sc=TALK_SC.find(x=>x.k===T.sc)||TALK_SC[0],lvl=m.level||"A2";

function finishQuiz(q){const r=S.run;if(!r||r.finished)return;r.finished=true;const tot=q.questions.length;
  for(let i=0;i<tot;i++)if(r.answers[i]===undefined&&!r.wrong.includes(i))r.wrong.push(i);
  r.i=tot;const perfect=r.score===tot;if(perfect||r.score/tot>=.7){beep("win");confetti()}
  if(S.me&&S.mode==="student"){const att={quizId:q.id,title:q.title,score:r.score,total:tot,wrong:r.wrong,at:Date.now()};if(r.temp?.kind==="ai"||r.temp?.kind==="pic")att.wrongQ=r.wrong.slice(0,10).map(i=>q.questions[i]).filter(Boolean);if(r.exam)att.exam=true;
    gain(r.score*10+(perfect?50:0),`${r.exam?"Finished the exam":"Finished"} “${q.title}”: ${r.score}/${tot}`,{attempts:[...(S.me.attempts||[]),att].slice(-150)})}}

setInterval(()=>{const r=S.run;if(!r||!r.exam||r.finished)return;const left=Math.max(0,r.deadline-Date.now()),el=$("#examTimer");
  if(el){const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);el.lastChild.textContent=`${m}:${String(s).padStart(2,"0")}`;el.classList.toggle("low",left<60000)}
  if(left<=0){const q=curQuiz();if(q){finishQuiz(q);toast("Time is up: your exam has been sent.","timer");render()}}},1000);

function startEdit(kind,id){const x=S[{lessons:"lessons",quizzes:"quizzes",decks:"decks",homework:"homework",epreuves:"eps"}[kind]].find(y=>y.id===id);if(!x)return;const f=KIND_FORM[kind];
  for(const k of FORM_FIELDS[f])delete S.drafts[k];
  const D=S.drafts,au=x.audience||"tous";D.l_aud=D.q_aud=D.d_aud=D.h_aud=D.e_aud=au;
  if(f==="ep"){const c=S.corriges[id]||{};D.e_title=x.title;D.e_exam=x.exam||"Autre";D.e_year=x.year||"";D.e_level=x.level;D.e_min=x.minutes?String(x.minutes):"";D.e_sujet=x.sujet||"";D.e_cor=c.text||"";D.e_auto=x.autoCorrect?"1":"";D.e_amode=x.autoMode||"live"}
  if(f==="lesson"){D.l_title=x.title;D.l_level=x.level;D.l_body=x.body||"";D.l_cls=x.classe||"";D.l_unit=x.unit?String(x.unit):"";D.l_theme=x.theme||"";D.l_gram=x.grammar||""}
  if(f==="quiz"){D.q_title=x.title;D.q_level=x.level;D.q_lesson=x.lessonId||"";D.q_body=quizToText(x.questions);D.q_exam=x.exam?"1":"";D.q_min=String(x.minutes||10)}
  if(f==="deck"){D.d_title=x.title;D.d_level=x.level;D.d_body=deckToText(x.cards)}
  if(f==="hw"){D.h_title=x.title;D.h_level=x.level;D.h_due=x.due||"";D.h_body=x.instructions||"";D.h_auto=x.autoCorrect?"1":"";D.h_amode=x.autoMode||"live"}
  S.create=f;S.editing={kind,id,title:x.title};scrollTo({top:0,behavior:reduceMotion?"auto":"smooth"})}
function cancelEdit(){clearScan("sujet");clearScan("cor");if(S.editing)for(const k of FORM_FIELDS[KIND_FORM[S.editing.kind]])delete S.drafts[k];S.editing=null}
function saveContent(col,data){const ed=S.editing&&S.editing.kind===col?S.editing:null;

function loadImg(file){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
async function enhanceImage(file,mode,rot){
  const img=await loadImg(file),sw=img.naturalWidth,sh=img.naturalHeight,swap=rot%180!==0,longest=Math.max(sw,sh);
  const target=Math.min(2400,Math.max(1600,longest)),k=target/longest,W=Math.round((swap?sh:sw)*k),H=Math.round((swap?sw:sh)*k);
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d",{willReadFrequently:true});x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";
  x.fillStyle="#fff";x.fillRect(0,0,W,H);x.translate(W/2,H/2);x.rotate(rot*Math.PI/180);x.drawImage(img,-sw*k/2,-sh*k/2,sw*k,sh*k);x.setTransform(1,0,0,1,0,0);URL.revokeObjectURL(img.src);
  if(mode!=="orig"){
    const id=x.getImageData(0,0,W,H),d=id.data,N=W*H,L=new Float32Array(N);
    for(let i=0,j=0;i<N;i++,j+=4)L[i]=.299*d[j]+.587*d[j+1]+.114*d[j+2];
    /* paper background estimate: downscale, dilate (erase ink), blur */
    const C=16,bw=Math.max(4,Math.ceil(W/C)),bh=Math.max(4,Math.ceil(H/C)),s=document.createElement("canvas");s.width=bw;s.height=bh;const sx=s.getContext("2d",{willReadFrequently:true});sx.imageSmoothingQuality="high";sx.drawImage(c,0,0,bw,bh);
    const sd=sx.getImageData(0,0,bw,bh).data;let B=new Float32Array(bw*bh);for(let i=0;i<B.length;i++)B[i]=.299*sd[i*4]+.587*sd[i*4+1]+.114*sd[i*4+2];
    const pass=(A,isMax,r)=>{const O=new Float32Array(A.length);for(let yy=0;yy<bh;yy++)for(let xx=0;xx<bw;xx++){let v=isMax?0:0,n=0;for(let dy=-r;dy<=r;dy++){const y2=yy+dy<0?0:yy+dy>=bh?bh-1:yy+dy;for(let dx=-r;dx<=r;dx++){const x2=xx+dx<0?0:xx+dx>=bw?bw-1:xx+dx,a=A[y2*bw+x2];if(isMax){if(a>v)v=a}else{v+=a;n++}}}O[yy*bw+xx]=isMax?v:v/n}return O};
    B=pass(pass(B,true,2),false,2);
    for(let y=0;y<H;y++){const fy=Math.min(bh-1.001,Math.max(0,y/C-.5)),y0=fy|0,ty=fy-y0;for(let xx=0;xx<W;xx++){const fx=Math.min(bw-1.001,Math.max(0,xx/C-.5)),x0=fx|0,tx=fx-x0,i0=y0*bw+x0;
      const bg=(B[i0]*(1-tx)+B[i0+1]*tx)*(1-ty)+(B[i0+bw]*(1-tx)+B[i0+bw+1]*tx)*ty,p=y*W+xx;let n=L[p]/Math.max(bg,8);n=(n-.32)/(.90-.32);n=n<0?0:n>1?1:n;L[p]=Math.pow(n,1.35)}}
    for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const p=y*W+xx,j=p*4,v=L[p];
      const nb=(L[y>0?p-W:p]+L[y<H-1?p+W:p]+L[xx>0?p-1:p]+L[xx<W-1?p+1:p])/4;let o=v+.55*(v-nb);o=o<0?0:o>1?1:o;
      if(mode==="bw")o=o<.5?Math.pow(o*2,2.2)/2:1-Math.pow((1-o)*2,2.2)/2;
      if(mode==="color"){const lum=(.299*d[j]+.587*d[j+1]+.114*d[j+2])||1,f=o*255/lum;for(let ch=0;ch<3;ch++){const g=o*255;let cv=d[j+ch]*f;cv=g+(cv-g)*1.15;d[j+ch]=cv<0?0:cv>255?255:cv}}
      else{const g=o*255;d[j]=d[j+1]=d[j+2]=g}}
    x.putImageData(id,0,0)}
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.92));return{blob,w:W,h:H}}
async function handleScan(k,file){if(!file)return;const old=S.scan[k];if(old){if(old.origUrl)URL.revokeObjectURL(old.origUrl);if(old.url&&old.url!==old.origUrl)URL.revokeObjectURL(old.url)}
  if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)){S.scan[k]={isPdf:true,blob:file,name:file.name,type:"application/pdf"};render();return}
  if(!/^image\//.test(file.type||"")){toast("Choose a photo or a PDF.","x");return}
  const origUrl=URL.createObjectURL(file);S.scan[k]={file,origUrl,url:origUrl,name:(file.name||"photo").replace(/\.[^.]+$/,"")+"-HD.jpg",mode:"doc",rot:0,busy:true};render();reprocess(k)}

  try{const out=await enhanceImage(sc.file,sc.mode,sc.rot);if(S.scan[k]!==sc)return;if(sc.url&&sc.url!==sc.origUrl)URL.revokeObjectURL(sc.url);sc.blob=out.blob;sc.type="image/jpeg";sc.url=URL.createObjectURL(out.blob);sc.w=out.w;sc.h=out.h}

function aiContext(){
  if(S.mode==="teacher")return`The user is the English TEACHER who manages the class (${S.students.length} learners: middle school, high school, university students and adults). Help her prepare lessons, quizzes, tests, answer keys, report comments and activities. For a quiz meant for the app, use exactly this format: one question per block, one empty line between two questions, "* " before the correct answer and "- " before the wrong ones; for a written answer: the question, then "= answer1 / answer2". For a vocabulary list: one line per word, "word | simple English meaning | example".`;
  if(isParent(S.me))return`The user is a student's PARENT (child: ${S.me.childName||"not specified"}${S.me.childClasse?", class "+S.me.childClasse:""}). Answer simply, with practical tips to help the child.`;
