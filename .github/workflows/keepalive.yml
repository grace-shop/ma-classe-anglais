name: Garder Supabase éveillé
# Sur l'offre gratuite, Supabase met le projet en pause après 7 jours sans activité.
# Cette tâche fait une petite visite tous les 3 jours pour l'en empêcher (vacances comprises).
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Petite visite à la base de données
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ]; then URL=$(grep -o 'supabaseUrl: *"[^"]*"' www/config.js | sed 's/.*"\(.*\)"/\1/'); fi
          if [ -z "$KEY" ]; then KEY=$(grep -o 'supabaseAnonKey: *"[^"]*"' www/config.js | sed 's/.*"\(.*\)"/\1/'); fi
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Adresse Supabase introuvable"; exit 0; fi
          curl -s -o /dev/null -w "base : %{http_code}\n" "$URL/rest/v1/docs?select=path&limit=1" -H "apikey: $KEY"
          curl -s -o /dev/null -w "comptes : %{http_code}\n" "$URL/auth/v1/health" -H "apikey: $KEY"
