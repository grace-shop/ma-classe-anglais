name: Application Android (APK)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Réglages Supabase
        run: node scripts/write-config.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - name: Numéro de version
        run: |
          BUILD=$(git rev-list --count HEAD)
          echo "BUILD=$BUILD" >> $GITHUB_ENV
          echo "{\"build\": $BUILD, \"sha\": \"${GITHUB_SHA::7}\"}" > www/version.json
          echo "{\"build\": $BUILD, \"sha\": \"${GITHUB_SHA::7}\", \"apk\": \"https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/ma-classe-anglais.apk\", \"date\": \"$(date -u +%Y-%m-%dT%H:%MZ)\"}" > apk-version.json
          cat apk-version.json
      - name: Clé de signature secrète (mise à jour sans désinstaller)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Ajoute les secrets ANDROID_KEYSTORE_B64 et ANDROID_KEYSTORE_PASS (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ks"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks/release.keystore"
          echo "EC_KEYSTORE=$RUNNER_TEMP/ks/release.keystore" >> $GITHUB_ENV
          echo "::add-mask::$KS_PASS"
          echo "EC_KS_PASS=$KS_PASS" >> $GITHUB_ENV
      - name: Installer Capacitor
        run: npm install --legacy-peer-deps
      - name: Créer le projet Android
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx @capacitor/assets generate --android --iconBackgroundColor '#0E1120' --splashBackgroundColor '#0E1120' || echo "icônes par défaut"
          npx cap sync android
      - name: Compiler l'APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > android/local.properties
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ma-classe-anglais.apk
      - uses: actions/upload-artifact@v4
        with: { name: ma-classe-anglais-apk, path: ma-classe-anglais.apk }
      - name: Publier dans « Releases »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: English Classes — application Android
          body: |
            Téléchargez **ma-classe-anglais.apk** sur votre téléphone Android, ouvrez-le et acceptez « Installer des applications inconnues ».
            Version construite automatiquement depuis le commit ${{ github.sha }}.
          files: |
            ma-classe-anglais.apk
            apk-version.json
          make_latest: true
