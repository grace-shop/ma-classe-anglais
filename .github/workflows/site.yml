name: Site en ligne (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: site, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.pages.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Réglages Supabase
        run: node scripts/write-config.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - name: Numéro de version
        run: |
          echo "{\"build\": $(git rev-list --count HEAD), \"sha\": \"${GITHUB_SHA::7}\"}" > www/version.json
          cat www/version.json
      - name: Publier sur la branche gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Site : ${{ github.sha }}"
      # Si GitHub Pages est réglé sur « GitHub Actions », on publie aussi directement (sinon ces étapes sont ignorées)
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Paquet du site
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with: { path: ./www }
      - name: Publication directe
        id: pages
        uses: actions/deploy-pages@v4
        continue-on-error: true
