name: Vidéos YouTube vers Posts
# Toutes les 30 minutes : demande à la fonction « youtube-sync » de Supabase de publier
# dans « Posts » les nouvelles vidéos de la chaîne. Peut aussi être lancé à la main (Actions → Run workflow).
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchroniser
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SECRET: ${{ secrets.YT_SYNC_SECRET }}
        run: |
          if [ -z "$URL" ]; then URL=$(grep -o 'supabaseUrl: *"[^"]*"' www/config.js | sed 's/.*"\(.*\)"/\1/'); fi
          if [ -z "$KEY" ]; then KEY=$(grep -o 'supabaseAnonKey: *"[^"]*"' www/config.js | sed 's/.*"\(.*\)"/\1/'); fi
          if [ -z "$URL" ] || [ -z "$KEY" ] || [ -z "$SECRET" ]; then echo "Réglages manquants (SUPABASE_URL, clé anon ou YT_SYNC_SECRET)"; exit 1; fi
          curl -sS --fail-with-body -X POST "$URL/functions/v1/youtube-sync" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "x-sync-secret: $SECRET"
